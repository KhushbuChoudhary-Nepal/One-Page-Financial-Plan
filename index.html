<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#14274A; --teal:#0B6F5C; --teal-lit:#22A88F; --gold:#9C7222; --amber:#E8A81C;
  --paper:#EDF1F6; --card:#FFFFFF; --sunk:#E3E9F1;
  --ink:#14274A; --ink-2:#3A4E66; --mute:#66788E; --faint:#93A4B8;
  --rule:#D8DFE9; --rule-2:#EAEFF5;
  /* The stage is what gets screen-shared, so it stays white in both themes —
     a dark block projected into a lit meeting room is hard to read. */
  --stage:#FFFFFF; --stage-ink:#14274A; --stage-mute:#66788E; --stage-rule:#DBE1E9;
  --stage-soft:#EDF1F6;
  --f-d:'Sora',system-ui,sans-serif;
  --f-b:'IBM Plex Sans',system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0A1320; --card:#111E2E; --sunk:#0D1926;
  --ink:#E8EFF6; --ink-2:#C3D3E2; --mute:#8DA2B8; --faint:#6A7E95;
  --rule:#22334A; --rule-2:#18273A; --teal:#22A88F; --gold:#C79235;
}}
:root[data-theme="dark"]{
  --paper:#0A1320; --card:#111E2E; --sunk:#0D1926;
  --ink:#E8EFF6; --ink-2:#C3D3E2; --mute:#8DA2B8; --faint:#6A7E95;
  --rule:#22334A; --rule-2:#18273A; --teal:#22A88F; --gold:#C79235;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* the house header: logo left, what this is in the middle, planner right */
.bar{background:var(--navy);color:#fff;padding:13px 20px 15px}
.bwrap{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:150px 1fr 150px;
  align-items:center;gap:16px}
.blogo img{width:96px;height:auto;display:block}
.btitle{text-align:center;min-width:0}
.btitle h1{font-family:var(--f-d);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;
  text-wrap:balance}
.bpl{text-align:right}
.bpl .k{font-family:var(--f-m);font-size:9px;letter-spacing:.16em;color:#8FA9C2}
.bpl .v{font-family:var(--f-d);font-weight:700;font-size:13px;color:#E0B65C;margin-top:2px}
.barmeta{font-family:var(--f-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#9DB3CC;margin:5px 0 0;line-height:1.5}
@media(max-width:700px){
  .bwrap{grid-template-columns:1fr auto;gap:10px 12px}
  .btitle{grid-column:1/-1;order:3;text-align:left}
  .btitle h1{font-size:17px}
  .blogo img{width:78px}
  .bpl .v{font-size:12px}
}
.lab{font-family:var(--f-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

.aud{max-width:520px;margin:0 auto;padding:22px 16px 60px}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px 20px}
.qn{font-family:var(--f-m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal);margin:0 0 10px}
.qtext{font-family:var(--f-d);font-weight:700;font-size:23px;line-height:1.3;margin:0 0 18px;
  text-wrap:balance;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1.5px solid var(--rule);border-radius:11px;padding:15px 16px;
  font-size:15.5px;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--mute)}
.opt .key{flex:0 0 24px;height:24px;border-radius:6px;background:var(--sunk);color:var(--mute);
  font-family:var(--f-m);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.opt.on{border-color:var(--teal);background:rgba(11,111,92,.09);font-weight:600}
.opt.on .key{background:var(--teal);color:#fff}
.opt:disabled{opacity:.55;cursor:default}
.aud .note{margin:16px 0 0;font-size:13px;color:var(--mute);line-height:1.6;text-align:center}
.rest{text-align:center;padding:44px 20px}
.rest h2{font-family:var(--f-d);font-weight:700;font-size:21px;margin:14px 0 6px}
.rest p{margin:0;font-size:14px;color:var(--mute);line-height:1.6}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);display:inline-block;
  animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

.res{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.rrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline}
.rname{font-size:14.5px;color:var(--ink-2)}
.rpct{font-family:var(--f-m);font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.rtrack{grid-column:1/-1;height:13px;border-radius:99px;background:var(--sunk);overflow:hidden}
.rfill{display:block;height:100%;border-radius:99px;background:var(--teal);
  transition:width .45s cubic-bezier(.22,.8,.3,1)}
.rrow.top .rfill{background:var(--amber)}
.rrow.top .rpct{color:var(--gold)}

.pres{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 52px)}
@media(max-width:900px){.pres{grid-template-columns:1fr}}
.side{border-right:1px solid var(--rule);background:var(--card);padding:16px;
  display:flex;flex-direction:column;gap:14px}
.qlist{display:flex;flex-direction:column;gap:6px}
.qbtn{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start;text-align:left;
  background:none;border:1px solid transparent;border-radius:9px;padding:9px 10px;cursor:pointer;
  color:var(--ink-2);font-size:13px;line-height:1.4}
.qbtn:hover{background:var(--rule-2)}
.qbtn.on{background:var(--sunk);border-color:var(--rule);color:var(--ink);font-weight:600}
.qbtn i{font-style:normal;font-family:var(--f-m);font-size:10.5px;color:var(--faint);padding-top:2px}
.qbtn.on i{color:var(--teal)}
.mini{background:none;border:1px dashed var(--rule);border-radius:8px;padding:8px;width:100%;
  font-size:12.5px;color:var(--mute);cursor:pointer}
.mini:hover{border-color:var(--teal);color:var(--teal)}

.stage{background:var(--stage);color:var(--stage-ink);border-left:1px solid var(--rule);padding:26px 30px 30px;
  display:flex;flex-direction:column;gap:20px}
.stagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  border-bottom:1px solid var(--stage-rule);padding-bottom:14px}
.stagehead .lab{color:var(--stage-mute)}
.headright{display:flex;align-items:flex-start;gap:34px;text-align:right}
.clock{font-family:var(--f-m);font-size:30px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--stage-mute)}
.count{font-family:var(--f-m);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.count small{font-size:12px;font-weight:400;color:var(--stage-mute);margin-left:7px}
.sq{font-family:var(--f-d);font-weight:700;font-size:clamp(24px,3.1vw,38px);line-height:1.2;margin:0;
  letter-spacing:-.02em;text-wrap:balance}
.sres{display:flex;flex-direction:column;gap:14px;margin-top:2px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;align-items:baseline}
.sname{font-size:clamp(15px,1.5vw,19px)}
.sn{font-family:var(--f-m);font-size:14px;color:var(--stage-mute);font-variant-numeric:tabular-nums}
.spct{font-family:var(--f-m);font-size:clamp(17px,1.9vw,22px);font-weight:600;
  font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.strack{grid-column:1/-1;height:20px;border-radius:99px;background:var(--stage-soft);overflow:hidden}
.sfill{display:block;height:100%;border-radius:99px;background:#0B6F5C;
  transition:width .5s cubic-bezier(.22,.8,.3,1)}
.srow.top .sfill{background:#E8A81C}
.srow.top .spct{color:#9C7222}
.hidden-note{font-family:var(--f-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--stage-mute)}
.ctrl{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto;padding-top:18px;border-top:1px solid var(--stage-rule)}
.b{border:1px solid var(--stage-rule);background:var(--stage-soft);color:var(--stage-ink);
  border-radius:9px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .12s}
.b:hover{background:#E1E8F1}
.b.go{background:#0B6F5C;border-color:#0B6F5C;color:#fff}
.b.go:hover{background:#0A5F50}
.b.warn{color:#C0392B}
.b:disabled{opacity:.4;cursor:not-allowed}

.join{background:var(--sunk);border:1px solid var(--rule);border-radius:11px;padding:13px}
.join .url{font-family:var(--f-m);font-size:11px;word-break:break-all;color:var(--ink-2);margin:7px 0 0;line-height:1.5}
#qr{margin-top:11px;display:flex;justify-content:center}
#qr img,#qr canvas{border-radius:6px;display:block}

.gate{max-width:380px;margin:70px auto;padding:0 18px;text-align:center}
.gate h2{font-family:var(--f-d);font-weight:700;font-size:22px;margin:0 0 6px}
.gate p{margin:0 0 18px;font-size:13.5px;color:var(--mute);line-height:1.6}
/* A real password field makes the browser offer to save it, and the popup lands
   on top of the box mid-typing. This is not a login, so it is a plain field that
   hides what is typed instead. */
.mask{-webkit-text-security:disc;text-security:disc;letter-spacing:.12em;}
input[type=text],input[type=password],textarea{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-family:var(--f-b);font-size:14.5px}
textarea{resize:vertical;line-height:1.5}
.b2{width:100%;margin-top:10px;background:var(--teal);border:none;color:#fff;border-radius:9px;
  padding:12px;font-size:14.5px;font-weight:600;cursor:pointer}
.ed{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:14px;
  display:flex;flex-direction:column;gap:9px}
.ed .row{display:flex;gap:8px}
.ed .row .b2{margin-top:0}
.b2.ghost{background:none;border:1px solid var(--rule);color:var(--mute)}
.err{color:#C0392B;font-size:13px;margin:9px 0 0}
.foot{text-align:center;font-family:var(--f-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:22px 16px 30px}

/* ── topic chips ─────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:99px;
  padding:4px 9px;font-family:var(--f-b);font-size:11.5px;cursor:pointer;line-height:1.5}
.chip i{font-style:normal;font-family:var(--f-m);font-size:10px;color:var(--faint)}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.chip.on i{color:#9DB3CC}
.qbtn .ns{display:block;font-weight:400;font-family:var(--f-m);font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.chk input{margin-top:2px}
.ed select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-family:var(--f-b);font-size:14px}

/* ── report ──────────────────────────────────────────────────── */
.repwrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px}
.reptools{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:14px}
/* A fixed three-column grid, with every box bottom-aligned in its row — an
   auto-fitting grid put the date a line lower than the place beside it. */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.mgrid label{display:flex;flex-direction:column;gap:5px;min-width:0}
.mgrid .lab{line-height:1.4}
/* one height for every box, so the tops line up across the row whatever the
   browser does with a date or a select */
.mgrid input,.mgrid select{width:100%;height:44px;padding-top:0;padding-bottom:0}

@media(max-width:720px){ .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:460px){ .mgrid{grid-template-columns:1fr} }
.mgrid .b2{margin-top:0;grid-column:1 / -1}
.past{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:5px}
.pastrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;text-align:left;
  background:none;border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--ink-2)}
.pastrow:hover{background:var(--rule-2);border-color:var(--rule)}
.pastrow b{font-size:13px;color:var(--ink)}
.pastrow span{font-size:11.5px;color:var(--mute)}
.pastrow i{font-style:normal;font-family:var(--f-m);font-size:12.5px;font-weight:600;color:var(--teal)}

.doc{background:#fff;color:#14274A;border:1px solid var(--rule);border-radius:12px;
  padding:0 24px;overflow:hidden}
/* The mark is white artwork, so it needs the navy behind it — the same band the
   plan tool's report opens with. */
.doc .dtop{display:grid;grid-template-columns:118px 1fr 128px;align-items:center;gap:16px;
  background:#14274A;margin:0 -24px;padding:13px 24px}
.dlogo img{width:96px;height:auto;display:block}
.dtitle{text-align:center}
.dtitle h1{font-family:var(--f-d);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;color:#fff}
.dtitle p{margin:4px 0 0;font-size:12px;color:#A9C2DA}
.dpl{text-align:right}
.dpl .k{font-family:var(--f-m);font-size:8.5px;letter-spacing:.16em;color:#8FA9C2}
.dpl .v{font-family:var(--f-d);font-weight:700;font-size:12.5px;color:#E0B65C;margin-top:2px}

.facts{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#DBE1E9;
  border:1px solid #DBE1E9;margin:14px 0 0}
.facts div{background:#fff;padding:7px 10px}
.facts span{display:block;font-family:var(--f-m);font-size:8.5px;letter-spacing:.13em;
  text-transform:uppercase;color:#95A5B8}
.facts b{display:block;font-size:14px;margin-top:3px;color:#14274A}

.score{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center;
  background:#EDF1F6;border-radius:10px;padding:13px 16px;margin:12px 0 0}
.sleft .lab{color:#66788E}
.big{font-family:var(--f-d);font-weight:800;font-size:46px;line-height:1;color:#0B6F5C;margin-top:4px}
.big em{font-style:normal;font-size:22px;margin-left:2px}
.bandname{font-family:var(--f-m);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:#9C7222;margin-top:5px}
.scale{position:relative;height:12px;border-radius:99px;background:#DBE1E9;overflow:hidden}
.scale i{display:block;height:100%;background:#0B6F5C;border-radius:99px}
.scale u{position:absolute;top:0;bottom:0;width:1px;background:#fff}
.scale u.m40{left:40%} .scale u.m70{left:70%}
.scalelab{display:flex;justify-content:space-between;font-family:var(--f-m);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#95A5B8;margin-top:5px}
.bandnote{margin:9px 0 0;font-size:12.5px;line-height:1.55;color:#3A4E66}

.trow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin:12px 0 0}
.tcell span{display:block;font-size:11px;color:#66788E}
.tcell b{display:block;font-family:var(--f-m);font-size:15px;color:#14274A;margin:2px 0 4px}
.tbar{display:block;height:7px;border-radius:99px;background:#DBE1E9;overflow:hidden}
.tbar u{display:block;height:100%;background:#9C7222;border-radius:99px}

.qwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.qb{border:1px solid #DBE1E9;border-radius:9px;padding:9px 11px;break-inside:avoid}
.qbh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qbh h3{font-family:var(--f-d);font-weight:700;font-size:13px;margin:0;line-height:1.3;color:#14274A}
.tag{font-family:var(--f-m);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#95A5B8;white-space:nowrap}
.qbars{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.qbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.qbar .on{font-size:11.5px;color:#3A4E66}
.qbar .op{font-family:var(--f-m);font-size:11.5px;font-weight:600;color:#14274A}
.qbar i{grid-column:1/-1;display:block;height:7px;border-radius:99px;background:#EDF1F6;overflow:hidden}
.qbar u{display:block;height:100%;background:#0B6F5C;border-radius:99px}
.qbar.top u{background:#E8A81C}
.qbar.top .op{color:#9C7222}
.qbn{margin:7px 0 0;font-family:var(--f-m);font-size:9.5px;letter-spacing:.06em;color:#95A5B8}
.method{margin:12px 0 10px;font-size:9.5px;line-height:1.6;color:#66788E}
.nodata{margin:14px 0 0;font-size:12.5px;color:#66788E;background:#EDF1F6;padding:12px;border-radius:8px}
.dend{background:#14274A;color:#fff;text-align:center;padding:8px;margin:0 -24px;
  font-family:var(--f-d);font-weight:700;font-size:14px}
.dend span{font-family:var(--f-m);font-weight:600;font-size:8px;letter-spacing:.3em;color:#E8A81C}

@media(max-width:760px){
  .facts{grid-template-columns:repeat(2,1fr)}
  .score{grid-template-columns:1fr;gap:14px}
  .qwrap{grid-template-columns:1fr}
  .doc .dtop{grid-template-columns:1fr;text-align:center;justify-items:center}
  .dpl{text-align:center}
}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff}
  .bar,.reptools,.foot{display:none!important}
  .repwrap{padding:0;max-width:none}
  .doc{border:none;border-radius:0;padding:0 4mm}
  /* An A4 page is narrower than a laptop, so the phone layout above would
     otherwise take over and stack everything down two pages. */
  .doc .dtop{grid-template-columns:110px 1fr 120px;text-align:left;margin:0 -4mm;padding:10px 4mm}
  .dtitle{text-align:center} .dpl{text-align:right}
  .dtitle h1{font-size:17pt} .dtitle p{font-size:9pt}
  .facts{grid-template-columns:repeat(6,1fr);margin-top:10px}
  .facts span{font-size:6pt} .facts b{font-size:10.5pt}
  .score{grid-template-columns:150px 1fr;gap:16px;padding:11px 13px;margin-top:10px}
  .big{font-size:34pt} .big em{font-size:15pt}
  .bandnote{font-size:9pt}
  .trow{grid-template-columns:repeat(auto-fit,minmax(95px,1fr));margin-top:10px}
  .tcell b{font-size:11.5pt}
  .qwrap{grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
  .qbh h3{font-size:9.6pt}
  .qbar .on,.qbar .op{font-size:8.6pt}
  .qbn{font-size:7pt}
  .method{font-size:6.8pt;margin:10px 0 8px}
  .dend{margin:0 -4mm;padding:7px;font-size:11pt}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ── home screen ─────────────────────────────────────────────── */
.homewrap{max-width:820px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:16px}
.hcard{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px}
.hcard h2{font-family:var(--f-d);font-weight:700;font-size:18px;margin:0 0 5px}
.hsub{margin:0 0 15px;font-size:13px;color:var(--mute);line-height:1.6}
.hcard .b2.ghost{margin-top:8px}

/* ── a question lined up but not yet asked ───────────────────── */
.prev{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pv{display:flex;align-items:center;gap:12px;border:1px solid var(--stage-rule);
  border-radius:10px;padding:11px 14px;font-size:clamp(14px,1.4vw,17px);color:var(--stage-ink)}
.pv span{flex:0 0 22px;height:22px;border-radius:6px;background:var(--stage-soft);
  font-family:var(--f-m);font-size:11px;display:flex;align-items:center;justify-content:center;
  color:var(--stage-mute)}
.pv b{margin-left:auto;font-family:var(--f-m);font-size:11px;font-weight:600;
  color:#9C7222;white-space:nowrap}
.clock{white-space:nowrap}

/* controls sit above the question so nothing needs scrolling to reach */
.ctrl.top{margin-top:0;padding-top:0;padding-bottom:13px;border-top:none;
  border-bottom:1px solid var(--stage-rule);align-items:center}
.done{margin-left:auto;font-family:var(--f-m);font-size:12px;color:var(--stage-mute);white-space:nowrap}
.done b{color:var(--stage-ink);font-size:15px;margin-left:4px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;
  font-family:var(--f-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--stage-mute);margin:0}
.meta b{color:#9C7222;font-weight:600}
.meta b.ok{color:#0B6F5C}
.meta b.plain{color:var(--stage-ink)}
.qbtn .ns.was{color:var(--teal)}
.mgrid input.hide,.mgrid select.hide{display:none}

/* ── lead-in line ─────────────────────────────────────────────── */
.qcard .lead{font-size:14.5px;color:var(--mute);line-height:1.5;margin:0 0 6px}
.slead{font-size:clamp(14px,1.5vw,18px);color:var(--stage-mute);margin:0 0 -8px;line-height:1.45}

/* ── the intro block, on a phone ──────────────────────────────── */
.hello{font-family:var(--f-d);font-weight:700;font-size:20px;line-height:1.35;margin:0 0 6px;text-wrap:balance}
.priv{margin:0 0 16px;font-size:12.5px;color:var(--mute);line-height:1.5}
.iq{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.iqt{font-weight:600;font-size:14.5px;margin:0 0 8px;line-height:1.35}
.ilead{margin:0 0 3px;font-size:13.5px;color:var(--mute);line-height:1.45}
/* One option per row — wrapped pills made long options break mid-phrase and the
   room could not scan them. */
.iopts{display:flex;flex-direction:column;gap:7px}
.io{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:1.5px solid var(--rule);border-radius:10px;padding:12px 13px;font-size:14.5px;
  color:var(--ink-2);background:var(--card);cursor:pointer;font-family:var(--f-b);line-height:1.35}
.io i{flex:0 0 22px;height:22px;border-radius:6px;background:var(--sunk);color:var(--mute);
  font-style:normal;font-family:var(--f-m);font-size:10.5px;display:flex;align-items:center;justify-content:center}
.io:hover{border-color:var(--mute)}
.io.on{border-color:var(--teal);background:rgba(11,111,92,.09);color:var(--ink);font-weight:600}
.io.on i{background:var(--teal);color:#fff}
.iqt.sub{font-weight:700;font-size:15.5px;margin:0 0 9px}
.isub{width:100%;margin-top:4px;background:var(--teal);border:none;color:#fff;border-radius:10px;
  padding:15px;font-size:15.5px;font-weight:600;cursor:pointer;font-family:var(--f-b)}
.note.warn{color:#C0392B;font-weight:600}
.tickbig{width:46px;height:46px;border-radius:50%;background:var(--green-t,#E2F2EE);color:var(--teal);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 4px}

/* ── the intro panel, on the presenter's screen ───────────────── */
.pres.onecol{grid-template-columns:1fr}
.opt.pending{opacity:.62}
.opt.failed{border-color:#E4B4AE;background:#FDECEA}
.savedtag{font-family:var(--f-m);font-size:11px;letter-spacing:.05em;color:var(--mute);
  align-self:center;margin-left:2px}
.pillars{display:grid;gap:3px}
.pil{border-bottom:1px solid var(--rule-2)}
.pilhead{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;
  padding:9px 4px;cursor:pointer;font-family:var(--f-b);font-weight:600;font-size:13px;
  letter-spacing:.02em;color:var(--ink);text-align:left}
.pilhead:hover{color:var(--teal)}
.pilhead .tri{font-style:normal;font-size:10px;color:var(--faint);width:10px}
.pilhead span{flex:1}
.pilhead em{font-family:var(--f-m);font-style:normal;font-size:11px;color:var(--faint)}
.piltopics{display:grid;gap:2px;padding:0 0 8px 18px}
.subt{width:100%;text-align:left;background:none;border:0;border-radius:7px;
  padding:6px 9px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.subt:hover{background:var(--stage-soft)}
.subt i{font-style:normal;font-family:var(--f-m);font-size:11px;color:var(--faint);float:right}
.subt.on{background:var(--navy);color:#fff}
.subt.on i{color:rgba(255,255,255,.65)}
.dashbtn{width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-radius:9px;padding:10px 13px;font-family:var(--f-b);font-weight:600;font-size:14px;
  color:var(--ink);cursor:pointer}
.dashbtn:hover{border-color:var(--mute)}
.dashbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.icard h4 u.tagi{text-decoration:none;font-family:var(--f-m);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--stage-mute);margin-left:6px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 16px}
.bstat{border:1px solid var(--rule);border-radius:10px;padding:11px 13px}
.bstat span{display:block;font-family:var(--f-m);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.bstat b{font-family:var(--f-m);font-size:21px;font-variant-numeric:tabular-nums}
.brows{display:grid;gap:7px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.brow .bq{font-size:14px}
.brow .bq em{font-family:var(--f-m);font-style:normal;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);margin-left:6px}
.brow .bn{font-family:var(--f-m);font-size:14px;font-variant-numeric:tabular-nums}
.brow i{grid-column:1/-1;height:6px;border-radius:99px;background:var(--stage-soft);overflow:hidden;display:block}
.brow i u{display:block;height:100%;background:var(--amber);text-decoration:none}
.brow.lag .bn{color:#B5541F}
.ownblk{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.ownblk .ownnote{margin:2px 0 12px;font-size:12px;color:var(--mute)}
.owngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.icard{border:1px solid var(--stage-rule);border-radius:10px;padding:13px 15px}
.icard h4{font-family:var(--f-b);font-weight:600;font-size:14px;margin:0 0 10px;
  color:var(--stage-ink);display:flex;gap:10px;align-items:baseline;justify-content:space-between}
/* A question that fewer people answered is the one to look at, so its own
   count sits on its own card rather than only in the total at the top. */
.icard h4 em{font-family:var(--f-m);font-style:normal;font-size:11px;letter-spacing:.04em;
  color:var(--stage-mute);white-space:nowrap;font-weight:500}
.icard h4 em.short{color:#B5541F}
.irow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline;margin-bottom:7px}
.irow span{font-size:13px;color:var(--stage-mute)}
.irow em{font-style:normal;font-family:var(--f-m);font-size:13px;font-weight:600;color:var(--stage-ink)}
.irow i{grid-column:1/-1;display:block;height:13px;border-radius:99px;background:var(--stage-soft);overflow:hidden}
.irow i u{display:block;height:100%;background:#0B6F5C;border-radius:99px}
.irow.top i u{background:#E8A81C} .irow.top em{color:#9C7222}
@media(max-width:1180px){ .igrid{grid-template-columns:1fr 1fr} }
@media(max-width:760px){ .igrid{grid-template-columns:1fr} }

/* the intro block, previewed whole on the presenter's screen */
.blk{display:flex;flex-direction:column;gap:10px}
.bq{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;
  border:1px solid var(--stage-rule);border-radius:10px;padding:12px 14px}
.bqn{margin:2px 0 0;font-family:var(--f-m);font-size:12px;color:var(--stage-mute);text-align:center}
.bq h3{font-family:var(--f-d);font-weight:700;font-size:17px;margin:0;line-height:1.3}
.blead{margin:0 0 3px;font-size:13.5px;color:var(--stage-mute);line-height:1.4}
.bopts{margin:6px 0 0;font-size:13.5px;color:var(--stage-mute);line-height:1.5}
.tiny{margin-top:8px;border:1px solid var(--stage-rule);background:var(--stage-soft);
  color:var(--stage-ink);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:var(--f-b)}
.tiny:hover{background:#E1E8F1}

/* in or out of today's poll — the library is not touched */
.qrow{display:grid;grid-template-columns:1fr 26px;align-items:start;gap:2px}
.qrow .qbtn{width:100%}
.tog{background:none;border:1px solid transparent;border-radius:7px;color:var(--faint);
  font-size:15px;line-height:1;cursor:pointer;padding:6px 0;width:24px;margin-top:7px;font-family:var(--f-b)}
.tog:hover{border-color:var(--rule);color:var(--ink-2);background:var(--rule-2)}
.qrow.out .qbtn span{color:var(--faint);text-decoration:line-through}
.qrow.out .tog{color:var(--teal)}
.bq.out{opacity:.45}
.bq.out h3{text-decoration:line-through}
</style>
</head>

/* ---- talking to the sheet ---- */
/* Two roads to Google. The normal one reads the reply directly. Some office
   laptops and privacy settings allow the request out but block the page from
   reading what comes back — on those, loading the answer as a script still
   works. Once the first road is known to be shut, we stop trying it. */
var VIA_SCRIPT=false, CBN=0;

function qstr(params){
  return Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
}

function call(params){
  if(VIA_SCRIPT) return callScript(params);
  return fetch(ENDPOINT+'?'+qstr(params),{method:'GET',redirect:'follow'})
    .then(function(r){ return r.json(); })
    .catch(function(e){
      return callScript(params).then(function(d){ VIA_SCRIPT=true; return d; });
    });
}

function callScript(params){
  return new Promise(function(res,rej){
    var cb='jgnu'+(++CBN)+'_'+Math.floor(Math.random()*1e6);
    var el=document.createElement('script'), done=false;
    var t=setTimeout(function(){ finish(); rej(new Error('timed out')); },15000);
    function finish(){
      if(done) return; done=true; clearTimeout(t);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(el.parentNode) el.parentNode.removeChild(el);
    }
    window[cb]=function(d){ finish(); res(d); };
    el.onerror=function(){ finish(); rej(new Error('could not reach Google')); };
    var p={}; for(var k in params) p[k]=params[k];
    p.jsfn=cb;
    el.src=ENDPOINT+'?'+qstr(p);
    document.head.appendChild(el);
  });
}

/* The room asks a tiny question on a loop — "has anything changed?" — and pays
   for a full reply only when the answer is different. While results are on
   show the bars must move, so that case always fetches in full. */
var TICK=null;

function refresh(){
  if(BUSY || !ENDPOINT) return Promise.resolve();
  /* Nothing to fetch until the presenter is in, and refreshing here would
     redraw the code box and wipe what is being typed. */
  if(MODE!=='aud' && !CODE) return Promise.resolve();
  if(MODE==='aud' && S && !S.revealed && TICK){
    BUSY=true;
    return call({act:'tick'}).then(function(d){
      BUSY=false; FAILS=0;
      if(d && d.ok && d.v===TICK) return;      // nothing new — stop here
      return fullState();
    }).catch(function(){ BUSY=false; FAILS++; render(); });
  }
  return fullState();
}

function fullState(){
  BUSY=true;
  var p={act:'state'};
  if(MODE!=='aud' && CODE) p.code=CODE;
  return call(p).then(function(d){
    BUSY=false; FAILS=0;
    if(!d || !d.ok) return;
    if(d.v) TICK=d.v;
    var wasBlock = S ? ((S.block)||(S.intro?introTopic():'')) : '';
    var nowBlock = (d.block)||(d.intro?((d.introTopic)||'Intro'):'');
    if((S && S.sessionId!==d.sessionId) || wasBlock!==nowBlock){
      /* A different block is a different set of answers — the tick from the
         last one must not greet people on this one. */
      INTRO_SENT=false; INTRO_BUSY=false; INTRO_FAIL=false; INTRO_WHY=''; INTRO_AT=0; INTRO_DONE={};
      if(S && S.sessionId!==d.sessionId){ MYANS={}; VSTATE={}; VQ={}; VSENT={}; }
    }
    S=d; if(d.meta && METASAVE===null) META=d.meta; trackClock(); render();
  }).catch(function(){ BUSY=false; FAILS++; render(); });
}

/* ---- shared helpers ---- */
/* "43 of 150" is the presenter's own check that nobody is being dropped —

function clockOf(v){
  try{ var d=new Date(v); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function roomSize(){ var n=parseInt(META&&META.participants,10); return (n>0)?n:0; }
function ofRoom(n){ var r=roomSize(); return r?(n+' of '+r):String(n); }

function questions(){ return (S && S.questions) || []; }
function activeQ(){

  for(var i=0;i<qs.length;i++) if(qs[i].id===S.activeId) return qs[i];
  return null;
}
/* What the presenter is LOOKING at, which is not always what the room is
   answering — she lines a question up first, then asks it. */
function selectedQ(){

function isLive(q){ return !!(q && S && S.activeId===q.id); }

function openBlock(){ return (S && S.block) || (S && S.intro ? introTopic() : ''); }
function blockQs(t){ return questions().filter(function(q){ return q.topic===t; }); }

/* What the room is told when a block opens. */
var BLOCK_TEXT = {

                priv:"This info remains anonymous \u2014 Khushbu won't know who said what.",

function wasAsked(q){ return !!q && askedList().indexOf(q.id)>=0; }

function pollsDone(){

function counts(q){

  for(var i=0;i<q.options.length;i++){ var n=+by[i]||0; c.push(n); total+=n; }
  return {counts:c, total:(isLive(q) && S.counts ? S.counts.total : 0)};
}

/* Worth retrying only when nothing was decided — a closed question or a
   malformed answer will fail again just as fast. */
function retryable(d){ return !d || (!d.ok && (!d.error || d.error==='busy')); }

/* Plain words for what Google actually said, so a failure on the day can be
   read off the phone instead of guessed at. */
function reason(d){
  if(!d) return 'could not reach Google';
  if(d.error==='closed')   return 'the intro is not open on the presenter screen';
  if(d.error==='busy')     return 'Google was busy';
  if(d.error==='bad vote') return 'the answers were not understood';
  if(d.error)              return String(d.error);
  if(d.ok && d.saved===undefined) return 'the link points at an old copy of the script';
  if(d.ok) return 'only '+d.saved+' of the answers were saved';
  return 'unknown';
}

/* How many of the block are already safely stored. */
function doneCount(qs){ return qs.filter(function(q){ return INTRO_DONE[q.id]; }).length; }

/* Said in the person's own terms: nearly finished beats "it failed", because
   somebody told they are one tap from done will actually take that tap. */
function failNote(qs){
  var n=doneCount(qs), t=qs.length, left=t-n;
  if(n===0) return 'That did not go through \u2014 '+(INTRO_WHY||'unknown')+'. Tap to send again.';
  return n+' of '+t+' sent \u2014 tap to send the '+(left===1?'last one':'other '+left)+'.';
}

function sendIntro(qs){
  INTRO_BUSY=true; INTRO_FAIL=false; INTRO_WHY=''; INTRO_AT=doneCount(qs); render(true);
  var sid=S.sessionId;
  var pending=qs.filter(function(q){ return !INTRO_DONE[q.id]; });
  /* Everything in one message when Google accepts it, otherwise one at a time.
     Sequential is the point: nothing is sent until the one before it is
     safely written, so two answers can never collide. */
  var first = (pending.length===qs.length) ? batchSend(qs,sid) : Promise.reject(new Error('resume'));
  first.then(function(){ qs.forEach(function(q){ INTRO_DONE[q.id]=true; }); })
    .catch(function(){ return oneByOne(pending,sid,qs); })
    .then(function(){ INTRO_BUSY=false; INTRO_SENT=true; render(true); })
    .catch(function(e){
      /* The answers may be safely stored even when the reply never came back —
         office networks drop the return trip often enough that assuming the
         worst would scare people whose answers are already in the sheet. Ask
         Google what it actually has before saying anything failed. */
      var why=String((e && e.message) || e || 'unknown');
      return confirmStored(qs,sid).then(function(complete){
        INTRO_BUSY=false;
        if(complete){ INTRO_SENT=true; INTRO_FAIL=false; }
        else { INTRO_FAIL=true; INTRO_WHY=why; }
        render(true);
      });
    });
}

/* Asks which of this device's answers Google already holds, and ticks them
   off. Returns true when the whole block is safely stored. */
function confirmStored(qs,sid){
  return call({act:'mine', sess:sid, dev:VID}).then(function(d){
    if(!d || !d.ok || !d.have) return false;
    d.have.forEach(function(id){ INTRO_DONE[id]=true; });
    return doneCount(qs)===qs.length;
  }).catch(function(){ return false; });
}

function batchSend(qs,sid){
  var ids=qs.map(function(q){ return q.id; }).join(',');
  var cs =qs.map(function(q){ return MYANS[q.id]; }).join(',');
  return call({act:'votes', sess:sid, qid:ids, opt:cs, dev:VID}).then(function(d){
    if(d && d.ok && d.saved===qs.length) return true;
    throw new Error('batch refused');
  });
}

/* One at a time, each waiting for the one before it, counting up on screen so
   a slow phone looks busy rather than broken. */
function oneByOne(pending,sid,all){
  return pending.reduce(function(chain,q){
    return chain.then(function(){
      INTRO_AT=doneCount(all)+1; render(true);
      return sendOne(q,sid,0).then(function(){
        INTRO_DONE[q.id]=true; INTRO_AT=doneCount(all); render(true);
      });
    });
  }, Promise.resolve()).then(function(){ return true; });
}

/* Three tries, 1s then 2s then 4s apart — long enough to ride out the wifi
   wobble that a room full of phones will produce. */
function sendOne(q,sid,tries){
  return call({act:'vote', sess:sid, qid:q.id, opt:MYANS[q.id], dev:VID}).then(function(d){
    if(d && d.ok) return true;
    /* A shut question will refuse just as fast next time — everything else,
       a dropped connection included, is worth another go. */
    if(d && d.error==='closed') throw new Error('stop:the intro is not open on the presenter screen');
    throw new Error('retry');
  }).catch(function(e){
    var m=String((e && e.message) || e);
    if(m.indexOf('stop:')===0) throw new Error(m.slice(5));
    if(tries<2) return new Promise(function(r){ setTimeout(r, 1000*Math.pow(2,tries)); })
                      .then(function(){ return sendOne(q,sid,tries+1); });
    throw new Error('the connection dropped');
  });
}

/* One question, one answer in the air at a time. Two taps sent together are
   written in whatever order Google gets to them, so a quick change of mind
   could be overwritten by the answer it replaced. Each question therefore has
   its own queue, and what goes out is always the latest choice at the moment
   of sending — not the choice that was made when the tap happened. */
var VQ={}, VSENT={};

function vote(qid,i){
  MYANS[qid]=i; VSTATE[qid]='busy'; render(true);
  var run=function(){ return sendVote(qid); };
  VQ[qid]=(VQ[qid]||Promise.resolve()).then(run,run);
  return VQ[qid];
}

function sendVote(qid){
  var i=MYANS[qid];
  if(i===undefined) return Promise.resolve();
  if(VSENT[qid]===i && VSTATE[qid]==='ok') return Promise.resolve();   // already stored
  var sid=S.sessionId, tries=0;
  return new Promise(function(done){
    (function go(){
      tries++;
      call({act:'vote', sess:sid, qid:qid, opt:i, dev:VID}).then(function(d){
        /* Only a reply naming the option counts. Anything vaguer might be an
           older script, or a reply that never described what was written. */
        if(d && d.ok && (d.c===undefined || +d.c===i)){ VSENT[qid]=i; return fin('ok'); }
        if(d && d.error==='closed') return fin('fail');
        throw new Error('retry');
      }).catch(function(){
        if(MYANS[qid]!==i) return done();          // they have changed it again
        if(tries<3){ setTimeout(go, 1000*tries); return; }
        /* The write may have landed even though the reply was lost, so ask
           before telling them it failed. */
        call({act:'mine', sess:sid, dev:VID}).then(function(d){
          var at=d && d.ok && d.at ? d.at[qid] : undefined;
          if(at!==undefined && +at===i) VSENT[qid]=i;
          fin((at!==undefined && +at===i) ? 'ok' : 'fail');
        }).catch(function(){ fin('fail'); });
      });
      function fin(how){ settle(qid,i,how); done(); }
    })();
  });
}

function settle(qid,i,how){
  if(MYANS[qid]!==i) return;      // a newer tap owns the answer now
  VSTATE[qid]=how; render(true);
}

/* ---- presenter ---- */
var META_FIELDS=[['company','Company'],['title','Session title'],['date','Date'],
                 ['place','Place'],['participants','People in the room'],['duration','Duration']];
var DURATIONS=['30 minutes','1 hour','90 minutes','2 hours'];

/* Date and duration are the two fields people mistype, so neither is a free
   text box: one is the browser's own calendar, the other a short list with a
   way out for anything unusual. */
function metaField(f){
  var k=f[0], v=META[k]||'';
  if(k==='date')
    return '<label><span class="lab">'+f[1]+'</span>'+
      '<input type="date" id="m_date" value="'+esc(v)+'"></label>';
  if(k==='duration'){
    /* Custom does not add a second box — the list turns into a text field in the
       same place, so the row never changes shape. */
    var known = DURATIONS.indexOf(v)>=0, custom = !!v && !known;
    return '<label><span class="lab">'+f[1]+'</span>'+
      '<select id="m_duration" class="'+(custom?'hide':'')+'">'+
        '<option value=""'+(v?'':' selected')+'>Select</option>'+
        DURATIONS.map(function(d){
          return '<option'+(v===d?' selected':'')+'>'+d+'</option>'; }).join('')+
        '<option value="__other">Custom</option>'+
      '</select>'+
      '<input type="text" id="m_durationOther" class="'+(custom?'':'hide')+'" '+
        'placeholder="Type how long" value="'+esc(custom?v:'')+'"></label>';
  }
  return '<label><span class="lab">'+f[1]+'</span>'+
    '<input type="text" id="m_'+k+'" value="'+esc(v)+'"></label>';
}
function readMetaFields(){
  META_FIELDS.forEach(function(f){
    var e=document.getElementById('m_'+f[0]); if(e) META[f[0]]=e.value;
  });
  var sel=document.getElementById('m_duration'), other=document.getElementById('m_durationOther');
  if(other && !other.classList.contains('hide')) META.duration = other.value.trim();
  else if(sel) META.duration = sel.value==='__other' ? '' : sel.value;
}
function wireMetaFields(){
  var sel=document.getElementById('m_duration'), other=document.getElementById('m_durationOther');
  if(!sel||!other) return;
  sel.addEventListener('change',function(){
    if(sel.value!=='__other') return;
    other.value='';
    sel.classList.add('hide');
    other.classList.remove('hide');
    other.focus();
  });
  /* Left empty, it goes back to the list rather than trapping you in a blank box. */
  other.addEventListener('blur',function(){
    if(other.value.trim()) return;
    other.classList.add('hide');
    sel.classList.remove('hide');
    sel.value='';
  });
  other.addEventListener('keydown',function(e){ if(e.key==='Escape') other.blur(); });
}
/* 2026-09-12 reads badly on a report sent to a company. */
function prettyDate(v){
  if(!v) return '';
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if(!m) return v;
  var mo=['January','February','March','April','May','June','July','August',
          'September','October','November','December'][+m[2]-1];
  return (+m[3])+' '+mo+' '+m[1];
}

function renderHome(){

  app.innerHTML='<div class="homewrap">'+
    '<div class="hcard">'+
      '<h2>Start a fresh poll</h2>'+
      '<p class="hsub">The counts go back to zero. Everything already collected stays saved '+
        'and can be reopened from the list below.</p>'+
      '<div class="mgrid">'+META_FIELDS.map(metaField).join('')+'</div>'+
      '<button class="b2" id="hStart">Start the poll</button>'+
      (running ? '<button class="b2 ghost" id="hCont">Carry on with the poll already running</button>' : '')+
    '</div>'+
    '<div class="hcard">'+
      '<h2>Past workshops</h2>'+
      (SESSIONS===null ? '<p class="hsub">Loading&hellip;</p>'
        : SESSIONS.length ? '<div class="past">'+SESSIONS.map(function(x){
            return '<button class="pastrow" data-row="'+x.row+'">'+
              '<b>'+esc(x.company||'Untitled')+'</b>'+
              '<span>'+esc(x.date||'')+(x.participants?' &middot; '+esc(x.participants)+' people':'')+'</span>'+
              '<i>'+(x.awareness===''||x.awareness===null?'&mdash;':x.awareness+'%')+'</i></button>';
          }).join('')+'</div>'
        : '<p class="hsub">None saved yet. Run a poll, then press Save this workshop on the report.</p>')+
    '</div></div>';
  barMeta.textContent='Presenter';
  wireMetaFields();
  on('hStart',function(){
    readMetaFields();
    if(!META.company.trim()){ alert('A company name, at least — the report is titled with it.'); return; }
    var q={act:'meta',code:CODE};
    for(var k in META) q[k]=META[k];
    METASAVE=1;
    call(q).then(function(){ return call({act:'reset',code:CODE}); })
      .then(function(){ STAGE='run'; SEL=null; refresh(); render(true); })
      .catch(function(){ alert('Could not reach Google. Check your connection and try again.'); });
  });
  on('hCont',function(){ STAGE='run'; SEL=S.activeId; render(true); });
  [].forEach.call(app.querySelectorAll('.pastrow'),function(b){
    b.addEventListener('click',function(){
      call({act:'load',code:CODE,row:b.dataset.row}).then(function(d){
        if(d&&d.ok){ REPORT=d; META=d.meta||META; location.hash='#report'; }
      }).catch(function(){});
    });
  });
}

function renderPresenter(){
  if(!ENDPOINT) return setup();
  if(!CODE) return document.getElementById('pcode') ? undefined : gate();
  if(!S){ app.innerHTML='<div class="aud"><div class="rest"><span class="dot"></span>'+
    '<h2>Connecting</h2><p>One moment.</p></div></div>'; return; }
  if(STAGE==='home'){ if(SESSIONS===null) loadSessions(); return renderHome(); }

  if(BOARD) return renderBoard();
  if(openBlock()) return renderBlockPresenter(openBlock());
  var qs=questions(), q=selectedQ();
  /* Choosing Intro shows the whole block, because that is how it goes out —
     five questions on one screen, asked in one press. */
  if(isBlockTopic(FILTER) && !SEL) return renderBlockPreview(FILTER);
  var side=sidebar(q);

  var stage;
  if(!q){
    stage='<div class="stage">'+
      '<div class="ctrl top"><button class="b" id="goHome">Back to the start</button>'+
        '<span class="done">Polls done <b>'+pollsDone()+'</b></span></div>'+
      '<div class="meta"><span>Nothing selected</span></div>'+
      '<h1 class="sq">Pick a question on the left. Nothing reaches the room until you press Ask the room.</h1>'+
    '</div>';
  } else if(!isLive(q)){
    var already=wasAsked(q), inToday=isOn(q);
    stage='<div class="stage">'+
      '<div class="ctrl top">'+
        (inToday
          ? '<button class="b go" id="askRoom">'+(already?'Ask it again':'Ask the room')+'</button>'
          : '<button class="b go" id="putBack">Put back into today\'s poll</button>')+
        '<button class="b" id="nextQ">Look at the next one</button>'+
        '<button class="b" id="editQ">Edit this one</button>'+
        '<button class="b" id="goHome">Back to the start</button>'+
        '<span class="done">Polls done <b>'+pollsDone()+'</b></span>'+
      '</div>'+
      '<div class="meta"><span>'+numberOf(q)+
        ' &nbsp;&middot;&nbsp; '+esc(q.topic||'General')+'</span>'+
        '<span>Status: <b'+(already?' class="ok"':'')+'>'+
          (inToday?(already?'Asked':'Not asked'):'Left out of today')+'</b></span></div>'+
      (q.lead?'<p class="slead">'+esc(q.lead)+'</p>':'')+
      '<h1 class="sq">'+esc(q.q)+'</h1>'+
      '<div class="prev">'+q.options.map(function(o,i){
        return '<div class="pv"><span>'+String.fromCharCode(65+i)+'</span>'+esc(o)+
          (q.scored?'<b>'+(q.scores[i]||0)+' pt'+((q.scores[i]||0)===1?'':'s')+'</b>':'')+'</div>';
      }).join('')+'</div>'+
      '<p class="hidden-note">Only you can see this. The room is still on the waiting screen'+
        (S.activeId?' or the last question':'')+'.</p>'+
    '</div>';
  } else {
    var t=counts(q), best=Math.max.apply(null,t.counts);
    stage='<div class="stage">'+
      '<div class="ctrl top">'+
        '<button class="b go" id="toggleOpen">'+(S.open?'Close voting':'Open voting')+'</button>'+
        '<button class="b" id="toggleRev">'+(S.revealed?'Hide results':'Show results to the room')+'</button>'+
        '<button class="b" id="refreshNow">&#8635; Refresh now</button>'+
        '<button class="b" id="nextQ">Look at the next one</button>'+
        '<button class="b" id="editQ">Edit this one</button>'+
        '<button class="b" id="goHome">Back to the start</button>'+
        '<span class="done">Polls done <b>'+pollsDone()+'</b></span>'+
      '</div>'+
      '<div class="meta"><span>'+numberOf(q)+
        ' &nbsp;&middot;&nbsp; '+esc(q.topic||'General')+
        ' &nbsp;&middot;&nbsp; Open for <b id="clk" class="plain">'+clockText()+'</b></span>'+
        '<span>Status: <b class="ok">'+(S.open?'Asked':'Closed')+'</b>'+
        ' &nbsp;&middot;&nbsp; <b class="plain">'+ofRoom(t.total)+'</b> answered</span></div>'+
      (q.lead?'<p class="slead">'+esc(q.lead)+'</p>':'')+
      '<h1 class="sq">'+esc(q.q)+'</h1>'+
      '<div class="sres">'+q.options.map(function(o,i){
        var pct=t.total?Math.round(t.counts[i]/t.total*100):0;
        return '<div class="srow'+((t.total&&t.counts[i]===best)?' top':'')+'">'+
          '<span class="sname">'+esc(o)+'</span><span class="sn">'+t.counts[i]+'</span>'+
          '<span class="spct">'+pct+'%</span>'+
          '<span class="strack"><i class="sfill" style="width:'+pct+'%"></i></span></div>';
      }).join('')+'</div>'+
      '<p class="hidden-note">'+(S.revealed?'The room is seeing these results now'
        :'The room sees only the question &mdash; results are hidden')+'</p>'+
    '</div>';
  }
  app.innerHTML='<div class="pres">'+side+stage+'</div>';
  barMeta.textContent='Presenter';
  wire(); drawQR();
}

/* Where a question sits in the list you are looking at, not in the master list. */
function VISIBLE(){
  var qs=questions();
  return qs.filter(function(x){
    if((x.topic||'')===introTopic() && FILTER!==introTopic()) return false;
    if(FILTER!=='All' && (x.topic||'General')!==FILTER) return false;
    if(LEVEL!=='All' && (x.level||'Any')!==LEVEL && (x.level||'Any')!=='Any') return false;
    return true;
  });
}
function numberOf(q){
  var v=VISIBLE(), i=v.indexOf(q);
  return i<0 ? 'Question' : 'Question '+(i+1)+' of '+v.length;
}

function sidebar(q){
  var qs=questions(), tops=(S.topics||[]), levs=(S.levels||[]);
  var shown=qs.filter(function(x){
    /* Intro questions are a block, not part of the running order, so they appear
       only when you have actually asked for them. */
    if((x.topic||'')===introTopic() && FILTER!==introTopic()) return false;
    if(FILTER!=='All' && (x.topic||'General')!==FILTER) return false;
    /* "Any" questions belong in every audience, so they always show. */
    if(LEVEL!=='All' && (x.level||'Any')!==LEVEL && (x.level||'Any')!=='Any') return false;
    return true;
  });
  var side='<div class="side">'+
    /* Not a topic — a different kind of thing, so it sits above the topics
       with a line under it rather than joining the row of chips. */
    '<button class="dashbtn'+(BOARD?' on':'')+'" id="goBoard">Dashboard</button>'+
    '<div class="pillars">'+pillars().map(function(pl){
      var open = OPEN_P[pl.name] || pl.topics.indexOf(FILTER)>=0;
      var n = qs.filter(function(x){ return pl.topics.indexOf(x.topic||'')>=0; }).length;
      return '<div class="pil'+(open?' open':'')+'">'+
        '<button class="pilhead" data-p="'+esc(pl.name)+'">'+
          '<i class="tri">'+(open?'\u25be':'\u25b8')+'</i>'+
          '<span>'+esc(pl.name)+'</span><em>'+n+'</em></button>'+
        (open ? '<div class="piltopics">'+pl.topics.map(function(t){
            var c = qs.filter(function(x){ return (x.topic||'')===t; }).length;
            return '<button class="subt'+(FILTER===t?' on':'')+'" data-t="'+esc(t)+'">'+
              esc(t)+' <i>'+c+'</i></button>';
          }).join('')+'</div>' : '')+
      '</div>';
    }).join('')+'</div>'+
    '<div><p class="lab">Written for</p><div class="chips">'+
      ['All'].concat(levs).map(function(l){
        return '<button class="chip lv'+(LEVEL===l?' on':'')+'" data-l="'+esc(l)+'">'+esc(l)+'</button>';
      }).join('')+
    '</div></div>'+
    '<div><p class="lab">Questions</p><div class="qlist">'+
      (shown.length? shown.map(function(x,ix){
        var on=isOn(x);
        return '<div class="qrow'+(on?'':' out')+'">'+
          '<button class="qbtn'+(q&&x.id===q.id?' on':'')+'" data-id="'+esc(x.id)+'">'+
            '<i>'+(ix+1)+'</i><span>'+esc(x.q)+
            (wasAsked(x)?'<b class="ns was">asked</b>':(x.scored?'':'<b class="ns">not scored</b>'))+
            '</span></button>'+
          '<button class="tog" data-tog="'+esc(x.id)+'" title="'+
            (on?'Leave this one out of today\'s poll':'Put this one back into today\'s poll')+'">'+
            (on?'&minus;':'+')+'</button>'+
        '</div>'; }).join('')
        : '<p style="font-size:13px;color:var(--mute);margin:4px 0">Nothing in this topic yet.</p>')+
    '</div></div>'+
    (EDIT!==null ? editor() : '<button class="mini" id="addQ">+ Add a question</button>')+
    (isBlockTopic(FILTER) && blockQs(FILTER).length
      ? '<button class="mini" id="askIntro">Ask the '+esc(FILTER)+' block</button>' : '')+
    '<button class="mini" id="goRep">View the workshop report</button>'+
    '<div class="join"><p class="lab">Audience joins here</p>'+
      '<p class="url">'+esc(audienceURL())+'</p><div id="qr"></div></div></div>';

  return side;
}

/* Everything the room has said today, in the order it was asked, so the intro
   comes first when the intro went first. A look-back only — nothing here can
   ask, open or close anything. */
function renderBoard(){
  var side=sidebar(null), all=(S.all)||{}, it=introTopic();
  var rows=askedList().map(function(id){
    var q=questions().filter(function(x){ return x.id===id; })[0];
    if(!q) return null;
    var t=all[id]||{total:0,by:{}};
    return { q:q, t:t, intro:(q.topic||'')===it };
  }).filter(Boolean);
  var most=rows.length?Math.max.apply(null,rows.map(function(r){ return r.t.total; })):0;

  var stage='<div class="stage">'+
    '<div class="ctrl top">'+
      '<button class="b" id="refreshNow">&#8635; Refresh now</button>'+
      '<button class="b" id="goRep2">View the workshop report</button>'+
      '<button class="b" id="goHome">Back to the start</button>'+
      '<span class="done">Answered <b>'+ofRoom(S.people||0)+'</b></span>'+
    '</div>'+
    '<div class="meta"><span>Dashboard &nbsp;&middot;&nbsp; '+
      pollsDone()+' poll'+(pollsDone()===1?'':'s')+' done'+
      ' &nbsp;&middot;&nbsp; '+rows.length+' question'+(rows.length===1?'':'s')+' asked</span>'+
      '<span>Everything collected so far</span></div>'+
    (rows.length ? '<div class="igrid">'+rows.map(function(r){
        var best=0;
        r.q.options.forEach(function(o,i){ var n=+((r.t.by||{})[i])||0; if(n>best) best=n; });
        return '<div class="icard"><h4><span>'+esc(r.q.q)+
          (r.intro?' <u class="tagi">intro</u>':'')+'</span>'+
          '<em'+((most && r.t.total<most)?' class="short"':'')+'>'+r.t.total+'</em></h4>'+
          r.q.options.map(function(o,i){
            var n=+((r.t.by||{})[i])||0, pct=r.t.total?Math.round(n/r.t.total*100):0;
            return '<div class="irow'+((r.t.total&&n===best)?' top':'')+'">'+
              '<span>'+esc(o)+'</span><em>'+pct+'%</em>'+
              '<i><u style="width:'+pct+'%"></u></i></div>';
          }).join('')+'</div>';
      }).join('')+'</div>'
      : '<h1 class="sq">Nothing asked yet.</h1>')+
    '<p class="hidden-note">Yours only &mdash; the room never sees this</p>'+
  '</div>';

  app.innerHTML='<div class="pres">'+side+stage+'</div>';
  barMeta.textContent='Dashboard';
  wire();
  on('refreshNow',function(){ BUSY=false; refresh().then(function(){ render(true); }); });
  on('goRep2',function(){ location.hash='#report'; });
  on('goHome',function(){ BOARD=false; STAGE='home'; SEL=null; SESSIONS=null; loadSessions(); render(true); });
  drawQR();
}

function renderBlockPreview(topic){
  var qs=blockQs(topic);
  var side=sidebar(null);
  /* Once the block has gone out she comes back here to look at the room, so
     the answers sit above the questions rather than vanishing with the panel. */
  var bc=blockCounts(topic), asked=qs.some(wasAsked), c=bc.counts, people=bc.people;
  var stage='<div class="stage">'+
    '<div class="ctrl top">'+
      (qs.length?'<button class="b go" id="askIntro2">'+(asked?'Ask it again':'Ask the room')+'</button>':'')+
      '<button class="b" id="addQ2">Add a question to the block</button>'+
      '<button class="b" id="goHome">Back to the start</button>'+
      '<span class="done">Polls done <b>'+pollsDone()+'</b></span>'+
    '</div>'+
    '<div class="meta"><span>'+esc(topic)+' block &nbsp;&middot;&nbsp; '+
      qs.filter(isOn).length+' of '+qs.length+' going out'+
      ' &nbsp;&middot;&nbsp; one screen</span>'+
      '<span>Status: <b'+(asked?' class="ok"':'')+'>'+(asked?'Asked':'Not asked')+'</b>'+
        (asked?' &nbsp;&middot;&nbsp; <b class="plain">'+ofRoom(people)+'</b> answered':'')+
        '</span></div>'+
    (asked ? introCards(qs.filter(isOn),c,people) : '')+
    (qs.length ? '<div class="blk">'+qs.map(function(x,n){
        return '<div class="bq'+(isOn(x)?'':' out')+'"><p class="bqn">'+(n+1)+'</p><div>'+
          (x.lead?'<p class="blead">'+esc(x.lead)+'</p>':'')+
          '<h3>'+esc(x.q)+'</h3>'+
          '<p class="bopts">'+x.options.map(esc).join(' &nbsp;·&nbsp; ')+'</p>'+
          '<button class="tiny" data-edit="'+esc(x.id)+'">Edit</button>'+
          '<button class="tiny" data-tog="'+esc(x.id)+'">'+
            (isOn(x)?'Leave out today':'Put back in')+'</button></div></div>';
      }).join('')+'</div>'
      : '<h1 class="sq">Nothing in the block yet. Add a question to start it.</h1>')+
    '<p class="hidden-note">All of these go to the room together, on one screen with one Submit</p>'+
  '</div>';
  app.innerHTML='<div class="pres">'+side+stage+'</div>';
  barMeta.textContent='Presenter';
  wire();
  on('askIntro2',function(){ SEL=null; send({act:'set',block:topic}); });
  on('addQ2',function(){ EDIT={q:'',lead:'',options:['',''],topic:topic,
    level:'Any',scored:false,scores:[]}; render(true); });
  [].forEach.call(app.querySelectorAll('[data-tog]'),function(b){
    b.addEventListener('click',function(){ setOn(b.dataset.tog, offList().indexOf(b.dataset.tog)>=0); });
  });
  [].forEach.call(app.querySelectorAll('[data-edit]'),function(b){
    b.addEventListener('click',function(){
      var x=blockQs(topic).filter(function(y){return y.id===b.dataset.edit;})[0];
      if(x) EDIT={id:x.id,q:x.q,lead:x.lead||'',topic:x.topic,level:x.level||'Any',
                  options:x.options.slice(),scored:false,scores:(x.scores||[]).slice()};
      render(true);
    });
  });
  drawQR();
}

function introCards(qs,c,people){
  return '<div class="igrid">'+qs.map(function(q){
    var t=c[q.id]||{total:0,by:{}}, best=0;
    q.options.forEach(function(o,i){ var n=+((t.by||{})[i])||0; if(n>best) best=n; });
    return '<div class="icard"><h4><span>'+esc(q.q)+'</span>'+
      '<em'+((people && t.total<people)?' class="short"':'')+'>'+t.total+'</em></h4>'+
      q.options.map(function(o,i){
        var n=+((t.by||{})[i])||0, pct=t.total?Math.round(n/t.total*100):0;
        return '<div class="irow'+((t.total&&n===best)?' top':'')+'">'+
          '<span>'+esc(o)+'</span><em>'+pct+'%</em>'+
          '<i><u style="width:'+pct+'%"></u></i></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}

  on('refreshNow',function(){ BUSY=false; refresh().then(function(){ render(true); }); });
  drawQR();
}

function editor(){
  var tops=(S.topics||['General']);
  var levs=(S.levels||['Any']);
  return '<div class="ed"><p class="lab">'+(EDIT.id?'Edit question':'New question')+'</p>'+
    '<p class="lab">Lead-in line &mdash; optional</p>'+
    '<textarea id="edL" rows="2" placeholder="A setting-up sentence, if it needs one">'+esc(EDIT.lead||'')+'</textarea>'+
    '<p class="lab">The question</p>'+
    '<textarea id="edQ" rows="2" placeholder="The question">'+esc(EDIT.q||'')+'</textarea>'+
    '<p class="lab">Written for</p>'+
    '<select id="edV">'+levs.map(function(l){
      return '<option'+((EDIT.level||'Any')===l?' selected':'')+'>'+esc(l)+'</option>'; }).join('')+'</select>'+
    '<p class="lab">Topic</p>'+
    '<select id="edT">'+tops.map(function(t){
      return '<option'+((EDIT.topic||'General')===t?' selected':'')+'>'+esc(t)+'</option>';
    }).join('')+'</select>'+
    '<p class="lab">Options, one per line</p>'+
    '<textarea id="edO" rows="4" placeholder="Yes&#10;No">'+esc((EDIT.options||[]).join('\n'))+'</textarea>'+
    '<label class="chk"><input type="checkbox" id="edS"'+(EDIT.scored?' checked':'')+'> '+
      'Count this question in the awareness score</label>'+
    '<div id="edScoreBox" class="'+(EDIT.scored?'':'hide')+'">'+
      '<p class="lab">Points, one per line &mdash; same order as the options</p>'+
      '<textarea id="edP" rows="4" placeholder="2&#10;1&#10;0">'+
        esc((EDIT.scores||[]).join('\n'))+'</textarea>'+
    '</div>'+
    '<div class="row"><button class="b2" id="edSave">Save</button>'+
    '<button class="b2 ghost" id="edCancel">Cancel</button>'+
    (EDIT.id?'<button class="b2 ghost" id="edDel">Delete</button>':'')+'</div></div>';
}

function on(id,fn){ var e=document.getElementById(id); if(e) e.addEventListener('click',fn); }
function wire(){
  on('goBoard',function(){ BOARD=true; EDIT=null; render(true); });
  [].forEach.call(app.querySelectorAll('.qbtn'),function(b){
    b.addEventListener('click',function(){ BOARD=false; EDIT=null; SEL=b.dataset.id; render(true); });
  });
  [].forEach.call(app.querySelectorAll('.tog'),function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var id=b.dataset.tog;
      setOn(id, offList().indexOf(id)>=0);
    });
  });
  on('putBack',function(){ var p2=selectedQ(); if(p2) setOn(p2.id,true); });
  on('askRoom',function(){
    var pick=selectedQ(); if(!pick) return;
    /* read the id BEFORE clearing the preview, or the lookup falls back to
       whatever is live and sends nothing */
    SEL=null;
    send({act:'set',activeId:pick.id,open:1,revealed:0}); });
  on('refreshNow',function(){
    var b=document.getElementById('refreshNow');
    if(b){ b.textContent='Refreshing…'; b.disabled=true; }
    BUSY=false; refresh().then(function(){ render(true); });
  });
  on('goHome',function(){ STAGE='home'; SEL=null; SESSIONS=null; loadSessions(); render(true); });
  [].forEach.call(app.querySelectorAll('.chip'),function(b){
    b.addEventListener('click',function(){
      BOARD=false;
      if(b.dataset.l!==undefined) LEVEL=b.dataset.l; else { FILTER=b.dataset.t; SEL=null; }
      render(true);
    });
  });
  /* The triangle opens and shuts a pillar; the name inside it picks a topic. */
  [].forEach.call(app.querySelectorAll('.pilhead'),function(b){
    b.addEventListener('click',function(){
      var n=b.dataset.p;
      OPEN_P[n]=!(OPEN_P[n] || (pillars().filter(function(x){return x.name===n;})[0]||{topics:[]}).topics.indexOf(FILTER)>=0);
      render(true);
    });
  });
  [].forEach.call(app.querySelectorAll('.subt'),function(b){
    b.addEventListener('click',function(){
      BOARD=false; FILTER=b.dataset.t; SEL=null; EDIT=null; render(true);
    });
  });
  on('goRep',function(){ location.hash='#report'; });
  on('askIntro',function(){ SEL=null; send({act:'set',block:FILTER}); });
  on('addQ',function(){ EDIT={q:'',lead:'',options:['',''],topic:(FILTER==='All'?'General':FILTER),
    level:(LEVEL==='All'?'Any':LEVEL),scored:true,scores:[]}; render(true); });
  on('editQ',function(){ var q=selectedQ();
    if(q) EDIT={id:q.id,q:q.q,lead:q.lead||'',topic:q.topic,level:q.level||'Any',
                options:q.options.slice(),scored:!!q.scored,scores:(q.scores||[]).slice()};
    render(true); });
  on('edCancel',function(){ EDIT=null; render(true); });
  on('edSave',saveEdit);
  var chk=document.getElementById('edS');
  if(chk) chk.addEventListener('change',function(){
    document.getElementById('edScoreBox').classList.toggle('hide',!chk.checked); });
  on('edDel',function(){
    var qs=questions().filter(function(x){ return x.id!==EDIT.id; });
    EDIT=null; saveQuestions(qs);
  });
  on('toggleOpen',function(){ send({act:'set',open:S.open?0:1}); });
  on('toggleRev',function(){ send({act:'set',revealed:S.revealed?0:1}); });
  on('nextQ',function(){ var qs=questions(), i=qs.indexOf(selectedQ());
    if(i>=0&&i<qs.length-1){ SEL=qs[i+1].id; render(true); } });

}
function send(p){ p.code=CODE; call(p).then(refresh).catch(function(){}); }
function saveQuestions(qs){
  call({act:'config',code:CODE,questions:JSON.stringify(qs)}).then(refresh).catch(function(){});
}
function saveEdit(){
  var qt=(document.getElementById('edQ').value||'').trim();
  var opts=(document.getElementById('edO').value||'').split('\n')
    .map(function(s){return s.trim();}).filter(Boolean);
  if(!qt||opts.length<2){ alert('A question and at least two options, please.'); return; }
  var topic=document.getElementById('edT').value;
  var lead=(document.getElementById('edL').value||'').trim();
  var level=document.getElementById('edV').value;
  var scored=document.getElementById('edS').checked;
  var scores=opts.map(function(){ return 0; });
  if(scored){
    var raw=(document.getElementById('edP').value||'').split('\n')
      .map(function(x){return x.trim();}).filter(function(x){return x!=='';});
    if(raw.length!==opts.length){
      alert('Give one number of points for each option — '+opts.length+' lines.'); return; }
    scores=raw.map(function(x){ return Math.max(0, +x || 0); });
    if(!scores.some(function(x){ return x>0; })){
      alert('At least one option needs points above zero, or untick the scoring box.'); return; }
  }
  var body={q:qt, lead:lead, topic:topic, level:level, options:opts, scored:scored, scores:scores};
  var qs=questions().slice();
  if(EDIT.id){ body.id=EDIT.id;
    for(var i=0;i<qs.length;i++) if(qs[i].id===EDIT.id) qs[i]=body; }
  else { body.id='q'+Date.now().toString(36); qs.push(body); }
  EDIT=null; saveQuestions(qs);
}

function gate(){
  app.innerHTML='<div class="gate"><h2>Presenter view</h2>'+
    '<p>Enter your presenter code to run the poll.</p>'+
    '<input type="text" id="pcode" class="mask" placeholder="Presenter code" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="jugnu-code">'+
    '<button class="b2" id="pgo">Open presenter view</button>'+
    '<p class="err" id="perr" style="display:none">That code did not match.</p></div>';
  barMeta.textContent='Presenter';
  var go=function(){
    var v=(document.getElementById('pcode').value||'').trim(); if(!v) return;
    call({act:'set',code:v}).then(function(d){
      if(d&&d.ok){ CODE=v; try{sessionStorage.setItem('jugnu.poll.code',v);}catch(e){}
        render(true); refresh(); if(MODE==='rep') loadReport(); }
      else document.getElementById('perr').style.display='block';
    }).catch(function(){ document.getElementById('perr').style.display='block'; });
  };
  document.getElementById('pgo').addEventListener('click',go);
  document.getElementById('pcode').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
}

function setup(){
  app.innerHTML='<div class="gate"><h2>Not connected yet</h2>'+
    '<p>This poll needs its Google Script address. Open <b>index.html</b>, find the line that '+
    'starts <b>var ENDPOINT</b> near the top of the script, and paste the /exec link between '+
    'the quotes.</p></div>';
  barMeta.textContent='Setup';
}

/* The screen is rebuilt from scratch on each draw, so drawing on every poll made
   it flicker and threw away anything half-typed. Redraw only when something the
   viewer can see has actually changed — and never while a box has focus. */
/* How long this question has been open, on the presenter's screen only.
   Kept in the page rather than in the sheet: the presenter is the one who opens
   a question, so her own clock is the honest start time, and it needs no change
   to the Google script. */
var OPEN_KEY='', OPEN_AT=0, FROZEN=0;
function clockText(){
  var ms = S && S.open ? (Date.now()-OPEN_AT) : FROZEN;
  var t = Math.max(0, Math.floor(ms/1000));
  return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2);
}
function trackClock(){
  if(!S || !S.activeId){ OPEN_KEY=''; FROZEN=0; return; }
  var key = S.sessionId+'|'+S.activeId;
  if(S.open){
    if(key!==OPEN_KEY || !OPEN_AT){ OPEN_KEY=key; OPEN_AT=Date.now(); }
  } else if(key===OPEN_KEY && OPEN_AT){
    FROZEN = Date.now()-OPEN_AT;
    OPEN_AT = 0;
  } else if(key!==OPEN_KEY){
    OPEN_KEY=key; FROZEN=0;
  }
}
/* Only the digits are rewritten each second — redrawing the page would undo
   the no-flicker work above. */
setInterval(function(){
  var e=document.getElementById('clk');
  if(e && S) e.textContent=clockText();
},1000);

var LASTSIG='';
function signature(){
  var c=S && S.counts ? S.counts : null;
  return JSON.stringify([MODE, !!CODE, S && S.sessionId, S && S.activeId,
    S && S.open, S && S.revealed, c && c.total, c && c.by,
    (S && S.questions ? S.questions : []).map(function(q){ return q.id+'|'+q.q+'|'+q.options.join('|'); }),
    MYANS, JSON.stringify(VSTATE), FAILS>2, STAGE, BOARD, JSON.stringify(OPEN_P), SEL, LEVEL, FILTER, offList().join(','), S&&S.block, S&&S.intro, INTRO_SENT, INTRO_BUSY, INTRO_FAIL, INTRO_WHY, INTRO_AT, JSON.stringify(INTRO_DONE), S&&S.version,
    S&&S.blocks, S&&S.people, S&&S.all, (S&&S.asked||[]).join(','), REPORT && REPORT.sessionId, REPORT && REPORT.results.length,
    REPORT && REPORT.awareness, SESSIONS && SESSIONS.length, META]);
}
function typing(){
  var a=document.activeElement;
  return !!(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA'));
}
function loadSessions(){
  if(!CODE) return;
  call({act:'sessions',code:CODE}).then(function(d){
    if(d&&d.ok){ SESSIONS=d.sessions; render(true); }
  }).catch(function(){ SESSIONS=[]; render(true); });
}
function loadReport(){
  if(!CODE) return;
  call({act:'report',code:CODE}).then(function(d){
    if(d&&d.ok){ REPORT=d; if(d.meta) META=d.meta; render(true); }
  }).catch(function(){});
  call({act:'sessions',code:CODE}).then(function(d){
    if(d&&d.ok){ SESSIONS=d.sessions; render(true); }
  }).catch(function(){});
}
function saveMeta(){
  ['company','title','date','participants','duration'].forEach(function(k){
    var e=document.getElementById('m_'+k); if(e) META[k]=e.value;
  });
  var q={act:'meta',code:CODE};
  for(var k in META) q[k]=META[k];
  METASAVE=1;
  call(q).then(function(){ if(REPORT) REPORT.meta=META; render(true); }).catch(function(){});
}
function bandNote(b){
  return b==='Early'    ? 'Most people here are at the beginning. The basics — knowing what goes out, and a fund for emergencies — will move this fastest.'
       : b==='Building' ? 'The foundations are partly in place. The gap is usually between knowing what to do and having a number to work to.'
       : b==='Strong'   ? 'A financially aware group. The value now is in refinement — matching what they hold to what they are saving for.'
       : '';
}
function fmtDate(d){ return prettyDate(d); }

function renderReport(){
  if(!ENDPOINT) return setup();
  if(!CODE) return document.getElementById('pcode') ? undefined : gate();
  if(!REPORT){
    app.innerHTML='<div class="aud"><div class="rest"><span class="dot"></span>'+
      '<h2>Building the report</h2><p>One moment.</p></div></div>';
    barMeta.textContent='Report'; return;
  }
  var R=REPORT, aw=R.awareness;

  var det='<div class="mgrid">'+META_FIELDS.map(metaField).join('')+
    '<button class="b2" id="mSave">Save these details</button></div>';

  var topicRows = R.topics.length ? '<div class="trow">'+R.topics.map(function(t){
      return '<div class="tcell"><span>'+esc(t.topic)+'</span><b>'+t.pct+'%</b>'+
             '<i class="tbar"><u style="width:'+t.pct+'%"></u></i></div>';
    }).join('')+'</div>' : '';

  var qBlocks = R.results.map(function(r){
    var best=Math.max.apply(null,r.counts);
    return '<div class="qb">'+
      '<div class="qbh"><h3>'+esc(r.q)+'</h3>'+
        '<span class="tag">'+esc(r.topic)+(r.scored?'':' · not scored')+'</span></div>'+
      '<div class="qbars">'+r.options.map(function(o,i){
        var pct=r.total?Math.round(r.counts[i]/r.total*100):0;
        return '<div class="qbar'+((r.total&&r.counts[i]===best)?' top':'')+'">'+
          '<span class="on">'+esc(o)+'</span><span class="op">'+pct+'%</span>'+
          '<i><u style="width:'+pct+'%"></u></i></div>';
      }).join('')+'</div>'+
      '<p class="qbn">'+r.total+' answered'+(r.scored&&r.pct!=null?' · '+r.pct+'% of the points available':'')+'</p>'+
    '</div>';
  }).join('');

  /* The room's own shape, kept beside the report but never inside it. It sits
     in the tools column, which is not printed, so the company copy cannot
     carry it even by accident. */
  var introBlock = (R.intro && R.intro.length)
    ? '<div class="ownblk"><p class="lab">Who was in the room</p>'+
      '<p class="ownnote">Yours only &mdash; this is not in the company copy and does not print.</p>'+
      '<div class="owngrid">'+R.intro.map(function(r){
        var best=Math.max.apply(null,r.counts);
        return '<div class="qb"><div class="qbh"><h3>'+esc(r.q)+'</h3>'+
          '<span class="tag">'+r.total+' answered</span></div>'+
          '<div class="qbars">'+r.options.map(function(o,i){
            var pct=r.total?Math.round(r.counts[i]/r.total*100):0;
            return '<div class="qbar'+((r.total&&r.counts[i]===best)?' top':'')+'">'+
              '<span class="on">'+esc(o)+'</span><span class="op">'+pct+'%</span>'+
              '<i><u style="width:'+pct+'%"></u></i></div>';
          }).join('')+'</div></div>';
      }).join('')+'</div></div>'
    : '';

  var saved = SESSIONS && SESSIONS.length
    ? '<div class="past"><p class="lab">Saved workshops</p>'+
      SESSIONS.map(function(x){
        return '<button class="pastrow" data-row="'+x.row+'">'+
          '<b>'+esc(x.company||'Untitled')+'</b>'+
          '<span>'+esc(x.date||'')+(x.participants?' · '+esc(x.participants)+' people':'')+'</span>'+
          '<i>'+(x.awareness===''||x.awareness===null?'—':x.awareness+'%')+'</i></button>';
      }).join('')+'</div>' : '';

  app.innerHTML =
    '<div class="repwrap">'+
      '<div class="reptools noprint">'+det+
        '<div class="row"><button class="b2" id="repSave">Save this workshop</button>'+
        (R.savedAt?'<span class="savedtag">Saved automatically &middot; '+
          esc(clockOf(R.savedAt))+'</span>':'')+
        '<button class="b2 ghost" id="repPrint">Save as PDF</button>'+
        '<button class="b2 ghost" id="repBack">Back to the poll</button></div>'+
        introBlock+saved+
      '</div>'+
      '<div class="doc" id="repDoc">'+
        '<div class="dtop">'+
          '<div class="dlogo"><img src="'+LOGO+'" alt="Jugnu — See Beyond"></div>'+
          '<div class="dtitle"><h1>Employee Financial Wellness Snapshot</h1>'+
            '<p>'+esc(META.company||'—')+(META.title?' &middot; '+esc(META.title):'')+'</p></div>'+
          '<div class="dpl"><div class="k">PLANNER</div><div class="v">Khushbu Choudhary</div></div>'+
        '</div>'+
        '<div class="facts">'+
          '<div><span>Date</span><b>'+esc(fmtDate(META.date)||'—')+'</b></div>'+
          '<div><span>Place</span><b>'+esc(META.place||'—')+'</b></div>'+
          '<div><span>In the room</span><b>'+esc(META.participants||'—')+'</b></div>'+
          '<div><span>Duration</span><b>'+esc(META.duration||'—')+'</b></div>'+
          '<div><span>Questions asked</span><b>'+R.questionsAnswered+'</b></div>'+
          '<div><span>Answered by</span><b>'+R.responded+'</b></div>'+
        '</div>'+
        (aw===null ? '<p class="nodata">No scored questions were answered in this session, so an awareness level cannot be worked out. The breakdown below still stands.</p>'
        : '<div class="score">'+
            '<div class="sleft"><p class="lab">Financial awareness level</p>'+
              '<div class="big">'+aw+'<em>%</em></div><div class="bandname">'+esc(R.band)+'</div></div>'+
            '<div class="sright">'+
              '<div class="scale"><i style="width:'+aw+'%"></i>'+
                '<u class="m40"></u><u class="m70"></u></div>'+
              '<div class="scalelab"><span>Early</span><span>Building</span><span>Strong</span></div>'+
              '<p class="bandnote">'+bandNote(R.band)+'</p>'+
            '</div></div>')+
        topicRows+
        '<div class="qwrap">'+qBlocks+'</div>'+
        '<p class="method">How this is worked out: each option in a scored question carries points. '+
          'The level is the points earned across the room divided by the points available. '+
          'Questions with no right answer are shown as a breakdown and left out of the level. '+
          'Every answer is anonymous &mdash; no individual response is recorded or shared.</p>'+
        '<div class="dend">jugnu &nbsp;&mdash;&nbsp; <span>SEE BEYOND</span></div>'+
      '</div>'+
    '</div>';
  barMeta.textContent='Report';
  wireMetaFields();
  on('mSave',saveMeta);
  on('repPrint',function(){ window.print(); });
  on('repBack',function(){ STAGE='run'; location.hash='#present'; });
  on('repSave',function(){
    call({act:'save',code:CODE}).then(function(d){
      if(d&&d.ok){ loadReport(); alert('Saved. You can reopen this workshop from the list.'); }
    }).catch(function(){});
  });
  [].forEach.call(app.querySelectorAll('.pastrow'),function(b){
    b.addEventListener('click',function(){
      call({act:'load',code:CODE,row:b.dataset.row}).then(function(d){
        if(d&&d.ok){ REPORT=d; META=d.meta||META; render(true);
          window.scrollTo({top:0,behavior:'smooth'}); }
      }).catch(function(){});
    });
  });
}

function render(force){
  var sig=signature();
  if(!force){
    if(EDIT!==null) return;        // an open editor must not be swept away
    if(sig===LASTSIG) return;      // nothing changed
    if(typing()) return;           // someone is mid-word
  }
  LASTSIG=sig;
  versionCheck();
  MODE==='rep' ? renderReport() : MODE==='pres' ? renderPresenter() : renderAudience();
}

var qrDone='';
function drawQR(){
  var host=document.getElementById('qr');
  if(!host || typeof QRCode==='undefined') return;
  var u=audienceURL(); if(qrDone===u && host.childElementCount) return;
  host.innerHTML=''; qrDone=u;
  try{ new QRCode(host,{text:u,width:132,height:132,colorDark:'#14274A',colorLight:'#ffffff'}); }catch(e){}
}

/* ---- start ---- */
try{ CODE=sessionStorage.getItem('jugnu.poll.code')||''; }catch(e){}
if(!ENDPOINT){ setup(); }
else{
  render(); refresh(); if(MODE==='rep' && CODE) loadReport();
  /* the presenter needs it snappy; 150 phones must not all knock at once */
  var base = MODE==='pres' ? 2500 : 3000;
  setInterval(function(){
    if(document.hidden) return;
    refresh();
  }, base + Math.round(Math.random()*(MODE==='pres'?400:1500)));
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) refresh(); });
  /* Typing #present into the address bar does not reload the page, so the mode
     has to be re-read when the hash changes — otherwise the presenter is left
     looking at the audience view and thinks nothing happened. */
  window.addEventListener('hashchange',function(){
    var want = modeFor(location.hash+location.search);
    if(want!==MODE){ MODE=want; EDIT=null; if(want==='rep'){ REPORT=null; loadReport(); }
      render(true); refresh(); }
  });
}
})();

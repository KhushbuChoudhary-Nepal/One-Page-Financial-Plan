  }
  if(openBlock()){ return renderBlockAudience(openBlock()); }
  var q=activeQ();
  if(!q){
    app.innerHTML='<div class="aud"><div class="rest"><span class="dot"></span>'+
      '<h2>Waiting for the next question</h2>'+
      '<p>Keep this page open. The question appears the moment it opens.</p></div></div>';
    barMeta.textContent='Waiting'; return;
  }
  var mine=MYANS[q.id], open=!!S.open, reveal=!!S.revealed, body;
  if(reveal && S.counts){
    var t=counts(q), best=Math.max.apply(null,t.counts);
    body='<div class="res">'+q.options.map(function(o,i){
      var pct=t.total?Math.round(t.counts[i]/t.total*100):0;
      return '<div class="rrow'+((t.total&&t.counts[i]===best)?' top':'')+'">'+
        '<span class="rname">'+esc(o)+(mine===i?' &nbsp;<b>&mdash; you</b>':'')+'</span>'+
        '<span class="rpct">'+pct+'%</span>'+
        '<span class="rtrack"><i class="rfill" style="width:'+pct+'%"></i></span></div>';
    }).join('')+'</div><p class="note">'+t.total+' '+(t.total===1?'answer':'answers')+' from the room.</p>';
  } else {
    body='<div class="opts">'+q.options.map(function(o,i){
      var st=(mine===i)?(VSTATE[q.id]||'ok'):'';
      return '<button class="opt'+(mine===i?' on':'')+(st==='busy'?' pending':'')+
        (st==='fail'?' failed':'')+'" data-i="'+i+'"'+(open?'':' disabled')+'>'+
        '<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div><p class="note'+(VSTATE[q.id]==='fail'?' warn':'')+'">'+(open
      ? (mine==null ? 'Anonymous &mdash; nobody sees your answer, not even Khushbu.'
        : VSTATE[q.id]==='busy' ? 'Saving your answer&hellip;'
        : VSTATE[q.id]==='fail' ? 'That did not reach us &mdash; tap your answer again.'
        : 'Answer saved. You can change it while voting is open.')
      : (mine==null ? 'Voting is closed for this question.'
                    : 'Voting is closed. Your answer is saved.'))+'</p>';
  }
  app.innerHTML='<div class="aud"><div class="qcard">'+
    '<p class="qn">Question '+(askedNumber(q)||1)+'</p>'+
    (q.lead?'<p class="lead">'+esc(q.lead)+'</p>':'')+
    '<h1 class="qtext">'+esc(q.q)+'</h1>'+body+'</div></div>';
  barMeta.textContent = reveal?'Results':(open?'Voting open':'Voting closed');
  [].forEach.call(app.querySelectorAll('.opt'),function(b){
    b.addEventListener('click',function(){ vote(q.id,+b.dataset.i); });
  });
}

function renderBlockAudience(topic){
  var qs=blockShown(topic), txt=blockText(topic);
  if(!qs.length){
    app.innerHTML='<div class="aud"><div class="rest"><span class="dot"></span>'+
      '<h2>Waiting for the next question</h2><p>Keep this page open.</p></div></div>';
    return;
  }
  if(INTRO_SENT){
    app.innerHTML='<div class="aud"><div class="rest">'+
      '<div class="tickbig">&#10003;</div><h2>Thank you</h2>'+
      '<p>'+esc(txt.done||'That is all for now — keep this page open.')+'</p></div></div>';
    barMeta.textContent='Done'; return;
  }
  app.innerHTML='<div class="aud">'+
    '<h1 class="hello">'+esc(txt.hello)+'</h1>'+
    (txt.priv?'<p class="priv">'+esc(txt.priv)+'</p>':'')+
    qs.map(function(q,n){
      /* The setting-up sentence comes first, then the question — the same order
         a person would say them out loud. */
      return '<div class="iq">'+
        (q.lead?'<p class="ilead">'+(n+1)+'. '+esc(q.lead)+'</p>'+
                '<p class="iqt sub">'+esc(q.q)+'</p>'
              :'<p class="iqt">'+(n+1)+'. '+esc(q.q)+'</p>')+
        '<div class="iopts">'+q.options.map(function(o,i){
          return '<button class="io'+(picked(q,i)?' on':'')+(q.multi?' many':'')+
            '" data-q="'+esc(q.id)+'" data-i="'+i+'">'+
            '<i>'+(q.multi?'&#10003;':String.fromCharCode(65+i))+'</i><span>'+esc(o)+'</span></button>'; }).join('')+
        '</div></div>';
    }).join('')+
    '<button class="isub" id="iSub"'+(INTRO_BUSY?' disabled':'')+'>'+
      (INTRO_BUSY?('Sending '+INTRO_AT+' of '+qs.length+'&hellip;')
                 :(INTRO_FAIL?'Tap to send again':'Submit'))+'</button>'+
    '<p class="note'+(INTRO_FAIL?' warn':'')+'" id="iNote">'+
      (INTRO_FAIL?failNote(qs)
                 :'Please answer all '+qs.length+' before you submit.')+'</p>'+
  '</div>';
  barMeta.textContent=topic;
  [].forEach.call(app.querySelectorAll('.io'),function(b){
    b.addEventListener('click',function(){
      var id=b.dataset.q, i=b.dataset.i;
      var q=qs.filter(function(x){ return x.id===id; })[0];
      if(q && q.multi){
        var cur=String(MYANS[id]||'').split('|').filter(Boolean);
        var at=cur.indexOf(i);
        if(at>=0) cur.splice(at,1);
        else { if(cur.length>=3) return; cur.push(i); }
        MYANS[id]=cur.join('|');
      } else {
        MYANS[id]=+i;
        /* Changing the answer above can take the follow-up question away with
           it — an answer to a question nobody can see must not be sent. */
        blockLive(topic).forEach(function(x){
          if(x.follows===id && String(MYANS[id])!=='0') delete MYANS[x.id];
        });
      }
      render(true);
    });
  });
  on('iSub',function(){
    if(INTRO_BUSY) return;
    var missing=blockShown(topic).filter(function(q){ return !answered(q); });
    if(missing.length){
      var n=document.getElementById('iNote');
      n.textContent='Still '+missing.length+' to answer.'; n.className='note warn';
      return;
    }
    sendIntro(blockShown(topic));
  });
}

/* Worth retrying only when nothing was decided — a closed question or a
   malformed answer will fail again just as fast. */
function retryable(d){ return !d || (!d.ok && (!d.error || d.error==='busy')); }

/* Plain words for what Google actually said, so a failure on the day can be
   read off the phone instead of guessed at. */
function reason(d){
  if(!d) return 'could not reach Google';
  if(d.error==='closed')   return 'the intro is not open on the presenter screen';
  if(d.error==='busy')     return 'Google was busy';
  if(d.error==='bad vote') return 'the answers were not understood';
  if(d.error)              return String(d.error);
  if(d.ok && d.saved===undefined) return 'the link points at an old copy of the script';
  if(d.ok) return 'only '+d.saved+' of the answers were saved';
  return 'unknown';
}

/* How many of the block are already safely stored. */
function doneCount(qs){ return qs.filter(function(q){ return INTRO_DONE[q.id]; }).length; }

/* Said in the person's own terms: nearly finished beats "it failed", because
   somebody told they are one tap from done will actually take that tap. */
function failNote(qs){
  var n=doneCount(qs), t=qs.length, left=t-n;
  if(n===0) return 'That did not go through \u2014 '+(INTRO_WHY||'unknown')+'. Tap to send again.';
  return n+' of '+t+' sent \u2014 tap to send the '+(left===1?'last one':'other '+left)+'.';
}

function sendIntro(qs){
  INTRO_BUSY=true; INTRO_FAIL=false; INTRO_WHY=''; INTRO_AT=doneCount(qs); render(true);
  var sid=S.sessionId;
  var pending=qs.filter(function(q){ return !INTRO_DONE[q.id]; });
  /* Everything in one message when Google accepts it, otherwise one at a time.
     Sequential is the point: nothing is sent until the one before it is
     safely written, so two answers can never collide. */
  var first = (pending.length===qs.length) ? batchSend(qs,sid) : Promise.reject(new Error('resume'));
  first.then(function(){ qs.forEach(function(q){ INTRO_DONE[q.id]=true; }); })
    .catch(function(){ return oneByOne(pending,sid,qs); })
    .then(function(){ INTRO_BUSY=false; INTRO_SENT=true; render(true); })
    .catch(function(e){
      /* The answers may be safely stored even when the reply never came back —
         office networks drop the return trip often enough that assuming the
         worst would scare people whose answers are already in the sheet. Ask
         Google what it actually has before saying anything failed. */
      var why=String((e && e.message) || e || 'unknown');
      return confirmStored(qs,sid).then(function(complete){
        INTRO_BUSY=false;
        if(complete){ INTRO_SENT=true; INTRO_FAIL=false; }
        else { INTRO_FAIL=true; INTRO_WHY=why; }
        render(true);
      });
    });
}

/* Asks which of this device's answers Google already holds, and ticks them
   off. Returns true when the whole block is safely stored. */
function confirmStored(qs,sid){
  return call({act:'mine', sess:sid, dev:VID}).then(function(d){
    if(!d || !d.ok || !d.have) return false;
    d.have.forEach(function(id){ INTRO_DONE[id]=true; });
    return doneCount(qs)===qs.length;
  }).catch(function(){ return false; });
}

function batchSend(qs,sid){
  var ids=qs.map(function(q){ return q.id; }).join(',');
  var cs =qs.map(function(q){ return MYANS[q.id]; }).join(',');
  return call({act:'votes', sess:sid, qid:ids, opt:cs, dev:VID}).then(function(d){
    if(d && d.ok && d.saved===qs.length) return true;
    throw new Error('batch refused');
  });
}

/* One at a time, each waiting for the one before it, counting up on screen so
   a slow phone looks busy rather than broken. */
function oneByOne(pending,sid,all){
  return pending.reduce(function(chain,q){
    return chain.then(function(){
      INTRO_AT=doneCount(all)+1; render(true);
      return sendOne(q,sid,0).then(function(){
        INTRO_DONE[q.id]=true; INTRO_AT=doneCount(all); render(true);
      });
    });
  }, Promise.resolve()).then(function(){ return true; });
}

/* Three tries, 1s then 2s then 4s apart — long enough to ride out the wifi
   wobble that a room full of phones will produce. */
function sendOne(q,sid,tries){
  return call({act:'vote', sess:sid, qid:q.id, opt:MYANS[q.id], dev:VID}).then(function(d){
    if(d && d.ok) return true;
    /* A shut question will refuse just as fast next time — everything else,
       a dropped connection included, is worth another go. */
    if(d && d.error==='closed') throw new Error('stop:the intro is not open on the presenter screen');
    throw new Error('retry');
  }).catch(function(e){
    var m=String((e && e.message) || e);
    if(m.indexOf('stop:')===0) throw new Error(m.slice(5));
    if(tries<2) return new Promise(function(r){ setTimeout(r, 1000*Math.pow(2,tries)); })
                      .then(function(){ return sendOne(q,sid,tries+1); });
    throw new Error('the connection dropped');
  });
}

/* One question, one answer in the air at a time. Two taps sent together are
   written in whatever order Google gets to them, so a quick change of mind
   could be overwritten by the answer it replaced. Each question therefore has
   its own queue, and what goes out is always the latest choice at the moment
   of sending — not the choice that was made when the tap happened. */
var VQ={}, VSENT={};

function vote(qid,i){
  MYANS[qid]=i; VSTATE[qid]='busy'; render(true);
  var run=function(){ return sendVote(qid); };
  VQ[qid]=(VQ[qid]||Promise.resolve()).then(run,run);
  return VQ[qid];
}

function sendVote(qid){
  var i=MYANS[qid];
  if(i===undefined) return Promise.resolve();
  if(VSENT[qid]===i && VSTATE[qid]==='ok') return Promise.resolve();   // already stored
  var sid=S.sessionId, tries=0;
  return new Promise(function(done){
    (function go(){
      tries++;
      call({act:'vote', sess:sid, qid:qid, opt:i, dev:VID}).then(function(d){
        /* Only a reply naming the option counts. Anything vaguer might be an
           older script, or a reply that never described what was written. */
        if(d && d.ok && (d.c===undefined || +d.c===i)){ VSENT[qid]=i; return fin('ok'); }
        if(d && d.error==='closed') return fin('fail');
        throw new Error('retry');
      }).catch(function(){
        if(MYANS[qid]!==i) return done();          // they have changed it again
        if(tries<3){ setTimeout(go, 1000*tries); return; }
        /* The write may have landed even though the reply was lost, so ask
           before telling them it failed. */
        call({act:'mine', sess:sid, dev:VID}).then(function(d){
          var at=d && d.ok && d.at ? d.at[qid] : undefined;
          if(at!==undefined && +at===i) VSENT[qid]=i;
          fin((at!==undefined && +at===i) ? 'ok' : 'fail');
        }).catch(function(){ fin('fail'); });
      });
      function fin(how){ settle(qid,i,how); done(); }
    })();
  });
}

function settle(qid,i,how){
  if(MYANS[qid]!==i) return;      // a newer tap owns the answer now
  VSTATE[qid]=how; render(true);
}

/* ---- presenter ---- */
var META_FIELDS=[['orgtype','Type of organisation'],['company','Organisation name'],['title','Workshop name'],['date','Date'],
                 ['time','Start time'],['place','Place'],
                 ['participants','People in the room'],['duration','Duration']];
/* The start screen asks for an estimate. The report asks what actually
   happened, so "43 of 150" is measured against the real room, not a guess. */
var REPORT_FIELDS=META_FIELDS.concat([['attended','Actually attended']]);
var DURATIONS=['30 minutes','1 hour','90 minutes','2 hours'];

/* Date and duration are the two fields people mistype, so neither is a free
   text box: one is the browser's own calendar, the other a short list with a
   way out for anything unusual. */
var ORG_TYPES=['Company','Educational institute','Other'];
/* What the report calls the people in the room. A school is not a company and
   the report should not tell its principal that it is. */
function peopleWord(){
  var t=String((typeof META!=='undefined' && META.orgtype)||'');
  return /educat/i.test(t) ? 'students' : /other/i.test(t) ? 'participants' : 'employees';
}
function metaField(f){
  var k=f[0], v=META[k]||'';
  if(k==='orgtype')
    return '<label><span class="lab">'+f[1]+'</span><select id="m_orgtype">'+
      ORG_TYPES.map(function(o){
        return '<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+
      '</select></label>';
  if(k==='date')
    return '<label><span class="lab">'+f[1]+'</span>'+
      '<input type="date" id="m_date" value="'+esc(v)+'"></label>';
  if(k==='time')
    return '<label><span class="lab">'+f[1]+'</span>'+
      '<input type="time" id="m_time" value="'+esc(v)+'"></label>';
  if(k==='duration'){
    /* Custom does not add a second box — the list turns into a text field in the
       same place, so the row never changes shape. */
    var known = DURATIONS.indexOf(v)>=0, custom = !!v && !known;
    return '<label><span class="lab">'+f[1]+'</span>'+
      '<select id="m_duration" class="'+(custom?'hide':'')+'">'+
        '<option value=""'+(v?'':' selected')+'>Select</option>'+
        DURATIONS.map(function(d){
          return '<option'+(v===d?' selected':'')+'>'+d+'</option>'; }).join('')+
        '<option value="__other">Custom</option>'+
      '</select>'+
      '<input type="text" id="m_durationOther" class="'+(custom?'':'hide')+'" '+
        'placeholder="Type how long" value="'+esc(custom?v:'')+'"></label>';
  }
  return '<label><span class="lab">'+f[1]+'</span>'+
    '<input type="text" id="m_'+k+'" value="'+esc(v)+'"></label>';
}
function readMetaFields(){
  /* the report has one extra field, so read whichever set is on screen */
  REPORT_FIELDS.forEach(function(f){
    var e=document.getElementById('m_'+f[0]); if(e) META[f[0]]=e.value;
  });
  var ot=document.getElementById('m_orgtype'); if(ot) META.orgtype=ot.value;
  var sel=document.getElementById('m_duration'), other=document.getElementById('m_durationOther');
  if(other && !other.classList.contains('hide')) META.duration = other.value.trim();
  else if(sel) META.duration = sel.value==='__other' ? '' : sel.value;
}
function wireMetaFields(){
  var sel=document.getElementById('m_duration'), other=document.getElementById('m_durationOther');
  if(!sel||!other) return;
  sel.addEventListener('change',function(){
    if(sel.value!=='__other') return;
    other.value='';
    sel.classList.add('hide');
    other.classList.remove('hide');
    other.focus();
  });
  /* Left empty, it goes back to the list rather than trapping you in a blank box. */
  other.addEventListener('blur',function(){
    if(other.value.trim()) return;
    other.classList.add('hide');
    sel.classList.remove('hide');
    sel.value='';
  });
  other.addEventListener('keydown',function(e){ if(e.key==='Escape') other.blur(); });
}
/* 2026-09-12 reads badly on a report sent to a company. */
function prettyDate(v){
  if(!v) return '';
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if(!m) return v;
  var mo=['January','February','March','April','May','June','July','August',
          'September','October','November','December'][+m[2]-1];
  return (+m[3])+' '+mo+' '+m[1];
}

function wirePlan(){

/* Every workshop is named for the moment it began, so its age is in its name. */
function sessionStarted(id){
  var m=/^s(\d{10,})$/.exec(String(id||''));
  if(!m) return null;
  var t=parseInt(m[1],10);
  return t>0 ? new Date(t) : null;
}
/* A workshop nobody ended keeps the last question on screen for everyone
   holding the link. After a few hours that is almost certainly not intended,
   so the presenter is told before she does anything else. */
var LEAVEOLD=false;
function oldSessionBar(){
  if(LEAVEOLD || !S) return '';
  var live = S.activeId || S.block || (S.asked && S.asked.length);
  if(!live) return '';
  var began=sessionStarted(S.sessionId);
  if(!began) return '';
  var hrs=(Date.now()-began.getTime())/3600000;
  if(hrs < 3) return '';
  var when = hrs < 24
    ? 'started ' + Math.round(hrs) + ' hours ago'
    : 'started on ' + began.getDate() + ' ' +
      ['January','February','March','April','May','June','July','August',
       'September','October','November','December'][began.getMonth()];
  var what = S.block ? 'The ' + esc(S.block) + ' questions are'
           : S.activeId ? 'A question is'
           : 'It is';
  return '<div class="oldsess">'+
    '<p class="oldhead">A workshop is still running</p>'+
    '<p class="oldline">It was '+when+'. '+what+' on screen for anyone who opens '+
      'the link. Ending it saves the workshop &mdash; you can reopen its report '+
      'from the list below.</p>'+
    '<div class="oldbtns">'+
      '<button class="b2" id="oldEnd">End it now</button>'+
      '<button class="b2 ghost" id="oldKeep">Leave it running</button>'+
    '</div></div>';
}

function renderHome(){
  var running = S && S.activeId;
  app.innerHTML='<div class="homewrap">'+
    oldSessionBar()+
    '<div class="hcard">'+
      '<h2>Start a fresh poll</h2>'+

      '<button class="b2" id="hStart">Start the poll</button>'+

    '</div>'+

      (SESSIONS===null ? '<p class="hsub">Loading&hellip;</p>'

        : '<p class="hsub">None saved yet. Run a poll, then press Save this workshop on the report.</p>')+

  barMeta.textContent='Presenter';

    call(q).then(function(){ return call({act:'reset',code:CODE}); })

  });

  on('oldEnd',function(){

      SESSIONS=null; loadSessions(); refresh(); render(true);
    }).catch(function(){ alert('Could not reach Google. Check your connection and try again.'); });
  });
  [].forEach.call(app.querySelectorAll('.pastrow'),function(b){

      call({act:'load',code:CODE,row:b.dataset.row}).then(function(d){
        if(d&&d.ok){ REPORT=d; takeEdits(d); META=d.meta||META; location.hash='#report'; }
      }).catch(function(){});
    });

}

/* Removing a saved workshop. It names what is going before it goes, because the
   rows look alike and one mis-tap would otherwise lose a session. */
function wireDrop(){
  [].forEach.call(app.querySelectorAll('.pastdel'),function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      if(!confirm('Remove '+b.dataset.name+' from the list?\n\n'+
        'The report is deleted. The answers stay in the Votes sheet, and Google '+
        'keeps its own version history if this was a mistake.')) return;
      b.disabled=true;
      call({act:'drop',code:CODE,row:b.dataset.drop}).then(function(d){
        if(d&&d.ok){ SESSIONS=null; loadSessions(); render(true); }
        else { b.disabled=false; alert('Could not remove it. Try again.'); }
      }).catch(function(){ b.disabled=false; });
    });
  });
}

/* Topics that belong together on a day. Picking one offers the other — a
   nudge while you plan, never a rule. */
var GOES_WITH = {
  'Retirement':      ['SSF, CIT, EPF',        'that is where their retirement money actually sits'],
  'Setting Goals':   ['Goal-Based Investing', 'goals, then where the money for them goes'],
  'Children':        ['Life Insurance',       'they share the protection question'],
  'Emergency Fund':  ['Managing Loans',       'losing an income and servicing a loan are the same day']
};
/* Two questions that ask the same thing from different sides. Asking both
   spends a poll and the room notices. */
var SAME_AS = { 'ef_2':'ln_3', 'ln_3':'ef_2' };
/* A question that gives away the answer to another one, so the order matters. */
var ASK_BEFORE = { 'se_2':'se_1' };

function qById(id){ return questions().filter(function(x){ return x.id===id; })[0]; }

/* What to warn about on a question card, in the words you would want to read
   while standing in front of a room. */
function cardWarn(q){
  var out=[];
  if(q.hint) out.push('<span class="tqw hint">'+esc(q.hint)+'</span>');
  var same=SAME_AS[q.id];
  if(same){
    var o=qById(same);
    if(o && wasAsked(o)) out.push('<span class="tqw warn">Similar to a question already asked in '+
      esc(o.topic||'')+'</span>');
  }
  var first=ASK_BEFORE[q.id];
  if(first){
    var f=qById(first);
    if(f && !wasAsked(f)) out.push('<span class="tqw warn">Ask &ldquo;'+esc(f.q)+'&rdquo; first &mdash; '+
      'this one gives the answer away</span>');
  }
  return out.length?'<div class="tqws">'+out.join('')+'</div>':'';
}

/* The live question's numbers arrive in S.counts; every other question's in
   S.all. A card that has been asked and closed still shows its own result. */
function cardCounts(q){
  if(isLive(q)) return counts(q);
  var a=(S && S.all && S.all[q.id]) || null, by=(a && a.by) || {}, c=[];
  for(var i=0;i<q.options.length;i++) c.push(+by[i]||0);
  return { counts:c, total:(a && a.total) || 0 };
}

/* One question, in whichever of its four states it happens to be. */
function qCard(q){
  var live=isLive(q), asked=wasAsked(q), kept=isOn(q), t=cardCounts(q);
  var best=t.total?Math.max.apply(null,t.counts):0;
var open_=live && S.open;
  var st = open_ ? '<span class="tqst live">&#9679; Voting open</span>'
         : live  ? '<span class="tqst shut">Voting closed</span>'
         : asked ? '<span class="tqst done">&#10003; Asked</span>'
         : kept  ? '<span class="tqst wait">Not asked</span>'
                 : '<span class="tqst off">Removed</span>';
  var head='<div class="tqh"><span class="tqr">'+esc(rungName(q)||'Extra')+'</span>'+
    (q.tag?'<span class="tqtag">'+esc(q.tag)+'</span>':'')+st+'</div>';

  var body;
  if(live || asked){
    body='<div class="sres">'+q.options.map(function(o,i){
      var pct=t.total?Math.round(t.counts[i]/t.total*100):0;
      var sc=(q.scores&&q.scores[i]!==undefined)?q.scores[i]:0;
      var cl=!q.scored||sc<0?'na':(sc===0?'s0':sc===1?'s1':'s2');
      return '<div class="srow">'+
        '<span class="sname">'+esc(o)+'</span><span class="sn">'+t.counts[i]+'</span>'+
        '<span class="spct">'+pct+'%</span>'+
        '<span class="strack"><i class="sfill '+cl+'" style="width:'+pct+'%"></i></span></div>';
    }).join('')+'</div>';
  } else {
    body='<div class="prev">'+q.options.map(function(o,i){
      var sc=(q.scores&&q.scores[i]!==undefined)?q.scores[i]:0;
      return '<div class="pv'+(sc<0?' na':'')+'"><span>'+String.fromCharCode(65+i)+'</span>'+esc(o)+
        (q.scored?'<b>'+(sc<0?'&mdash;':sc)+'</b>':'')+'</div>';
    }).join('')+'</div>';
  }

  var foot;
  if(live){
    foot='<div class="tqf">'+(open_?clockBox():'')+
      '<span class="tqn">'+ofRoom(t.total)+' answered</span><span class="tqsp"></span>'+
      '<button class="b" data-rev="1">'+(S.revealed?'Hide results':'Show results to the room')+'</button>'+
      '<button class="b'+(open_?' go':'')+'" data-close="1">'+
        (open_?'Close voting':'Open voting again')+'</button></div>';
  } else if(asked){
    foot='<div class="tqf"><span class="tqn">'+ofRoom(t.total)+' answered</span>'+
      '<span class="tqsp"></span>'+
      '<button class="b" data-ask="'+esc(q.id)+'">Ask again</button>'+
      pipeBtn(q)+'</div>';
  } else if(kept){
    foot='<div class="tqf"><button class="b go" data-ask="'+esc(q.id)+'">Ask the room</button>'+
      pipeBtn(q)+
      '<span class="tqsp"></span>'+
      '<button class="b warn" data-off="'+esc(q.id)+'">Remove from today</button></div>';
  } else {
    foot='<div class="tqf"><button class="b" data-ask="'+esc(q.id)+'">Ask the room anyway</button>'+
      '<button class="b" data-off="'+esc(q.id)+'">Put back in today</button></div>';
  }

  return '<div class="tq'+(live?' live':'')+(kept?'':' out')+(asked&&!live?' tqdone':'')+'">'+
    head+cardWarn(q)+
    (q.lead?'<p class="tqlead">'+esc(q.lead)+'</p>':'')+
    '<p class="tqq">'+esc(q.q)+'</p>'+body+
    (q.after&&(asked||live)?'<p class="tqaft"><b>Say after the result</b>'+esc(q.after)+'</p>':'')+
    foot+'</div>';
}

function pipeBtn(q){
  return inRun(q.id)
    ? '<button class="b pipein" data-pipe="'+esc(q.id)+'">&#10003; In pipeline</button>'
    : '<button class="b" data-pipe="'+esc(q.id)+'">+ Pipeline</button>';
}

function renderTopicPage(topic){
  var all=questions().filter(function(x){ return (x.topic||'')===topic; });
  var kept=all.filter(isOn), gone=all.filter(function(x){ return !isOn(x); });
  var askedN=all.filter(wasAsked).length;
  var liveHere=all.filter(isLive).length>0;
  var allIn=kept.length>0 && kept.every(function(x){ return inRun(x.id); });
  var g=GOES_WITH[topic];

  var stage='<div class="stage">'+topbar()+
    '<div class="ctrl top">'+
      '<button class="b" id="goHome">Back to the start</button>'+
      (kept.length?'<button class="b'+(allIn?'':' go')+'" id="addAll"'+(allIn?' disabled':'')+'>'+
        (allIn?'All in the pipeline':'Add all to pipeline')+'</button>':'')+
      '<button class="b" id="refreshNow">&#8635; Refresh now</button>'+
      '<span class="done end">Polls done <b>'+pollsDone()+'</b></span>'+
    '</div>'+
    '<div class="tphead"><h1>'+esc(topic)+'</h1>'+
      '<span>'+all.length+' question'+(all.length===1?'':'s')+
      ' &nbsp;&middot;&nbsp; '+askedN+' asked</span></div>'+
    (g?'<p class="tpsug">Also consider <b>'+esc(g[0])+'</b> &mdash; '+esc(g[1])+'</p>':'')+
    '<p class="tpnote">Ask them in order. After each result, decide whether the next one is worth asking.</p>'+
    kept.map(qCard).join('')+
    (gone.length?'<div class="tpoff"><h3>Removed from today</h3>'+
      '<p>Out of the plan, still here if the room takes you there.</p>'+
      gone.map(qCard).join('')+'</div>':'')+
  '</div>';

  app.innerHTML='<div class="pres">'+sidebar(selectedQ())+stage+'</div>';
  barMeta.textContent=topic;
  wire();
  [].forEach.call(app.querySelectorAll('[data-ask]'),function(b){
    b.addEventListener('click',function(){
      send({act:'set',activeId:b.dataset.ask,open:1,revealed:0});
    });
  });
  [].forEach.call(app.querySelectorAll('[data-off]'),function(b){
    b.addEventListener('click',function(){
      var id=b.dataset.off; setOn(id, offList().indexOf(id)>=0);
    });
  });
  var cl=app.querySelector('[data-close]');
  if(cl) cl.addEventListener('click',function(){ send({act:'set',open:S.open?0:1}); });
  var rv=app.querySelector('[data-rev]');
  if(rv) rv.addEventListener('click',function(){ send({act:'set',revealed:S.revealed?0:1}); });
  on('addAll',function(){

    if(add.length) setRun(runList().concat(add));
  });
  drawQR();

/* Where a question sits in the list you are looking at, not in the master list. */
function VISIBLE(){
  var qs=questions();
  return qs.filter(function(x){
    if((x.topic||'')===introTopic() && FILTER!==introTopic()) return false;
    if(FILTER!=='All' && (x.topic||'General')!==FILTER) return false;
    if(LEVEL!=='All' && (x.level||'Any')!==LEVEL && (x.level||'Any')!=='Any') return false;
    return true;
  });
}
function numberOf(q){
  var v=VISIBLE(), i=v.indexOf(q);
  return i<0 ? 'Question' : 'Question '+(i+1)+' of '+v.length;
}

/* Main topics on one row, the subtopics of the chosen one below. Three of the
   seven have nothing under them, so their second row is left out rather than
   showing a single tab that does nothing. */
/* Landing on a topic should show something, not an empty stage asking you to
   pick again — so the first question that survives the audience filter opens. */
function firstIn(topic){
  var qs=questions().filter(function(x){
    if((x.topic||'')!==topic) return false;
    if(LEVEL!=='All' && (x.level||'Any')!==LEVEL && (x.level||'Any')!=='Any') return false;
    return true;
  });
  return qs.length ? qs[0].id : null;
}

function topbar(){
  var qs=questions(), ps=pillars();
  var here=pillarOf(FILTER) || (ps[1]&&ps[1].name) || (ps[0]&&ps[0].name);
  var mine=ps.filter(function(p){ return p.name===here; })[0] || {topics:[]};
  var subs = mine.topics.length>1 ? mine.topics : [];
  /* Both rows live in one wrapper: the stage is a flex column with a wide gap
     between its children, and two loose rows would inherit it twice. */
  /* A topic holding something in today's pipeline carries the same green as the
     questions themselves, so the whole row can be read at a glance. */
  var run=runList();
  function topicInRun(t){
    return (S.questions||[]).some(function(x){
      return (x.topic||'')===t && run.indexOf(x.id)>=0; });
  }
  return '<div class="tophead">'+
    '<div class="ptabs">'+ps.map(function(p){
      var n=qs.filter(function(x){ return p.topics.indexOf(x.topic||'')>=0; }).length;
      var has=p.topics.some(topicInRun);
      return '<button class="ptab'+(has?' pipe':'')+(p.name===here?' on':'')+
        '" data-p="'+esc(p.name)+'">'+
        esc(p.name)+'<em>'+n+'</em></button>';
    }).join('')+'</div>'+
    (subs.length ? '<div class="stabs">'+subs.map(function(t){
      var c=qs.filter(function(x){ return (x.topic||'')===t; }).length;
      return '<button class="stab'+(topicInRun(t)?' pipe':'')+(FILTER===t?' on':'')+
        '" data-t2="'+esc(t)+'">'+
        esc(t)+'<i>'+c+'</i></button>';
    }).join('')+'</div>' : '')+
  '</div>';
}

function sidebar(q){
  var qs=questions(), tops=(S.topics||[]), levs=(S.levels||[]);
  var shown=qs.filter(function(x){
    /* Intro questions are a block, not part of the running order, so they appear
       only when you have actually asked for them. */
    if((x.topic||'')===introTopic() && FILTER!==introTopic()) return false;
    if(FILTER!=='All' && (x.topic||'General')!==FILTER) return false;
    return true;
  });
  var side='<div class="side">'+
    '<div class="navpair">'+
      '<button class="dashbtn" id="goHomeSide">Home</button>'+
      '<button class="dashbtn'+(BOARD?' on':'')+'" id="goBoard">Dashboard</button>'+
      '<button class="dashbtn'+(LIB?' on':'')+'" id="goLib">Library</button>'+
      '<button class="dashbtn'+((!BOARD&&!LIB&&!PIPE)?' on':'')+'" id="goRun">Current session</button>'+
    '</div>'+
    '<div class="navsep"></div>'+
    '<button class="dashbtn wide'+(PIPE?' on':'')+'" id="goPipe">Today Pipeline'+
      (runList().length?'<em>'+runList().length+'</em>':'')+'</button>'+
    /* The audience filter is gone. Every question is now written plainly enough
       for any age, and all three rungs of a topic go out in the same session —
       so there was nothing left for it to filter. */
    '<div><p class="lab">Questions'+(FILTER&&FILTER!=='All'?' &middot; '+esc(FILTER):'')+'</p><div class="qlist">'+
      (shown.length? shown.map(function(x,ix){
        var on=isOn(x);
        /* The number says which rung of the topic this is, so the list can be
           read at a glance while presenting. */
        var rg=x.rung, tag=(rg===1||rg===2||rg===3)?String(rg):(rg==='x'?'+':'\u00b7');
        var lv=(rg==='x')?'Any':'Mid';
        return '<div class="qrow'+(on?'':' out')+'">'+
          '<button class="qbtn'+(q&&x.id===q.id?' on':'')+
            (inRun(x.id)?' pipe':'')+'" data-id="'+esc(x.id)+'">'+
            '<i>'+(ix+1)+'</i><span>'+esc(x.q)+
            (wasAsked(x)?'<b class="ns was">asked</b>':(x.scored?'':'<b class="ns">not scored</b>'))+
            '</span></button>'+
          '<span class="lvtag lv-'+esc(lv)+'" title="'+esc(lv)+'">'+tag+'</span>'+
        '</div>'; }).join('')
        : '<p style="font-size:13px;color:var(--mute);margin:4px 0">Nothing in this topic yet.</p>')+
    '</div></div>'+
    '<button class="mini" id="addQ">+ Add a question</button>'+
    (isBlockTopic(FILTER) && blockQs(FILTER).length
      ? '<button class="mini" id="askIntro">Ask the '+esc(FILTER)+' block</button>' : '')+
    '<button class="mini" id="goRep">View the workshop report</button>'+
    '<div class="join"><p class="lab">Audience joins here</p>'+
      '<p class="url">'+esc(audienceURL())+'</p><div id="qr"></div></div></div>';

  return side;
}

/* Everything the room has said today, in the order it was asked, so the intro
   comes first when the intro went first. A look-back only — nothing here can
   ask, open or close anything. */
/* Today's running order, grouped the way a session is planned: by topic, so the
   shape of the hour is visible before it starts. Order within a topic is the
   order they were added. */
/* Beside the question, not in the button row at the top — the decision is made
   while reading it, so the control belongs where the eye already is. */
function pipeRow(q){
  if(!q) return '';
  return inRun(q.id)
    ? '<div class="piprow2"><span class="pipin">&#10003; Added to today&rsquo;s pipeline</span>'+
      '<button class="pipoff" data-pipe="'+esc(q.id)+'">Remove</button></div>'
    : '<div class="piprow2">'+
      '<button class="pipon" data-pipe="'+esc(q.id)+'">+ Add to pipeline</button></div>';
}

function renderPipeline(){
  var side=sidebar(null);
  var ids=runList(), all=(S.questions||[]);
  var byId={}; all.forEach(function(q){ byId[q.id]=q; });
  var picked=ids.map(function(i){ return byId[i]; }).filter(Boolean);

  var stage;
  if(!picked.length){
    stage='<div class="stage">'+topbar()+
      '<div class="meta"><span>Today Pipeline</span><span>Nothing added yet</span></div>'+
      '<h1 class="sq">Nothing in today\u2019s pipeline yet.</h1>'+
      '<p class="pipnote">Open a topic and press <b>Add to pipeline</b> on the '+
      'questions you mean to ask. They gather here, grouped by topic, so you can '+
      'see the shape of the session before you stand up.</p></div>';
  } else {
    /* topics in the order the library holds them, so the list reads the way the
       session is built rather than the order things happened to be tapped */
    var seen=[], byTop={};
    picked.forEach(function(q){
      var t=q.topic||'General';
      if(!byTop[t]){ byTop[t]=[]; seen.push(t); }
      byTop[t].push(q);
    });
    var order=(S.topics||[]);
    seen.sort(function(a,b){
      var ia=order.indexOf(a), ib=order.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    });
    var blocks=seen.map(function(t){
      var qs=byTop[t];
      return '<div class="piptop">'+
        '<div class="piph"><h4>'+esc(t)+'</h4>'+
          '<span>'+qs.length+' question'+(qs.length===1?'':'s')+'</span></div>'+
        qs.map(function(q){
          var lv=(q.level||'Any');
          return '<div class="piprow'+(wasAsked(q)?' done':'')+'">'+
            '<button class="pipgo" data-id="'+esc(q.id)+'">'+
              '<span>'+esc(q.q)+'</span>'+
              '<em>'+esc(lv)+(wasAsked(q)?' &middot; asked':'')+'</em></button>'+
            '<button class="pipdel" data-pipe="'+esc(q.id)+'" '+
              'title="Take out of the pipeline">&times;</button></div>';
        }).join('')+'</div>';
    }).join('');
    var done=picked.filter(wasAsked).length;
    stage='<div class="stage">'+topbar()+
      '<div class="meta"><span>Today Pipeline &nbsp;&middot;&nbsp; '+picked.length+
        ' question'+(picked.length===1?'':'s')+' across '+seen.length+' topic'+
        (seen.length===1?'':'s')+'</span>'+
        '<span>'+done+' asked &nbsp;&middot;&nbsp; '+(picked.length-done)+' to go</span></div>'+
      '<p class="pipnote">Tap any question to go straight to it. '+
        'The rest of the tool still works as it does &mdash; this is a shortcut, '+
        'not a fixed order.</p>'+
      blocks+'</div>';
  }
  app.innerHTML='<div class="pres">'+side+stage+'</div>';
  barMeta.textContent='Today Pipeline';
  wire();
  [].forEach.call(app.querySelectorAll('.pipgo'),function(b){
    b.addEventListener('click',function(){
      PIPE=false; BOARD=false; LIB=false; EDIT=null;
      SEL=b.dataset.id;
      var q=(S.questions||[]).filter(function(x){ return x.id===SEL; })[0];
      if(q) FILTER=q.topic||FILTER;
      render(true);
    });
  });
  drawQR();
}

/* What each answer will say in the report, beside the answer itself. This is a
   reference screen, not a working one — nothing here is editable, so a wrong
   line is something to tell me about rather than something to fix in a hurry. */
function renderLibrary(){
  var side=sidebar(null);
  var stage;
  if(!LIBDATA){
    stage='<div class="stage">'+topbar()+
      '<h1 class="sq">Loading the library&hellip;</h1></div>';
  } else {
    var says=LIBDATA.says||{}, verds=LIBDATA.verdicts||{}, themes=LIBDATA.themes||{};
    var qs=(S.questions||[]);
    var body=pillars().map(function(pl){
      var rows=pl.topics.map(function(t){
        var mine=qs.filter(function(q){ return (q.topic||'')===t; });
        if(!mine.length) return '';
        var v=verds[t]||{};
        var head='<div class="lbtop"><h4>'+esc(t)+'</h4>'+
          '<span>'+mine.length+' question'+(mine.length===1?'':'s')+'</span></div>'+
          (themes[t]?'<p class="lbtheme">'+esc(themes[t])+'</p>':'')+
          ((v.Low||v.Moderate||v.High)
            ? '<div class="lbverd">'+['Low','Moderate','High'].map(function(b){
                return v[b]?'<div><span>'+b+'</span>'+esc(v[b])+'</div>':''; }).join('')+
              '</div>' : '');
        var isIntro=(t===introTopic());
        var list=mine.map(function(q){
          var sy=says[q.id]||[];
          return '<div class="lbq"><p class="lbqh">'+esc(q.q)+
            '<em>'+esc(rungName(q))+'</em></p>'+
            (q.lead?'<p class="lblead">'+esc(q.lead)+'</p>':'')+
            '<div class="lbopts">'+q.options.map(function(o,i){
              var sc=(q.scores&&q.scores[i])||0;
              return '<div class="lbo">'+
                '<b>'+(q.scored?sc:'&mdash;')+'</b>'+
                '<span>'+esc(o)+'</span>'+
                /* The intro is never quoted as a line in the report — it builds
                   the profile sentence — so a missing phrase there is normal. */
                '<i'+(sy[i]?'':(isIntro?' class="na"':' class="none"'))+'>'+
                  (sy[i]?esc(sy[i])
                       :(isIntro?'not quoted in the report'
                               :'no written line &mdash; the report would print the answer itself'))+
                '</i></div>';
            }).join('')+'</div></div>';
        }).join('');
        return '<div class="lbtopic">'+head+list+'</div>';
      }).join('');
      return rows ? '<div class="lbpil"><p class="lbpname">'+esc(pl.name)+'</p>'+rows+'</div>' : '';
    }).join('');
    var tabs='<div class="ltabs">'+
      '<button class="ltab'+(LIBTAB==='read'?' on':'')+'" data-ltab="read">Library</button>'+
      '<button class="ltab'+(LIBTAB==='data'?' on':'')+'" data-ltab="data">Questions data</button>'+
      '</div>';
    stage='<div class="stage">'+topbar()+
      '<div class="meta"><span>Library &nbsp;&middot;&nbsp; '+qs.length+' questions</span>'+
        '<span>Reference only &mdash; nothing here prints</span></div>'+
      tabs+
      (LIBTAB==='data'
        ? libData(qs, says)
        : '<p class="lbnote">Every answer and the line it puts in the report. '+
          'The number on the left is the points that answer carries. '+
          'Tell me about anything that reads wrong and I will change it.</p>'+body)+
      '</div>';
  }
  app.innerHTML='<div class="pres">'+side+stage+'</div>';
  barMeta.textContent='Library';
  [].forEach.call(app.querySelectorAll('.ltab'),function(b){
    b.addEventListener('click',function(){ LIBTAB=b.dataset.ltab; render(true); });
  });
  wire(); drawQR();
}

/* What a question is called on the ladder. The old audience levels stopped
   meaning anything once every rung goes out in the same session. */
function rungName(q){
  if(!q.scored) return '';          /* the intro and feedback are not a ladder */
  var r=q.rung;
  if(r===1||r==='1') return 'Rung 1 \u00b7 Do you know?';
  if(r===2||r==='2') return 'Rung 2 \u00b7 Have you decided?';
  if(r===3||r==='3') return 'Rung 3 \u00b7 Will it hold?';
  if(r==='x')        return 'Extra';
  return '';
}

/* The whole record behind every question \u2014 what it scores, what it puts in
   the report, what it says to the room afterwards, and where it does not
   apply. This is the page to read before a workshop, not during one. */
function libData(qs, says){
  var out='<div class="qdrules"><h4>How the scoring works</h4>'+
    [['Per question','Every answer is worth 0, 1 or 2. No question outweighs another.'],
     ['Per person','Earned divided by the most they could have earned on the questions asked.'],
     ['Not applicable','Answers marked \u2014 mean the question does not apply. Never scored, either way.'],
     ['Who counts','One answer in a topic is enough to appear in it.'],
     ['Per topic','A topic with only one question asked gets no bar.'],
     ['Bands','Starting \u00b7 Building \u00b7 Progressing \u00b7 Prepared \u00b7 Well Prepared'],
     ['In the room','Know \u2192 Plan \u2192 Prepare']
    ].map(function(r){
      return '<div><span>'+esc(r[0])+'</span><em style="font-style:normal">'+esc(r[1])+'</em></div>';
    }).join('')+'</div>';

  out += pillars().map(function(pl){
    var rows=pl.topics.map(function(t){
      var mine=qs.filter(function(q){ return (q.topic||'')===t; });
      if(!mine.length) return '';
      return '<div class="lbtopic"><div class="lbtop"><h4>'+esc(t)+'</h4>'+
        '<span>'+mine.length+' question'+(mine.length===1?'':'s')+'</span></div>'+
        mine.map(function(q){ return libDataQ(q, says[q.id]||[]); }).join('')+'</div>';
    }).join('');
    return rows ? '<div class="lbpil"><p class="lbpname">'+esc(pl.name)+'</p>'+rows+'</div>' : '';
  }).join('');
  return out;
}

function libDataQ(q, sy){
  var chips='';
  if(q.tag)  chips+='<span class="chipn">'+esc(q.tag)+'</span>';
  if(q.also) chips+='<span class="chipn">also under '+esc(q.also)+'</span>';
  if(q.hint) chips+='<span class="chipn warn">'+esc(q.hint)+'</span>';
  var rn=rungName(q);
  return '<div class="qd">'+
    '<p class="qdh"><b>'+esc(q.id)+'</b>'+(rn?'<span>'+esc(rn)+'</span>':'')+chips+'</p>'+
    (q.lead?'<p class="qdlead">'+esc(q.lead)+'</p>':'')+
    '<p class="qdq">'+esc(q.q)+'</p>'+
    q.options.map(function(o,i){
      var sc=(q.scores&&q.scores[i]!==undefined)?q.scores[i]:0;
      var na=(sc<0)||!q.scored;
      var col=na?'#8296AC':(sc===0?'#B4332B':sc===1?'#A8740B':'#0B6F5C');
      var bg =na?'#EEF1F5':(sc===0?'#FBEBE9':sc===1?'#FBF3E2':'#E6F3EF');
      return '<div class="qdo">'+
        '<u style="color:'+col+';background:'+bg+'">'+(q.scored?(na?'&mdash;':sc):'&mdash;')+'</u>'+
        '<span>'+esc(o)+'</span>'+
        '<i>'+(sy[i]?esc(sy[i]):(q.scored?(na?'not counted':'&mdash;')
                                             :'not quoted in the report'))+'</i></div>';
    }).join('')+
    (q.after?'<p class="qdaft"><b>After they answer</b>'+esc(q.after)+'</p>':'')+
  '</div>';
}

function renderBoard(){
  var side=sidebar(null), all=(S.all)||{}, it=introTopic();
  var rows=askedList().map(function(id){
    var q=questions().filter(function(x){ return x.id===id; })[0];
    if(!q) return null;
    var t=all[id]||{total:0,by:{}};
    return { q:q, t:t, intro:(q.topic||'')===it };
  }).filter(Boolean);
  var most=rows.length?Math.max.apply(null,rows.map(function(r){ return r.t.total; })):0;

  /* Which main topics have actually been asked — the dashboard only offers
     those, so the row never fills with headings that lead to an empty page. */
  var groups=[], seen={};
  rows.forEach(function(r){

/* Reads what is on screen back into EDIT, so a reorder or an added row never
   throws away something half-typed. */
function edGather(){
  var opts=[], scr=[];
  [].forEach.call(document.querySelectorAll('[data-opt]'),function(el){ opts.push(el.value); });
  [].forEach.call(document.querySelectorAll('[data-pt]'), function(el){ scr.push(Math.max(0,+el.value||0)); });
  while(scr.length<opts.length) scr.push(0);
  EDIT.options=opts; EDIT.scores=scr;
  var g=function(id){ var e=document.getElementById(id); return e?e.value:''; };
  EDIT.q=g('edQ'); EDIT.lead=g('edL'); EDIT.topic=g('edT'); EDIT.level=g('edV');
  var c=document.getElementById('edS'); EDIT.scored=!!(c&&c.checked);
}

function wireEditor(){
  on('edSave',saveEdit);
  on('edCancel',function(){ EDIT=null; render(true); });
  on('edDel',function(){
    if(!confirm('Delete this question from the library?')) return;
    var qs=questions().filter(function(x){ return x.id!==EDIT.id; });
    EDIT=null; saveQuestions(qs);
  });
  on('edAdd',function(){
    edGather(); EDIT.options.push(''); EDIT.scores.push(0); render(true);
  });
  var chk=document.getElementById('edS');
  if(chk) chk.addEventListener('change',function(){ edGather(); render(true); });
  [].forEach.call(document.querySelectorAll('[data-del]'),function(b){
    b.addEventListener('click',function(){
      edGather(); var i=+b.dataset.del;
      if(EDIT.options.length<=2) return;
      EDIT.options.splice(i,1); EDIT.scores.splice(i,1); render(true);
    });
  });
  /* Points travel with their option, so a shuffle can never scramble scoring. */
  function move(i,j){
    edGather();
    if(j<0||j>=EDIT.options.length) return;
    var o=EDIT.options.splice(i,1)[0], p2=EDIT.scores.splice(i,1)[0];
    EDIT.options.splice(j,0,o); EDIT.scores.splice(j,0,p2);
    render(true);
  }
  [].forEach.call(document.querySelectorAll('[data-up]'),function(b){
    b.addEventListener('click',function(){ var i=+b.dataset.up; move(i,i-1); }); });
  [].forEach.call(document.querySelectorAll('[data-dn]'),function(b){
    b.addEventListener('click',function(){ var i=+b.dataset.dn; move(i,i+1); }); });
}

function saveEdit(){
  edGather();
  var qt=(EDIT.q||'').trim();
  var opts=(EDIT.options||[]).map(function(x){ return (x||'').trim(); }).filter(Boolean);
  if(!qt || opts.length<2){ alert('A question and at least two options, please.'); return; }
  var scores=opts.map(function(){ return 0; });
  if(EDIT.scored){
    scores=(EDIT.scores||[]).slice(0,opts.length).map(function(x){ return Math.max(0,+x||0); });
    while(scores.length<opts.length) scores.push(0);
    if(!scores.some(function(x){ return x>0; })){
      alert('At least one option needs points above zero, or untick the scoring box.'); return; }
  }
  var body={ q:qt, lead:(EDIT.lead||'').trim(), topic:EDIT.topic, level:EDIT.level,
             options:opts, scored:!!EDIT.scored, scores:scores };
  var qs=questions().slice();
  if(EDIT.id){ body.id=EDIT.id;
    for(var i=0;i<qs.length;i++) if(qs[i].id===EDIT.id) qs[i]=body; }
  else { body.id='q'+Date.now().toString(36); qs.push(body); }
  EDIT=null; saveQuestions(qs);
}

/* The screen is rebuilt from scratch on each draw, so drawing on every poll made
   it flicker and threw away anything half-typed. Redraw only when something the
   viewer can see has actually changed — and never while a box has focus. */
/* How long this question has been open, on the presenter's screen only.
   Kept in the page rather than in the sheet: the presenter is the one who opens
   a question, so her own clock is the honest start time, and it needs no change
   to the Google script. */
var OPEN_KEY='', OPEN_AT=0, FROZEN=0;
/* Calm under a minute, orange past one, red past two — a glance tells you
   whether the question is running long, without any arithmetic. */
function clockBox(){
  var s2=clockSecs();
  var cls = s2>=120 ? ' late' : (s2>=60 ? ' warm' : '');
  return '<span class="clk'+cls+'" id="clkBox"><small>OPEN</small>'+
    '<b id="clk">'+clockText()+'</b></span>';
}

function clockSecs(){
  var ms = S && (S.open||S.block) ? (Date.now()-OPEN_AT) : FROZEN;
  return Math.max(0, Math.floor(ms/1000));
}
function clockText(){
  var t=clockSecs();
  return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2);
}
function trackClock(){
  /* A block (Intro, Feedback) has no activeId — the whole block is the thing
     that is open, so it gets its own key and runs the same clock. */
  if(!S || (!S.activeId && !S.block)){ OPEN_KEY=''; FROZEN=0; return; }
  var key = S.block ? (S.sessionId+'|B:'+S.block) : (S.sessionId+'|'+S.activeId);
  if(S.block || S.open){
    if(key!==OPEN_KEY || !OPEN_AT){ OPEN_KEY=key; OPEN_AT=Date.now(); }
  } else if(key===OPEN_KEY && OPEN_AT){
    FROZEN = Date.now()-OPEN_AT;
    OPEN_AT = 0;
  } else if(key!==OPEN_KEY){
    OPEN_KEY=key; FROZEN=0;
  }
}

/* The storeroom: every rule the tool applies, in one place, written for the
   person presenting rather than for a programmer. It lives here rather than in
   a separate file so it can never drift out of date with the version running. */
function howItWorks(){
  function sec(h, rows){
    return '<div class="hwsec"><h4>'+h+'</h4>'+rows+'</div>';
  }

  }
  var bands=[['Starting','under 20%'],['Building','20 – 39%'],
             ['Progressing','40 – 59%'],['Prepared','60 – 79%'],
             ['Well Prepared','80% and above']];
  return '<div class="hw">'+
    '<p class="hwtop">How this report is worked out &mdash; yours only, and this '+
      'page never prints.</p>'+

    sec('The five levels',
      bands.map(function(b){
        return row(b[0]+' &middot; '+b[1], esc(BAND_NOTES[b[0]]||''));
      }).join('')) +

    sec('How the score is worked out',
      row('The figure',
        'Every option in a scored question carries points. Each person\u2019s score '+
        'is the points they earned divided by the points available on the '+
        'questions they answered. The dial shows the average of those scores '+
        '&mdash; one person, one weight, so somebody who answered eight questions '+
        'does not count for more than somebody who answered four.')+
      row('The bar underneath',
        'The same people, sorted into the five levels. The dial cannot show that '+
        'a room is split; the bar can. Two rooms averaging 41% can look completely '+
        'different here.')+
      row('Who is left out',
        'Anyone who answered fewer than half the scored questions. A score built '+
        'on two answers is noise, and noise at the edges moves the average. The '+
        'line under the dial says how many were left out.')) +

    sec('What never reaches the company',
      row('Income', 'Asked in the intro, kept in your panel, never printed.')+
      row('The &ldquo;I already knew this&rdquo; card',
        'Yours only. It tells you whether that group really did know it, or '+
        'whether they know more than they have acted on.')+
      row('This page', 'Never printed, on any copy.')) +

    sec('The audience levels',
      row('Under 30 &middot; 30 to 45 &middot; Over 45',
        'The intro asks in exactly these three bands, and they match Early, Mid '+
        'and Senior on the questions, so the room\u2019s shape and the question '+
        'filter can never tell two different stories.')+
      row('Mixed rooms',
        'In a real room the ages are mixed, so leave the filter on Show all and '+
        'use the level tag as your own guide for which question suits the people '+

    sec('When a finding is held back',
      row('Married with children',

      row('The observation',

      row('Next steps',
        'Everything above one in five, and never fewer than three, so the line '+
        'never rests on one person changing their mind.')) +

    sec('Which questions count',
      row('Scored', 'Only the teaching questions. Each option carries points.')+
      row('Never scored',
        'Intro and Feedback. They describe the room and the hour, they do not '+

/* Printed only when the group is large enough to mean something. Most scored
   questions ask what someone has done, not what they know, so a low score
   beside "I knew this already" is knowledge that has not become action. */
function observation(R, nothing){
  var I=R.insight;
  /* The section always appears once there is feedback to draw on — only the
     claim inside it is held back when the answers do not support it. */
  var said = I && I.pct;
  var claim = (I && I.show)
    ? '<b>'+I.pct+'%</b> '+ed('obs_claim',
        'said the session had little new to teach them \u2014 but their answers '+
        'place them below the room average. The information is there; the action '+
        'is missing.')
    : (said
      ? '<b>'+said+'%</b> '+ed('obs_claim',
          'said the session had little new to teach them. The poll still shows '+
          'gaps across the topics covered \u2014 the opportunity is to turn what '+
          'people already know into defined actions.')
      : '');
  var next = nothing
    ? '<b>'+nothing+'%</b> '+ed('obs_next',
        'do not plan to change anything \u2014 a group for targeted follow-up.') : '';
  if(!claim && !next) return '';
  return SECHEAD('The knowledge-to-action gap')+
    '<div class="obs">'+
      '<p class="obsk">Knowing is not the same as doing</p>'+
      (claim?'<p class="obsl">'+claim+'</p>':'')+
      (next?'<p class="obsn">'+next+'</p>':'')+
    '</div>';
}

/* The same group, in full, for the planner's own screen. Never printed. */
function knewCard(R){
  var I=R.insight;
  if(!I) return '';
  var head='<div class="gh"><h4>The &ldquo;I already knew this&rdquo; group</h4>'+
    '<span>yours only &middot; never printed</span></div>'+

  }
  var names=['Starting','Building','Progressing','Prepared','Well Prepared'];

    return '<div><u style="background:'+BAND_COLS[i]+'"></u><b>'+n+'</b>'+

}

/* The needle is one number — the average person. It cannot show that a room is
   split, and most rooms are. This bar can: each person is scored on their own
   answers and dropped into one of the five bands the dial is coloured in.
   Colour carries the meaning, so the bands are not labelled; the percentage
   inside each block is all the reading it needs. */
var BAND_COLS = ['#E03131','#F76707','#FAB005','#82C91E','#12B886'];
var BAND_NAMES = ['Starting','Building','Progressing','Prepared','Well Prepared'];
var BAND_MEANS = ['almost none of it in place','a start made, but no system yet',
                  'halfway — aware, not yet arranged','mostly in place, one gap left',
                  'they know it, they have arranged it, and it holds'];

/* One row per topic, in the same five colours as the dial. The single figure
   never showed that a room can be strong on loans and bare on insurance. */
function topicBars(R){
  var ts=(R.session_topics||[]).filter(function(t){ return t.spread && t.spreadOf; });
  if(!ts.length) return '';
  var rows=ts.map(function(t){
    var seg=t.spread.map(function(n,i){
      if(!n) return '';
      var pct=Math.round(n/t.spreadOf*100);
      /* the same rule as the room bar: a block with people in it shows its
         number, smaller if the block is narrow */
      return '<i class="'+(i===2?'dark ':'')+(pct<10?'thin':'')+'" style="flex:'+n+
        ';background:'+BAND_COLS[i]+'">'+pct+'%</i>';
    }).join('');
    return '<div class="tbrow"><span class="tbname">'+esc(t.topic)+'</span>'+
      '<span class="tbbar">'+seg+'</span></div>';
  }).join('');
  var key=BAND_NAMES.map(function(n,i){
    return '<span class="tbk"><u style="background:'+BAND_COLS[i]+'"></u><span>'+esc(n)+
      '</span><em>'+esc(BAND_MEANS[i])+'</em></span>';
  }).join('');
  return '<div class="tbars"><p class="sphead">Where people sit, topic by topic</p>'+
    rows+'<div class="tbkey">'+key+'</div></div>';
}
function spreadBar(R){
  var p = R.people;
  if(!p || !p.counted || !p.spread) return '';
  var tot = p.counted;
  var seg = p.spread.map(function(n,i){
    /* A band with nobody in it is left out altogether. Kept in, it still drew a
       small coloured stub at the edge of the bar, which read as a few people. */
    if(!n) return '';
    var pct = Math.round(n/tot*100);
    /* Every block that holds anybody carries its number. A narrow block gets a
       smaller figure rather than no figure; only an empty band stays blank. */
    var txt = n ? pct+'%' : '';
    var cls = (i===2?'dark ':'') + (pct<10 ? 'thin' : '');
    return '<i class="'+cls+'" style="flex:'+n+
      ';background:'+BAND_COLS[i]+'">'+txt+'</i>';
  }).join('');
  return '<div class="sp">'+
    '<p class="sphead">Where the '+tot+' '+(tot===1?'person sits':'people sit')+'</p>'+
    '<div class="spbar">'+seg+'</div></div>';
}
/* The report's last job is to say what happens after it. What was covered is
   the foundation to reinforce; what the room asked for is the next session. */
function nextSteps(R){
  var ST=R.session_topics||[], F=R.feedback||{};
  var now=ST.map(function(t){ return t.topic; });
  var want=(F.topics||[]).filter(function(t){ return t.topic; });
  var all=R.all_topics||[];
  var left=all.filter(function(t){ return now.indexOf(t)<0; });
  if(!now.length && !want.length) return '';

  var nextLine;
  if(want.length){
    nextLine='<p class="nsl"><b>Next</b> \u2014 chosen by the '+peopleWord()+
      ' who asked for more sessions:<br>'+
      want.slice(0,4).map(function(t){
        return esc(t.topic)+' <em>('+t.n+')</em>'; }).join(' &nbsp;&middot;&nbsp; ')+
      '</p>';
  } else if(left.length){
    nextLine='<p class="nsl"><b>Next</b> \u2014 not yet covered:<br>'+
      esc(left.slice(0,6).join(' \u00b7 '))+'</p>';
  } else nextLine='';

  return '<div class="nsteps">'+
    '<span class="nshead">Recommended next steps</span>'+
    (now.length?'<p class="nsl"><b>Now</b> \u2014 reinforce what was covered today:<br>'+
      esc(now.join(' \u00b7 '))+'</p>':'')+
    nextLine+'</div>';
}

/* The single word beside the dial describes the average person, and a reader
   fairly asks how the rest of the room sits around it. Three numbers answer it. */
function splitLine(R){
  var p=R.people; if(!p||!p.counted||!p.spread) return '';
  var b=bandIndex(R.awareness);
  if(b<0) return '';
  var below=0, above=0;
  p.spread.forEach(function(n,i){ if(i<b) below+=n; else if(i>b) above+=n; });
  var pc=function(n){ return Math.round(n/p.counted*100)+'%'; };
  /* At the top and the bottom of the scale one side of the room is empty, and
     "0% sit below it" is a sentence about nobody. */
  var rest='';
  if(below && above) rest=' '+pc(below)+' sit below it, and '+pc(above)+' above.';
  else if(below)     rest=' The other '+pc(below)+' sit below it.';
  else if(above)     rest=' The other '+pc(above)+' sit above it.';
  return '<p class="splitl">'+pc(p.spread[b])+' sit in that band.'+rest+'</p>';
}
function bandIndex(v){
  if(v===null||v===undefined) return -1;
  return v<20?0:v<40?1:v<60?2:v<80?3:4;
}

/* Said as a count, not a share — a number reads as a fact, a percentage reads
   as a complaint about the room. */
/* Two different facts, and the old line confused them: people who were in the
   room but never picked up a phone, and people who answered so little they
   could not be scored. */
function missedLine(R){
  var p = R.people; if(!p || !p.counted) return '';
  var out='';
  var present = parseInt(META.attended||META.participants,10);
  if(present && present > R.responded)
    out += '<br>'+R.responded+' of the '+present+' took part in the poll.';
  if(p.dropped)
    out += '<br>'+p.dropped+' answered too little to be scored.';
  return out;
}

/* What the band actually means — the first question anyone asks when they see
   the word, so it sits right beside it. One per colour on the dial. */
/* What the band means, written without naming any topic — the same five notes
   serve a session on budgeting and a session on retirement. */
var BAND_NOTES = {
  'Starting':
    'Almost none of it is in place yet \u2014 and that is normal, because nobody is '+
    'taught this. The first step is knowing your own numbers rather than guessing at them.',
  'Building':
    'A start has been made, but it is not steady. Most people here are managing month '+
    'to month without a system behind it. Turning intention into a fixed arrangement '+
    'is what moves this next.',
  'Progressing':
    'The habits are forming. Most people know what they should be doing; what is '+
    'missing is the arrangement that makes it happen without having to decide again '+
    'every month.',
  'Prepared':
    'Most of it is in place. What is left is the part that only shows under pressure '+
    '\u2014 whether the arrangement would hold if the income stopped or a large cost arrived.',
  'Well Prepared':
    'The arrangements are in place, and they would hold. The work now is reviewing '+
    'them as life changes, rather than building them.'
};

function bandNote(b){ return BAND_NOTES[b] || ''; }
function fmtDate(d){ return prettyDate(d); }
/* 14:30 reads as 2:30 pm on the report and in the list. */
function prettyTime(v){
  var m=/^(\d{1,2}):(\d{2})/.exec(String(v||''));
  if(!m) return String(v||'');
  var h=+m[1], ap=h<12?'am':'pm', h12=h%12; if(h12===0) h12=12;
  return h12+':'+m[2]+' '+ap;
}
/* Short form for the list, where the row must stay on one line. */
function shortDate(v){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));
  if(!m) return String(v||'');
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1];
  return (+m[3])+' '+mo+' '+m[1];
}
/* One saved workshop: who and what on the first line, when and where on the
   second, the awareness figure on the right. */
function pastRow(x){
  var bits=[];
  if(x.date) bits.push(shortDate(x.date));
  if(x.time) bits.push(prettyTime(x.time));
  if(x.place) bits.push(x.place);
  /* Total attended: the real count if it was entered, otherwise how many
     people actually answered — never the guess typed before the room filled. */
  var head = x.attended || x.responded || '';
  bits.push((head?head:'\u2014')+' attended');
  var aw = (x.awareness===''||x.awareness===null);
  return '<div class="pastwrap">'+
    '<button class="pastrow" data-row="'+x.row+'">'+
      '<b>'+esc(x.company||'Untitled')+'</b>'+
      '<i>'+(aw?'&mdash;':x.awareness+'%')+'<u>awareness</u></i>'+
      '<em>'+esc(x.title||'Workshop')+'</em>'+
      '<span>'+esc(bits.join(' \u00b7 '))+'</span></button>'+
    '<button class="pastdel" data-drop="'+x.row+'" '+
      'data-name="'+esc((x.company||'this workshop')+(x.date?' \u00b7 '+shortDate(x.date):''))+'" '+
      'title="Remove this workshop">&times;</button></div>';
}

/* ── the report ──────────────────────────────────────────────── */
/* A gauge, drawn here rather than fetched, so it prints and needs nothing from
   the internet. Colours run red at Low to green at High — awareness is a good
   thing, so a prepared room must not light up red on its own report. */
function gaugeSVG(pct){
  var CX=320, CY=286, RO=250, RI=158;
  var cols=['#E03131','#F76707','#FAB005','#82C91E','#12B886'];
  function pol(r,deg){ var a=deg*Math.PI/180;
    return [CX+r*Math.cos(a), CY-r*Math.sin(a)]; }
  function arc(i){
    var a0=180-i*36, a1=180-(i+1)*36;
    var p0=pol(RO,a0), p1=pol(RO,a1), p2=pol(RI,a1), p3=pol(RI,a0);
    return 'M'+p0[0].toFixed(1)+','+p0[1].toFixed(1)+
           ' A'+RO+','+RO+' 0 0 1 '+p1[0].toFixed(1)+','+p1[1].toFixed(1)+
           ' L'+p2[0].toFixed(1)+','+p2[1].toFixed(1)+
           ' A'+RI+','+RI+' 0 0 0 '+p3[0].toFixed(1)+','+p3[1].toFixed(1)+' Z';
  }
  var v=Math.max(0,Math.min(100,pct||0)), ang=180-v*1.8;
  var n=pol(RO-34,ang), b1=pol(18,ang-90), b2=pol(18,ang+90);
  var segs=''; for(var i=0;i<5;i++) segs+='<path d="'+arc(i)+'" fill="'+cols[i]+'"/>';
  return '<svg class="gauge" viewBox="0 0 640 372" role="img" '+
      'aria-label="Financial awareness '+v+' per cent">'+segs+
    '<path d="M'+b1[0].toFixed(1)+','+b1[1].toFixed(1)+
      ' L'+n[0].toFixed(1)+','+n[1].toFixed(1)+
      ' L'+b2[0].toFixed(1)+','+b2[1].toFixed(1)+'Z" fill="#14274A"/>'+
    '<circle cx="'+CX+'" cy="'+CY+'" r="20" fill="#14274A"/>'+
    '<circle cx="'+CX+'" cy="'+CY+'" r="8" fill="#fff"/>'+
    /* The dial used to carry LOW / MODERATE / HIGH while everything around it
       used the five band names. Two systems on one picture; the words go. */
    '<text x="'+CX+'" y="360" class="gv">'+v+'<tspan class="gvp">%</tspan></text>'+
  '</svg>';
}

/* What the room actually said, in plain numbers. A finding is a scored question
   where the answer most people chose is one of the weaker ones — that is the
   gap worth a company's attention, and it needs no interpreting to be true. */
function findings(R){
  var out=[];
  (R.results||[]).forEach(function(r){
    if(!r.scored || !r.total) return;
    var best=0, bi=0;
    r.counts.forEach(function(n,i){ if(n>best){ best=n; bi=i; } });
    var top=0; (r.scores||[]).forEach(function(v){ if((v||0)>top) top=v||0; });
    var got=(r.scores&&r.scores[bi])||0;
    var share=Math.round(best/r.total*100);
    out.push({ topic:r.topic, q:r.q, lead:r.lead||'', opt:r.options[bi],
               share:share, weak:(top>0 && got<=Math.floor(top/2)), total:r.total });
  });
  var weak=out.filter(function(x){ return x.weak; })
    .sort(function(a,b){ return b.share-a.share; });
  var good=out.filter(function(x){ return !x.weak; })
    .sort(function(a,b){ return b.share-a.share; });
  return { weak:weak.slice(0,4), good:good.slice(0,2) };
}
function findCard(f,kind){
  return '<div class="fcard '+kind+'">'+
    '<span class="ftop">'+esc(f.topic)+'</span>'+
    '<b>'+f.share+'%</b>'+
    '<p class="fopt">&ldquo;'+esc(f.opt)+'&rdquo;</p>'+
    '<p class="fq">'+esc(f.q)+'</p></div>';
}

/* Four numbers an executive can take in at a glance, before any of the detail.
   Nothing new is measured — the strongest figure from each topic, plus the one
   from the intro that matters most. */
/* "I have a clear plan and I follow it" is the only answer that means a plan
   exists. Testing for an option starting with "Yes" broke the day the question
   was reworded, and every room came out at 100% with no plan. */
var HAS_PLAN=/(^\s*yes)|clear plan/i;
function noPlanPct(R){
  var pl=null; (R.intro||[]).forEach(function(r){ if(r.id==='in_plan') pl=r; });
  if(!pl || !pl.total) return null;
  var none=0;
  pl.options.forEach(function(o,i){ if(!HAS_PLAN.test(o)) none+=pl.counts[i]; });
  return Math.round(none/pl.total*100);
}
function tiles(R, sec){
  var out=[], np=noPlanPct(R);
  var tnames=(R.session_topics||[]).map(function(t){ return t.topic; })
               .join(', ').replace(/, ([^,]*)$/, ' and $1').toLowerCase();
  if(np) out.push({ pct:np, lab:'No financial plan',
                    say:'Planning is the clearest gap.' });
  (R.session_topics||[]).forEach(function(t){
    if(t.band==='High') return;            /* nothing for HR to act on */
    var l=(t.lines||[])[0]; if(!l) return;
    out.push({ pct:l.pct, lab:t.topic, say:l.say });
  });
  out=out.slice(0,4);
  if(out.length<2) return '';
  /* red for the worst, amber for the rest — a row of identical numbers tells
     the reader nothing about which one to look at first */
  var rank=out.slice().sort(function(a,b){ return b.pct-a.pct; });
  return sec('What HR should notice first')+
    '<div class="tiles">'+out.map(function(x){
      return '<div class="tile r'+(rank.indexOf(x)+1)+'">'+
        '<b>'+x.pct+'<em>%</em></b>'+
        '<span>'+esc(x.lab)+'</span>'+
        '<s>'+esc(x.say)+'</s></div>';
    }).join('')+'</div>'+
    /* The old line recommended work on protection and long-term planning in a
       session that measured neither. It now names what was actually asked. */
    '<p class="hrint"><span>HR interpretation</span>'+
      'The priority is not more information alone. '+
      (tnames ? esc(peopleWord().charAt(0).toUpperCase()+peopleWord().slice(1))+
                ' need practical systems for '+esc(tnames)+'.'
              : esc(peopleWord().charAt(0).toUpperCase()+peopleWord().slice(1))+
                ' need practical systems, not more information.')+
      ' The recommended next steps are set out with the findings below.</p>';
}

/* The company already knows its own age spread. What it does not know is
   whether those people have anything behind them — so the intro is written out
   as two sentences: who is in the room, and the thing that makes it matter. */
/* ── the planner's own words ────────────────────────────────
   Every line of prose in this report is written by the tool. A line that does
   not fit a particular room can be rewritten on screen and kept with the
   workshop, so two copies exist from then on: the System copy, which is what
   the tool wrote and never changes, and the Revised copy. Only words can be
   changed — every number, bar and percentage stays as collected, so a revised
   report can never disagree with the answers behind it. */
var EDITS={}, SHOWSYS=false, EDITING=false, EDGO=false;
/* While a line is being reworded nothing may redraw the page underneath it,
   not even the automatic refresh. Only the buttons below ask for a redraw. */
function edRender(){ EDGO=true; try { render(true); } finally { EDGO=false; } }
function ed(key, txt){
  txt=String(txt==null?'':txt);
  var t=(!SHOWSYS && EDITS[key]!=null) ? EDITS[key] : txt;
  /* The tool's own wording travels with the line, so a line edited back to
     what it said originally stops counting as an edit. */
  return '<span class="edt'+(EDITS[key]!=null?' edited':'')+'" data-ed="'+key+
    '" data-sys="'+esc(txt)+'">'+esc(t)+'</span>';
}
function hasEdits(){ for(var k in EDITS){ if(EDITS[k]!=null) return true; } return false; }

var AGE_SAY = { 'under 30':'under 30', '30 to 45':'between 30 and 45',
                'over 45':'over 45', '30-40':'in their thirties',
                '40-50':'in their forties', 'over 50':'over 50' };
function aboutEmployees(R){
  var by={}; (R.intro||[]).forEach(function(r){ by[r.id]=r; });
  function win(r){
    if(!r || !r.total) return null;
    var b=-1, i=0;
    r.counts.forEach(function(n,k){ if(n>b){ b=n; i=k; } });
    return { i:i, pct:Math.round(b/r.total*100), opt:String(r.options[i]||'') };
  }
  var age=win(by.in_age), mar=win(by.in_marital), kid=win(by.in_kids);
  if(!age && !mar && !kid && !by.in_plan) return '';

  var who=[];
  if(age) who.push(AGE_SAY[age.opt.toLowerCase()] || age.opt.toLowerCase());
  if(mar) who.push(/married/i.test(mar.opt) ? 'married'
                 : /separated/i.test(mar.opt) ? 'separated' : 'single');
  var hasKids = kid && /^yes/i.test(kid.opt);
  if(kid) who.push(hasKids ? 'parents' : 'not yet parents');

  /* These are three separate answers, each the largest group in its own
     question. Joined into one sentence they describe a person nobody has shown
     to exist. */
  var W=peopleWord();
  var bits=[];
  if(age) bits.push('most '+W+' are '+(AGE_SAY[age.opt.toLowerCase()]||age.opt.toLowerCase()));
  if(mar) bits.push('the largest group is '+(/married/i.test(mar.opt)?'married'
                  : /separated/i.test(mar.opt)?'separated':'single'));
  /* Stated as a fact about the people who do have children, never as a remark
     about the people who do not. */
  if(by.in_kids && by.in_kids.total){
    var k=by.in_kids, yes=0;
    k.options.forEach(function(o,i){ if(/^yes/i.test(String(o))) yes+=k.counts[i]; });
    var kp=Math.round(yes/k.total*100);
    if(kp) bits.push(kp+'% have children');
  }
  var s1 = bits.length ? bits.join(', ')+'.' : '';
  s1 = s1.charAt(0).toUpperCase()+s1.slice(1);
  if(s1) s1 = ed('prof1', s1);



  /* The line that gives the sentence its point: people with dependants and
     nothing written down. */
  var s2='', pl=by.in_plan;
  if(pl && pl.total){
    var none=0;
    pl.options.forEach(function(o,i){ if(!HAS_PLAN.test(o)) none+=pl.counts[i]; });
    var pct=Math.round(none/pl.total*100);
    if(pct){
      var tail = 'of '+peopleWord()+' have no clear financial plan'
        + (hasKids ? ' \u2014 with a family depending on that income, this is where the risk sits.'
                   : ' \u2014 the earning years are the ones that decide the rest.');
      s2='<b>'+pct+'%</b> '+ed('prof2', tail);
    }
  }
  return (s1||s2) ? '<div class="whoblk">'+
      (s1?'<p class="wholine">'+s1+'</p>':'')+
      (s2?'<p class="whopoint">'+s2+'</p>':'')+
    '</div>' : '';
}

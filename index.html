/* The company's copy. Everything on it is a summary — no charts of scores, no
   question-by-question breakdown. The detail lives in the planner's own panel
   beside it, which does not print. */
function renderReport(){
  if(!ENDPOINT) return setup();
  if(!CODE) return document.getElementById('pcode') ? undefined : gate();
  if(!REPORT){
    app.innerHTML='<div class="aud"><div class="rest"><span class="dot"></span>'+
      '<h2>Building the report</h2><p>One moment.</p></div></div>';
    barMeta.textContent='Report'; return;
  }
  var R=REPORT, aw=R.awareness;
  /* Sections are numbered as they are written, so removing one never leaves a
     gap in the sequence. */
  var sec=SECHEAD;
  var head = META.attended || META.participants || R.responded || '—';

  var introBars = aboutEmployees(R);

  /* ── the topics taught ───────────────────────────────────── */
  var ST=R.session_topics||[];
  var topicBlocks = ST.length ? ST.map(function(t,n){
      return '<div class="tblock">'+
        '<span class="tnum">'+(n+1)+'</span>'+
        '<div class="tbody"><p class="ttop">'+esc(t.topic)+'</p>'+
        '<h3>'+ed('t'+n+'_head', t.theme||t.verdict||'')+'</h3>'+
        (t.theme&&t.verdict?'<p class="tsay">'+ed('t'+n+'_say', t.verdict)+'</p>':'')+
        '<p class="tsig">Key poll signals</p>'+
        '<p class="tnums">'+t.lines.map(function(l,li){
            return '<b>'+l.pct+'%</b> '+ed('t'+n+'_l'+li, l.say); }).join('<br>')+
        '</p></div></div>';
    }).join('') : '';

  /* ── what the room said about the session ────────────────── */
  var F=R.feedback||{lines:[],next:[]};
  var fbBlock='';
  if((F.lines&&F.lines.length)||(F.next&&F.next.length)||F.more!==null){
    /* Two sentences, written the way she would say them out loud, with the
       numbers carried inside rather than listed beside. */
    var L=F.lines||[];
    var helpful = F.useful>=80 ? 'Your employees found the session very helpful.'
                : F.useful>=60 ? 'Your employees found the session helpful.'
                : 'Employees found parts of the session useful.';
    var l1='';
    if(L[0]){
      l1='<b>'+L[0].pct+'%</b> of the employees '+esc(L[0].say)+
         (F.positive && L[0].pct>=50 ? ', which is great' : '')+'.';
      if(L[1]) l1+=' <b>'+L[1].pct+'%</b> '+esc(L[1].say)+'.';
    }
    /* Everything above one in five, and never fewer than three, so the line
       does not read as though only one person changed their mind. */
    var nx=(F.next||[]).map(function(l){
      return '<b>'+l.pct+'%</b> '+esc(l.say); });
    /* One figure carries the section, so it reads as a result rather than a
       footnote. The detail sits beside it. */
    /* Two rows, each led by its own figure, so the second reads with the same
       weight as the first. */
    var actPct = (F.acted && F.actedOf) ? Math.round(F.acted/F.actedOf*100) : null;
    /* 6 — what they will do next, drawn rather than listed */
    function bars(list){
      return '<div class="nbars">'+list.map(function(l){
        /* the phrases are written to follow a percentage; as a label they read
           better as the action itself, and short enough not to wrap */
        var lab=String(l.say).replace(/^will\s+/i,'').replace(/\btheir\s+/i,'');
        lab=lab.charAt(0).toUpperCase()+lab.slice(1);
        /* the track is the whole room, so 28% fills 28% of it. Scaling to the
           longest bar made 28% look like everybody. */
        return '<div class="nbar"><span>'+esc(lab)+'</span>'+
          '<i><u style="width:'+l.pct+'%"></u></i>'+
          '<em>'+l.pct+'%</em></div>'; }).join('')+'</div>';
    }
    function row(num, cap, key, lead, body){
      return '<div class="fbrow'+((num===null||num===undefined)?' nonum':'')+'">'+
        ((num!==null&&num!==undefined)
          ? '<div class="fbnum">'+num+'<em>%</em><s>'+cap+'</s></div>' : '')+
        '<div class="fbtext"><p class="fbk">'+key+'</p>'+
        (lead?'<p class="fblead">'+lead+'</p>':'')+
        '<p class="fbline">'+body+'</p></div></div>';
    }
    /* Three figures across the top, the detail underneath — the section reads
       as a result before it reads as a breakdown. */
    var three=[];
    /* Read in the order the question asks them, so what the session gave
       people comes before what it missed. */
    var LT=L.slice().sort(function(a,b){
      return (a.i==null?9:a.i)-(b.i==null?9:b.i); });
    if(F.useful!==null&&F.useful!==undefined)
      three.push([F.useful,'Learned something or gained clarity',
        (LT[0]?LT[0].pct+'% '+LT[0].say+(LT[1]?'; '+LT[1].pct+'% '+LT[1].say:'')+'.':''),'ok']);
    if(actPct!==null) three.push([actPct,'Intend to take action',
      'A strong signal that the session created momentum.','ok']);
    if(F.more!==null&&F.more!==undefined)
      three.push([F.more,'Want more sessions',
        F.more+'% asked for further sessions.','gold']);
    fbBlock='<div class="fbwrap">'+
      SECHEAD('Did the session land?')+
      (three.length?'<div class="tiles three">'+three.map(function(t){
        return '<div class="tile '+t[3]+'"><b>'+t[0]+'<em>%</em></b>'+
          '<span>'+esc(t[1])+'</span>'+
          (t[2]?'<s>'+esc(t[2])+'</s>':'')+'</div>'; }).join('')+'</div>':'')+
      (nx.length ? SECHEAD('Top actions '+peopleWord()+' intend to take')+
        bars(F.next)+'<p class="fbnote">Top three answers shown.</p>' : '')+
      /* The other half, said plainly and without a heading that announces it. */
      /* One or the other, never both: the observation already describes these
         people, and its figure is drawn from the same answers. */
      /* Everything about that group is said once, in its own section above. */
      /* The percentage who want more sessions is already a tile in this very
         section — saying it again in the closing line is the same fact twice. */
      ((F.closing&&META.company)?'<p class="fbclose">Overall it was '+esc(F.closing)+
        ' initiative taken by <b>'+esc(META.company)+'</b>, and employees have '+
        'asked for more sessions like it.</p>':'')+
    '</div>';
  }

  /* ── the planner's own panel — never printed ─────────────── */
  var det='<div class="mgrid">'+REPORT_FIELDS.map(metaField).join('')+
    '<button class="b2" id="mSave">Save these details</button></div>';
  var ownIntro=(R.intro||[]).length
    ? '<div class="owngrid">'+(R.intro||[]).map(function(r){
        var best=Math.max.apply(null,r.counts);
        return '<div class="qb"><div class="qbh"><h3>'+esc(r.q)+'</h3>'+
          '<span class="tag">'+r.total+' answered</span></div>'+
          '<div class="qbars">'+r.options.map(function(o,i){
            var pct=r.total?Math.round(r.counts[i]/r.total*100):0;
            return '<div class="qbar'+((r.total&&r.counts[i]===best)?' top':'')+'">'+
              '<span class="on">'+esc(o)+'</span><span class="op">'+pct+'%</span>'+
              '<i><u style="width:'+pct+'%"></u></i></div>';
          }).join('')+'</div></div>';
      }).join('')+'</div>' : '<p class="hsub">Nothing collected.</p>';
  var ownQs=(R.results||[]).length
    ? '<div class="owngrid">'+R.results.map(function(r){
        var best=Math.max.apply(null,r.counts);
        return '<div class="qb"><div class="qbh"><h3>'+esc(r.q)+'</h3>'+
          '<span class="tag">'+esc(r.topic)+(r.scored?'':' &middot; not scored')+'</span></div>'+
          '<div class="qbars">'+r.options.map(function(o,i){
            var pct=r.total?Math.round(r.counts[i]/r.total*100):0;
            return '<div class="qbar'+((r.total&&r.counts[i]===best)?' top':'')+'">'+
              '<span class="on">'+esc(o)+'</span><span class="op">'+pct+'%</span>'+
              '<i><u style="width:'+pct+'%"></u></i></div>';
          }).join('')+'</div>'+
          '<p class="qbn">'+r.total+' answered'+
            (r.scored&&r.pct!=null?' &middot; '+r.pct+'% of the points available':'')+'</p></div>';
      }).join('')+'</div>' : '<p class="hsub">Nothing collected.</p>';

  app.innerHTML =
    '<div class="repwrap">'+
      '<div class="reptools noprint">'+
        '<div class="row">'+
          (EDITING
            ? '<button class="b2" id="repEdSave">Save the revised copy</button>'+
              '<button class="b2 ghost" id="repEdCancel">Cancel</button>'+
              '<span class="edhint">Click any underlined line and type over it. '+
              'Numbers and bars cannot be changed.</span>'
            : '<button class="b2" id="repPrint">Save as PDF</button>'+
              '<button class="b2 ghost" id="repEdit">Edit the words</button>'+
              (hasEdits()
                ? '<button class="b2 ghost'+(SHOWSYS?'':' open')+'" id="repSys">'+
                    (SHOWSYS?'Show the revised copy':'Show the system copy')+'</button>'+
                  '<button class="b2 ghost" id="repEdClear">Undo all my edits</button>'
                : '')+
              '<button class="b2 ghost" id="repBack">Back to the poll</button>')+
          '<button class="b2 ghost" id="tgDet">Workshop details</button>'+
          '<button class="b2 ghost" id="tgOwn">Who was in the room</button>'+
          '<button class="b2 ghost" id="tgAll">Every question</button>'+
          '<button class="b2 ghost" id="tgHow">How this works</button>'+
          (R.savedAt&&!EDITING?'<span class="savedtag">Saved automatically &middot; '+
            esc(clockOf(R.savedAt))+'</span>':'')+
          (hasEdits()&&!EDITING?'<span class="copytag">'+
            (SHOWSYS?'System copy':'Revised copy')+'</span>':'')+
        '</div>'+
        '<div class="fold hide" id="foldDet">'+det+'</div>'+
        '<div class="fold hide" id="foldOwn">'+
          '<p class="ownnote">Yours only &mdash; income is never shown to the company, '+
          'and none of this prints.</p>'+knewCard(R)+ownIntro+'</div>'+
        '<div class="fold hide" id="foldAll">'+ownQs+'</div>'+
        '<div class="fold hide" id="foldHow">'+howItWorks()+'</div>'+
      '</div>'+

      '<div class="doc'+(EDITING?' editing':'')+'" id="repDoc">'+
        '<div class="dtop">'+
          '<div class="dlogo"><img src="'+LOGO+'" alt="Jugnu — See Beyond"></div>'+
          '<div class="dtitle"><h1>Employee Financial Wellness<br>Snapshot</h1>'+
            '<p>Prepared for '+esc(META.company||'—')+'</p></div>'+
          '<div class="dpl"><div class="k">PLANNER</div>'+
            '<div class="v">'+esc(PLANNER.name)+'</div></div>'+
        '</div>'+

        '<div class="facts f4">'+
          '<div><span>Date</span><b>'+esc(fmtDate(META.date)||'—')+'</b></div>'+
          '<div><span>Place</span><b>'+esc(META.place||'—')+'</b></div>'+
          '<div><span>Duration</span><b>'+esc(META.duration||'—')+'</b></div>'+
          '<div><span>Total attendees</span><b>'+esc(head)+'</b></div>'+
        '</div>'+

        (introBars?sec('Employee profile')+introBars:'')+

        (aw===null
          ? '<p class="nodata">No scored questions were answered, so an awareness '+
            'level cannot be worked out.</p>'
          : sec('Financial Preparedness (Based on topics discussed)')+
            '<div class="gwrap">'+
              '<div class="gleft">'+gaugeSVG(aw)+'</div>'+
              '<div class="gright">'+
                '<p class="gwhat">The average person</p>'+
                '<div class="bandbig">'+esc(R.band)+'</div>'+
                '<p class="bandnote">'+ed('bandnote', bandNote(R.band))+'</p>'+
              '</div>'+
              spreadBar(R)+
              splitLine(R)+
              topicBars(R)+
              '<p class="bandwho">This measures how much planning is in place '+
                '&mdash; not intelligence, and not income.'+
                missedLine(R)+'</p>'+
            '</div>')+

        '<div class="pbreak"></div>'+tiles(R, sec)+

        (topicBlocks?sec('Financial knowledge and actions')+
          '<p class="tlead">'+ST.length+' topic'+(ST.length===1?' was':'s were')+
            ' covered. A brief synopsis of the responses received on each.</p>'+
          '<div class="tblocks">'+topicBlocks+'</div>'+nextSteps(R):'')+

        observation(R, (R.feedback||{}).nothing)+

        fbBlock+

        '<div class="bio'+(PLANNER.photo?'':' nopic')+'">'+
          '<div class="biotext">'+
            '<p class="biohi">About the presenter</p>'+
            '<p>'+esc(PLANNER.bio)+'</p>'+
            (PLANNER.quote?'<p class="bioquote">&ldquo;'+esc(PLANNER.quote)+'&rdquo;</p>':'')+
          '</div>'+
          (PLANNER.photo?'<div class="biopic"><img src="'+PLANNER.photo+'" alt=""></div>':'')+
        '</div>'+

        '<p class="method"><b>Disclaimer:</b> This session was held to create '+
          'financial awareness, and no product or service was promoted. '+
          /* Answers are stored per device so each person can be scored — that
             is what the dial and every bar rest on. Saying nothing was recorded
             was not true; saying nobody is identified is. */
          'Responses were collected anonymously and are reported only in '+
          'aggregate &mdash; no individual is identified.</p>'+

        '<div class="dend">jugnu &nbsp;&mdash;&nbsp; <span>SEE BEYOND</span></div>'+
      '</div>'+
    '</div>';

  numberSections();
  barMeta.textContent='Report';
  wireMetaFields();
  on('mSave',saveMeta);
  /* The browser names the PDF after the page, so the page is renamed for the
     moment it prints and put back straight after. */
  on('repPrint',function(){
    var was=document.title;
    var yr=(String(META.date||'').slice(0,4))||String(new Date().getFullYear());
    document.title=[ (META.company||'Workshop'),
                     (META.title||'Session')+' Snapshot', yr ].join('_');
    window.print();
    setTimeout(function(){ document.title=was; },800);
  });
  on('repBack',function(){ STAGE='run'; location.hash='#present'; });

  /* ---- editing the words ---- */
  if(EDITING){
    [].forEach.call(app.querySelectorAll('.edt'),function(el){
      el.setAttribute('contenteditable','true');
      el.setAttribute('spellcheck','true');
    });
    var first=app.querySelector('.edt'); if(first) first.focus();
  }
  on('repEdit',function(){ EDITING=true; SHOWSYS=false; edRender(); });
  on('repEdCancel',function(){ EDITING=false; edRender(); });
  on('repSys',function(){ SHOWSYS=!SHOWSYS; edRender(); });
  on('repEdClear',function(){
    if(!confirm('Remove every change you made and go back to what the tool wrote?')) return;
    EDITS={}; SHOWSYS=false; saveEdits();
  });
  on('repEdSave',function(){
    [].forEach.call(app.querySelectorAll('.edt'),function(el){
      var key=el.getAttribute('data-ed');
      var sys=el.getAttribute('data-sys')||'';
      var txt=String(el.innerText||'').replace(/\s+/g,' ').trim();
      if(!txt || txt===sys.replace(/\s+/g,' ').trim()) delete EDITS[key];
      else EDITS[key]=txt;
    });
    EDITING=false; SHOWSYS=false; saveEdits();
  });
  [['tgDet','foldDet'],['tgOwn','foldOwn'],['tgAll','foldAll'],
   ['tgHow','foldHow']].forEach(function(pair){
    on(pair[0],function(){
      var f=document.getElementById(pair[1]); if(!f) return;
      f.classList.toggle('hide');
      var b=document.getElementById(pair[0]);
      if(b) b.classList.toggle('open', !f.classList.contains('hide'));
    });
  });
}

function render(force){
  var sig=signature();
  if(EDITING && !EDGO) return;
  if(!force){
    if(EDIT!==null) return;        // an open editor must not be swept away
    if(EDITING) return;            // nor a report being reworded
    if(sig===LASTSIG) return;      // nothing changed
    if(typing()) return;           // someone is mid-word
  }
  LASTSIG=sig;
  versionCheck();
  MODE==='rep' ? renderReport() : MODE==='pres' ? renderPresenter() : renderAudience();
}

var qrDone='';
function drawQR(){
  var host=document.getElementById('qr');
  if(!host || typeof QRCode==='undefined') return;
  var u=audienceURL(); if(qrDone===u && host.childElementCount) return;
  host.innerHTML=''; qrDone=u;
  try{ new QRCode(host,{text:u,width:132,height:132,colorDark:'#14274A',colorLight:'#ffffff'}); }catch(e){}
}

/* ---- start ---- */
try{ CODE=sessionStorage.getItem('jugnu.poll.code')||''; }catch(e){}
if(!ENDPOINT){ setup(); }
else{
  render(); refresh(); if(MODE==='rep' && CODE) loadReport();
  /* the presenter needs it snappy; 150 phones must not all knock at once */
  var base = MODE==='pres' ? 2500 : 3000;
  setInterval(function(){
    if(document.hidden) return;
    refresh();
  }, base + Math.round(Math.random()*(MODE==='pres'?400:1500)));
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) refresh(); });
  /* Typing #present into the address bar does not reload the page, so the mode
     has to be re-read when the hash changes — otherwise the presenter is left
     looking at the audience view and thinks nothing happened. */
  window.addEventListener('hashchange',function(){
    var want = modeFor(location.hash+location.search);
    if(want!==MODE){ MODE=want; EDIT=null; if(want==='rep'){ REPORT=null; loadReport(); }
      render(true); refresh(); }
  });
}
})();
</script>
</body>
</html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#14274A; --teal:#0B6F5C; --teal-lit:#22A88F; --gold:#9C7222; --amber:#E8A81C;
  --paper:#EDF1F6; --card:#FFFFFF; --sunk:#E3E9F1;
  --ink:#14274A; --ink-2:#3A4E66; --mute:#66788E; --faint:#93A4B8;
  --rule:#D8DFE9; --rule-2:#EAEFF5;
  /* The stage is what gets screen-shared, so it stays white in both themes —
     a dark block projected into a lit meeting room is hard to read. */
  --stage:#FFFFFF; --stage-ink:#14274A; --stage-mute:#66788E; --stage-rule:#DBE1E9;
  --stage-soft:#EDF1F6;
  --f-d:'Sora',system-ui,sans-serif;
  --f-b:'IBM Plex Sans',system-ui,sans-serif;
  --f-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0A1320; --card:#111E2E; --sunk:#0D1926;
  --ink:#E8EFF6; --ink-2:#C3D3E2; --mute:#8DA2B8; --faint:#6A7E95;
  --rule:#22334A; --rule-2:#18273A; --teal:#22A88F; --gold:#C79235;
}}
:root[data-theme="dark"]{
  --paper:#0A1320; --card:#111E2E; --sunk:#0D1926;
  --ink:#E8EFF6; --ink-2:#C3D3E2; --mute:#8DA2B8; --faint:#6A7E95;
  --rule:#22334A; --rule-2:#18273A; --teal:#22A88F; --gold:#C79235;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* the house header: logo left, what this is in the middle, planner right */
.bar{background:var(--navy);color:#fff;padding:13px 20px 15px}
.bwrap{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:150px 1fr 150px;
  align-items:center;gap:16px}
.blogo img{width:96px;height:auto;display:block}
.btitle{text-align:center;min-width:0}
.btitle h1{font-family:var(--f-d);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;
  text-wrap:balance}
.bpl{text-align:right}
.bpl .k{font-family:var(--f-m);font-size:9px;letter-spacing:.16em;color:#8FA9C2}
.bpl .v{font-family:var(--f-d);font-weight:700;font-size:13px;color:#E0B65C;margin-top:2px}
.barmeta{font-family:var(--f-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#9DB3CC;margin:5px 0 0;line-height:1.5}
@media(max-width:700px){
  .bwrap{grid-template-columns:1fr auto;gap:10px 12px}
  .btitle{grid-column:1/-1;order:3;text-align:left}
  .btitle h1{font-size:17px}
  .blogo img{width:78px}
  .bpl .v{font-size:12px}
}
.lab{font-family:var(--f-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

.aud{max-width:520px;margin:0 auto;padding:22px 16px 60px}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px 20px}
.qn{font-family:var(--f-m);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal);margin:0 0 10px}
.qtext{font-family:var(--f-d);font-weight:700;font-size:23px;line-height:1.3;margin:0 0 18px;
  text-wrap:balance;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1.5px solid var(--rule);border-radius:11px;padding:15px 16px;
  font-size:15.5px;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--mute)}
.opt .key{flex:0 0 24px;height:24px;border-radius:6px;background:var(--sunk);color:var(--mute);
  font-family:var(--f-m);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.opt.on{border-color:var(--teal);background:rgba(11,111,92,.09);font-weight:600}
.opt.on .key{background:var(--teal);color:#fff}
.opt:disabled{opacity:.55;cursor:default}
.aud .note{margin:16px 0 0;font-size:13px;color:var(--mute);line-height:1.6;text-align:center}
.rest{text-align:center;padding:44px 20px}
.rest h2{font-family:var(--f-d);font-weight:700;font-size:21px;margin:14px 0 6px}
.rest p{margin:0;font-size:14px;color:var(--mute);line-height:1.6}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);display:inline-block;
  animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

.res{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.rrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline}
.rname{font-size:14.5px;color:var(--ink-2)}
.rpct{font-family:var(--f-m);font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.rtrack{grid-column:1/-1;height:13px;border-radius:99px;background:var(--sunk);overflow:hidden}
.rfill{display:block;height:100%;border-radius:99px;background:var(--teal);
  transition:width .45s cubic-bezier(.22,.8,.3,1)}
.rrow.top .rfill{background:var(--amber)}
.rrow.top .rpct{color:var(--gold)}

.pres{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 52px)}
@media(max-width:900px){.pres{grid-template-columns:1fr}}
.side{border-right:1px solid var(--rule);background:var(--card);padding:16px;
  display:flex;flex-direction:column;gap:14px}
.qlist{display:flex;flex-direction:column;gap:6px}
.qbtn{display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start;text-align:left;
  background:none;border:1px solid transparent;border-radius:9px;padding:9px 10px;cursor:pointer;
  color:var(--ink-2);font-size:13px;line-height:1.4}
.qbtn:hover{background:var(--rule-2)}
.qbtn.on{background:var(--sunk);border-color:var(--rule);color:var(--ink);font-weight:600}
.qbtn i{font-style:normal;font-family:var(--f-m);font-size:10.5px;color:var(--faint);padding-top:2px}
.qbtn.on i{color:var(--teal)}
/* in today's pipeline — visible down the whole list without opening anything */
.qbtn.pipe{background:#EEF7F4;border-color:#BCDDD3;color:#0B6F5C}
.qbtn.pipe i{color:#0B6F5C}
.qbtn.pipe.on{background:#0B6F5C;border-color:#0B6F5C;color:#fff}
.qbtn.pipe.on i,.qbtn.pipe.on .ns{color:#BCDDD3}
.mini{background:none;border:1px dashed var(--rule);border-radius:8px;padding:8px;width:100%;
  font-size:12.5px;color:var(--mute);cursor:pointer}
.mini:hover{border-color:var(--teal);color:var(--teal)}

.stage{background:var(--stage);color:var(--stage-ink);border-left:1px solid var(--rule);padding:26px 30px 30px;
  display:flex;flex-direction:column;gap:0}
/* Each part gets its own room: controls, a line, then the question. */
.stage .ctrl.top{margin:20px 0;padding-bottom:20px;border-bottom:1px solid #D8DFE9}
.stage .meta{margin-bottom:26px}
.stage .slead{margin-bottom:10px}
.stage .sq{margin-bottom:20px}
.stage .prev,.stage .sres,.stage .igrid,.stage .blk{margin-bottom:18px}
.stagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  border-bottom:1px solid var(--stage-rule);padding-bottom:14px}
.stagehead .lab{color:var(--stage-mute)}
.headright{display:flex;align-items:flex-start;gap:34px;text-align:right}
.clock{font-family:var(--f-m);font-size:30px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--stage-mute)}
.count{font-family:var(--f-m);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.count small{font-size:12px;font-weight:400;color:var(--stage-mute);margin-left:7px}
.sq{font-family:var(--f-d);font-weight:700;font-size:clamp(22px,2.4vw,29px);line-height:1.22;margin:0;
  letter-spacing:-.02em;text-wrap:balance}
.sres{display:flex;flex-direction:column;gap:14px;margin-top:2px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;align-items:baseline}
.sname{font-size:clamp(15px,1.5vw,19px)}
.sn{font-family:var(--f-m);font-size:14px;color:var(--stage-mute);font-variant-numeric:tabular-nums}
.spct{font-family:var(--f-m);font-size:clamp(17px,1.9vw,22px);font-weight:600;
  font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.strack{grid-column:1/-1;height:20px;border-radius:99px;background:var(--stage-soft);overflow:hidden}
.sfill{display:block;height:100%;border-radius:99px;background:#0B6F5C;
  transition:width .5s cubic-bezier(.22,.8,.3,1)}
.srow.top .sfill{background:#E8A81C}
.srow.top .spct{color:#9C7222}
.hidden-note{font-family:var(--f-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--stage-mute)}
.ctrl{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto;padding-top:18px;border-top:1px solid var(--stage-rule)}
.b{border:1px solid var(--stage-rule);background:var(--stage-soft);color:var(--stage-ink);
  border-radius:9px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .12s}
.b:hover{background:#E1E8F1}
.b.go{background:#0B6F5C;border-color:#0B6F5C;color:#fff}
.b.go:hover{background:#0A5F50}
.b.warn{color:#C0392B}
.b:disabled{opacity:.4;cursor:not-allowed}

.join{background:var(--sunk);border:1px solid var(--rule);border-radius:11px;padding:13px}
.join .url{font-family:var(--f-m);font-size:11px;word-break:break-all;color:var(--ink-2);margin:7px 0 0;line-height:1.5}
#qr{margin-top:11px;display:flex;justify-content:center}
#qr img,#qr canvas{border-radius:6px;display:block}

.gate{max-width:380px;margin:70px auto;padding:0 18px;text-align:center}
.gate h2{font-family:var(--f-d);font-weight:700;font-size:22px;margin:0 0 6px}
.gate p{margin:0 0 18px;font-size:13.5px;color:var(--mute);line-height:1.6}
/* A real password field makes the browser offer to save it, and the popup lands
   on top of the box mid-typing. This is not a login, so it is a plain field that
   hides what is typed instead. */
.mask{-webkit-text-security:disc;text-security:disc;letter-spacing:.12em;}
input[type=text],input[type=password],textarea{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-family:var(--f-b);font-size:14.5px}
textarea{resize:vertical;line-height:1.5}
.b2{width:100%;margin-top:10px;background:var(--teal);border:none;color:#fff;border-radius:9px;
  padding:12px;font-size:14.5px;font-weight:600;cursor:pointer}
.ed{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:14px;
  display:flex;flex-direction:column;gap:9px}
.ed .row{display:flex;gap:8px}
.ed .row .b2{margin-top:0}
.b2.ghost{background:none;border:1px solid var(--rule);color:var(--mute)}
.err{color:#C0392B;font-size:13px;margin:9px 0 0}
.foot{text-align:center;font-family:var(--f-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:22px 16px 30px}

/* ── topic chips ─────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);background:var(--card);color:var(--ink-2);border-radius:99px;
  padding:4px 9px;font-family:var(--f-b);font-size:11.5px;cursor:pointer;line-height:1.5}
.chip i{font-style:normal;font-family:var(--f-m);font-size:10px;color:var(--faint)}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.chip.on i{color:#9DB3CC}
.qbtn .ns{display:block;font-weight:400;font-family:var(--f-m);font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.chk input{margin-top:2px}
.ed select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-family:var(--f-b);font-size:14px}

/* ── report ──────────────────────────────────────────────────── */
.repwrap{max-width:1120px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px}
.reptools{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:14px}
/* A fixed three-column grid, with every box bottom-aligned in its row — an
   auto-fitting grid put the date a line lower than the place beside it. */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.mgrid label{display:flex;flex-direction:column;gap:5px;min-width:0}
.mgrid .lab{line-height:1.4}
/* one height for every box, so the tops line up across the row whatever the
   browser does with a date or a select */
.mgrid input,.mgrid select{width:100%;height:44px;padding-top:0;padding-bottom:0}

@media(max-width:720px){ .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(max-width:460px){ .mgrid{grid-template-columns:1fr} }
.mgrid .b2{margin-top:0;grid-column:1 / -1}
.past{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:5px}
/* Two lines: company and workshop name up top, then when and where. The
   awareness figure keeps its own column on the right of both. */
.pastrow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:
  "co name pct" "when when pct";
  column-gap:9px;row-gap:2px;align-items:baseline;text-align:left;
  background:none;border:1px solid var(--rule-2);border-radius:9px;padding:9px 11px;
  cursor:pointer;color:var(--ink-2)}
/* the cross sits outside the row's own button — a button inside a button is
   not something a browser will honour */
.pastwrap{display:grid;grid-template-columns:1fr auto;gap:4px;align-items:stretch}
.pastdel{border:1px solid transparent;background:none;border-radius:8px;width:34px;
  font-size:19px;line-height:1;color:var(--faint);cursor:pointer}
.pastdel:hover{background:#FDF2F1;border-color:#EBC9C6;color:#B5341F}
.pastrow:hover{background:var(--rule-2);border-color:var(--rule)}
.pastrow b{grid-area:co;font-size:13.5px;color:var(--ink);white-space:nowrap}
.pastrow em{grid-area:name;font-style:normal;font-size:12.5px;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastrow span{grid-area:when;font-size:11.5px;color:var(--mute)}
.pastrow i{grid-area:pct;align-self:center;font-style:normal;font-family:var(--f-m);
  font-size:16px;font-weight:600;color:var(--teal);white-space:nowrap;text-align:right}
/* The figure needs its name beside it — 56% on its own says nothing. */
.pastrow i u{display:block;text-decoration:none;font-family:var(--f-m);font-size:9px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600}

.doc{background:#fff;color:#14274A;border:1px solid var(--rule);border-radius:12px;
  padding:0 24px;overflow:hidden}
/* The mark is white artwork, so it needs the navy behind it — the same band the
   plan tool's report opens with. */
.doc .dtop{display:grid;grid-template-columns:104px 1fr 132px;align-items:center;gap:14px;
  background:#14274A;margin:0 -24px;padding:13px 24px}
.dlogo img{width:96px;height:auto;display:block}
.dtitle{text-align:center}
/* Two deliberate lines rather than one long one — it centres better against
   the mark on the left and the name on the right. */
.dtitle h1{font-family:var(--f-d);font-weight:800;font-size:21px;margin:0;
  line-height:1.16;letter-spacing:-.015em;color:#fff}
.dtitle p{margin:4px 0 0;font-size:12px;color:#A9C2DA}
.dpl{text-align:right}
.dpl .k{font-family:var(--f-m);font-size:8.5px;letter-spacing:.16em;color:#8FA9C2}
.dpl .v{font-family:var(--f-d);font-weight:700;font-size:12px;color:#E0B65C;margin-top:2px;
  white-space:nowrap}

.facts{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#DBE1E9;
  border:1px solid #DBE1E9;margin:14px 0 0}
.facts div{background:#fff;padding:7px 10px}
.facts span{display:block;font-family:var(--f-m);font-size:8.5px;letter-spacing:.13em;
  text-transform:uppercase;color:#95A5B8}
.facts b{display:block;font-size:14px;margin-top:3px;color:#14274A}

/* the folding panels beside the report — the planner's own workbench */
/* the toolbar is a row of small buttons, not the full-width stack .b2 is
   everywhere else */
.reptools .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.reptools .row .b2{width:auto;margin-top:0;padding:9px 14px;font-size:13.5px}
.fold{border-top:1px solid var(--rule);padding-top:14px;margin-top:2px}
.fold.hide{display:none}
.b2.ghost.open{background:var(--navy);border-color:var(--navy);color:#fff}
.ownnote{margin:0 0 10px;font-size:11.5px;color:var(--mute)}
.owngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}

/* four boxes, one row, always */
.facts.f4{grid-template-columns:repeat(4,1fr)}

/* Section label inside the document. It was grey on white and disappeared —
   now it is navy, heavier, and sits on its own rule. */
.lab2{font-family:var(--f-d);font-weight:700;font-size:17px;letter-spacing:-.005em;
  text-transform:none;color:#14274A;margin:34px 0 20px;padding-bottom:9px;
  border-bottom:2px solid #14274A}
/* the number belongs to the title, so it is the same colour as the title */
.lab2 i{font-style:normal;color:#14274A;margin-right:8px;font-variant-numeric:tabular-nums}
.tlead{margin:0 0 9px;font-size:12px;line-height:1.6;color:#4A5E76}

/* who was in the room */
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
.wcard{border:1px solid #DBE1E9;border-radius:9px;padding:11px 13px;break-inside:avoid}
.wcard h4{font-family:var(--f-d);font-weight:700;font-size:11.5px;margin:0 0 7px;
  line-height:1.3;color:#14274A}
.wbar{display:grid;grid-template-columns:1fr auto;gap:1px 8px;align-items:baseline;margin-bottom:4px}
.wbar span{font-size:10.5px;color:#3A4E66}
.wbar em{font-style:normal;font-family:var(--f-m);font-size:10.5px;font-weight:600;color:#14274A}
.wbar i{grid-column:1/-1;display:block;height:5px;border-radius:99px;background:#EDF1F6;overflow:hidden}
.wbar u{display:block;height:100%;background:#9FB4CC;border-radius:99px}
.wbar.top u{background:#14274A}

/* The row an executive reads first. */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tiles{gap:13px}
.tile{border:1px solid #DBE1E9;border-radius:12px;padding:18px 18px 20px;break-inside:avoid}
.tile b{display:block;font-family:var(--f-d);font-weight:800;font-size:38px;
  line-height:1;color:#14274A;letter-spacing:-.02em}
.tile b em{font-style:normal;font-size:22px;margin-left:1px}
.tile span{display:block;margin-top:11px;font-family:var(--f-b);font-weight:700;
  font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:#14274A}
.tile s{display:block;margin-top:8px;text-decoration:none;font-size:11.5px;
  line-height:1.55;color:#7C8DA4}
/* All four are gaps, so all four are warm — the shade follows the rank, so the
   eye starts at the largest without the colour claiming anything extra. */
.tile.r1 b{color:#D93025} .tile.r2 b{color:#E8710A}
.tile.r3 b{color:#C79A3A} .tile.r4 b{color:#5A6E88}
.tile.ok b{color:#0B6F5C} .tile.gold b{color:#B8862B}

/* the one line HR takes away from the row of figures */
.hrint{margin:16px 0 0;font-family:var(--f-b);font-weight:700;font-size:13.5px;
  line-height:1.6;color:#14274A;background:#FDF6E4;border:1px solid #EBD9A8;
  border-radius:12px;padding:15px 18px;break-inside:avoid}
.hrint span{display:block;font-family:var(--f-m);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:#C79A3A;font-weight:700;margin-bottom:7px}

/* what they will do next, drawn */
.nbars{display:flex;flex-direction:column;gap:22px;padding:8px 6px 4px}
.nbar{display:grid;grid-template-columns:230px minmax(0,1fr) 54px;gap:26px;align-items:center}
.nbar span{font-family:var(--f-b);font-weight:700;font-size:12.5px;color:#14274A;line-height:1.4}
.nbar i{display:block;height:17px;border-radius:99px;background:#EEF3F8;overflow:hidden}
.nbar u{display:block;height:100%;background:#0B6F5C;border-radius:99px;text-decoration:none}
.nbar em{font-style:normal;font-family:var(--f-b);font-weight:700;font-size:13px;
  color:#0B6F5C;text-align:right}
.fbrow.nonum{grid-template-columns:1fr;gap:0}

/* About the employees — two sentences, no charts. */
.whoblk{border:1px solid #DBE1E9;border-left:4px solid #14274A;border-radius:10px;
  padding:14px 18px}
.wholine,.wholine2{margin:0;font-family:var(--f-d);font-weight:700;font-size:15px;
  line-height:1.45;color:#14274A}
.wholine2 b{font-family:var(--f-m);font-weight:700;color:#14274A}
.whopoint{margin:6px 0 0;font-size:13px;line-height:1.6;color:#4A5E76}
.whopoint b{font-family:var(--f-m);font-weight:700;color:#B5341F}

/* Where the people sit — one bar, the percentage inside each colour. No key:
   the dial above has already taught the reader what the five colours mean. */
.tbars{grid-column:1/-1;margin-top:20px;border-top:1px solid #DBE1E9;padding-top:16px}
.tbrow{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;margin:0 0 9px}
.tbname{font-size:12.5px;font-weight:600;color:#14274A}
.tbbar{display:flex;height:20px;border-radius:5px;overflow:hidden}
.tbbar i{display:flex;align-items:center;justify-content:center;font-style:normal;
  font-family:var(--f-b);font-weight:700;font-size:10.5px;color:#fff;min-width:0}
.tbbar i.dark{color:#5A4300}
.tbbar i.thin{font-size:8.5px;letter-spacing:-.03em}
.tbkey{display:grid;gap:6px;margin-top:15px;border-top:1px solid #E4E9F0;padding-top:13px}
.tbk{font-size:11px;color:#14274A;display:grid;grid-template-columns:10px 92px 1fr;
  gap:9px;align-items:baseline;font-weight:600}
.tbk u{text-decoration:none;width:9px;height:9px;border-radius:2px;display:inline-block;
  transform:translateY(1px)}
.tbk em{font-style:normal;font-weight:400;color:#6B7C90}
.tnames{font-family:var(--f-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#8496A9;margin:-4px 0 10px}
@media(max-width:640px){ .tbrow{grid-template-columns:1fr;gap:3px} }
.sp{grid-column:1/-1;margin-top:14px;border-top:1px solid #DBE1E9;padding-top:13px}
.sphead{margin:0 0 8px;font-family:var(--f-m);font-weight:600;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:#4A5E76}
.spbar{display:flex;height:44px;border-radius:8px;overflow:hidden}
.spbar i{display:flex;align-items:center;justify-content:center;font-style:normal;
  font-family:var(--f-m);font-weight:600;font-size:14px;color:#fff;min-width:0;overflow:hidden}
/* the amber band is too light to carry white text */
.spbar i.dark{color:#5A4300}
/* a small band still shows its figure, just smaller */
.spbar i.thin{font-size:11px;letter-spacing:-.02em}
/* ---- rewording the report ---- */
.edt{display:inline}
.doc.editing .edt{border-bottom:1px dashed #B98A00;background:#FFFBEF;
  border-radius:3px;padding:0 2px;outline:none;cursor:text}
.doc.editing .edt:focus{background:#FFF3D0;box-shadow:0 0 0 2px rgba(185,138,0,.25)}
.edhint{font-size:12px;color:#6b6b6b;align-self:center;margin-left:4px}
.copytag{font-size:12px;font-weight:600;color:#7a5c00;background:#FFF3D0;
  border-radius:999px;padding:3px 10px;align-self:center}
@media print{ .edt{border:0;background:none;padding:0} }

/* the barometer — dial and meaning side by side, the footnote on its own last
   row so it never wraps into a column */
.gwrap{display:grid;grid-template-columns:280px 1fr;gap:8px 26px;align-items:center;
  background:#F4F7FB;border:1px solid #DBE1E9;border-radius:11px;padding:18px 22px}
.gwrap .bandwho{grid-column:1 / -1;text-align:left;border-top:1px solid #DBE1E9;
  padding-top:8px;margin-top:6px}
.gauge{width:100%;height:auto;display:block}
.gauge .gl{font-family:var(--f-m);font-size:19px;fill:#66788E;letter-spacing:1.5px}
.gauge .gc{text-anchor:middle} .gauge .ge{text-anchor:end}
.gauge .gv{font-family:var(--f-d);font-size:66px;font-weight:800;fill:#14274A;text-anchor:middle}
.gauge .gvp{font-size:34px}
.gwhat{margin:0;font-family:var(--f-m);font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:#8496AC}
/* the three words and where they sit, so the number can be placed */
.bandbig{font-family:var(--f-d);font-weight:800;font-size:32px;line-height:1.08;
  color:#0B6F5C;margin-top:4px}
.bandnote{margin:9px 0 0;font-size:13px;line-height:1.6;color:#3A4E66}
/* the footnote sits under the dial it refers to */
.bandwho{margin:4px 0 0;font-family:var(--f-m);font-size:9.5px;letter-spacing:.04em;
  color:#8496AC;text-align:center}

/* one block per topic taught */
.tblocks{display:flex;flex-direction:column;gap:13px}
.tblock{display:grid;grid-template-columns:28px 1fr;gap:15px;align-items:start;
  border:1px solid #DBE1E9;border-radius:10px;padding:17px 19px;break-inside:avoid}
.tnum{display:block;width:26px;height:26px;border-radius:99px;background:#14274A;color:#fff;
  font-family:var(--f-m);font-size:12px;font-weight:700;text-align:center;line-height:26px}
/* The topic name above each finding — it was almost invisible in grey. */
.ttop{margin:0;font-family:var(--f-m);font-weight:700;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:#0B6F5C}
.tbody h3{font-family:var(--f-d);font-weight:700;font-size:15.5px;margin:4px 0 0;
  line-height:1.4;color:#14274A}
.tsay{margin:6px 0 0;font-size:12.5px;line-height:1.6;color:#4A5E76}
.tsig{margin:13px 0 5px;font-family:var(--f-m);font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#8496AC;font-weight:700}
.tnums{margin:0;font-size:12px;line-height:1.75;color:#4A5E76}
.tnums b{font-family:var(--f-m);font-weight:700;color:#0B6F5C}

/* session feedback — two cards side by side, then the closing line */
.fbwrap{margin-top:4px}
/* One card a row: the figure lives inside it, so the section reads as two
   sentences rather than four boxes. */
.fbrow{display:grid;grid-template-columns:104px 1fr;gap:26px;align-items:center;
  border:1px solid #DBE1E9;border-radius:10px;padding:14px 18px;
  margin-bottom:10px;break-inside:avoid}
.fbnum{font-family:var(--f-d);font-weight:800;font-size:42px;line-height:1;
  color:#0B6F5C;text-align:right}
.fbnum em{font-style:normal;font-size:19px;margin-left:1px}
.fbnum s{display:block;text-decoration:none;font-family:var(--f-m);font-size:9px;
  letter-spacing:.06em;line-height:1.35;color:#8496AC;margin-top:5px;text-align:right}
.fbcard{border:1px solid #DBE1E9;border-radius:10px;padding:13px 15px;break-inside:avoid}
.fbk{display:block;margin:0 0 6px;font-family:var(--f-m);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:#0B6F5C;font-weight:700}
.fblead{margin:0 0 6px;font-family:var(--f-d);font-weight:700;font-size:13px;
  line-height:1.4;color:#14274A}
.fbline{margin:0;font-size:12px;line-height:1.75;color:#4A5E76}
.fbline b{font-family:var(--f-m);font-weight:700;color:#0B6F5C}
/* The observation: a finding, so it carries a little more weight than the
   numbers above it, but it still sits inside the feedback section. */
.obs{margin:0;border:1px solid #DBE1E9;border-radius:12px;padding:18px 20px;
  background:#F7FAFB;break-inside:avoid}
.obsk{margin:0 0 9px;font-family:var(--f-b);font-weight:700;font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;color:#0B6F5C}
.obsl{margin:0;font-size:12.5px;line-height:1.7;color:#5A6E88}
.obsl b{font-family:var(--f-b);font-weight:700;color:#5A6E88}
.obsn{margin:12px 0 0;font-family:var(--f-b);font-weight:700;font-size:12.5px;
  line-height:1.6;color:#14274A}
.obsn b{color:#14274A}

.pbreak{height:0}
@media print{ .pbreak{break-before:page;page-break-before:always}
  /* nothing should be cut in half by a page edge */
  .tblock,.hrint,.gwrap,.whoblk,.tiles,.fbwrap,.aboutbox,.tbars,.sp{
    break-inside:avoid;page-break-inside:avoid} }

/* the library — a reference screen, so it reads as a list rather than a tool */
.ltabs{display:flex;gap:8px;margin:0 0 16px}
.ltab{font-family:var(--f-b);font-size:13px;font-weight:600;padding:7px 15px;border-radius:8px;
  border:1px solid var(--stage-rule);background:#fff;color:var(--stage-mute);cursor:pointer}
.ltab.on{background:var(--teal);border-color:var(--teal);color:#fff}
.qd{border-left:2px solid var(--stage-rule);padding:0 0 0 14px;margin:0 0 20px}
.qd .qdh{font-family:var(--f-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--stage-mute);margin:0 0 5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qd .qdh b{color:var(--teal);font-weight:600}
.qd .chipn{font-family:var(--f-m);font-size:9px;letter-spacing:.08em;padding:2px 7px;border-radius:3px;
  background:#EEF4F1;color:var(--teal);border:1px solid #CDE3DB;text-transform:none}
.qd .chipn.warn{background:#FCF4E4;color:#8A6418;border-color:#E3CE9E}
.qd .qdlead{font-style:italic;color:var(--stage-mute);font-size:13px;margin:0 0 3px}
.qd .qdq{font-family:var(--f-d);font-weight:700;font-size:16px;margin:0 0 9px;line-height:1.3}
.qd .qdo{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr);gap:10px;
  padding:5px 0;border-bottom:1px solid var(--stage-soft);font-size:13.5px;align-items:baseline}
.qd .qdo:last-of-type{border-bottom:0}
.qd .qdo u{text-decoration:none;font-family:var(--f-m);font-size:10.5px;font-weight:600;
  width:21px;height:21px;border-radius:3px;display:flex;align-items:center;justify-content:center}
.qd .qdo i{font-style:italic;color:var(--stage-mute);font-size:12.5px}
.qd .qdo i:before{content:"\2192  ";font-style:normal;color:#B9C6D4}
.qd .qdaft{margin:9px 0 0;font-size:13px;color:var(--stage-ink);
  border-left:2px solid #C79235;padding:2px 0 2px 10px}
.qd .qdaft b{font-family:var(--f-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:#8A6418;display:block;font-weight:500}
.qdrules{background:var(--stage-soft);border-radius:10px;padding:16px 18px;margin:0 0 22px}
.qdrules h4{font-family:var(--f-d);font-size:15px;margin:0 0 10px}
.qdrules div{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:4px 0;font-size:13px}
.qdrules span{font-family:var(--f-m);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--stage-mute)}
@media(max-width:700px){ .qd .qdo{grid-template-columns:24px 1fr}
  .qd .qdo i{grid-column:2} .qdrules div{grid-template-columns:1fr;gap:2px} }

/* ---- the topic page ---- */
.tq .sres{gap:9px}
.tq .sname{font-size:14.5px}
.tq .sn{font-size:12px}
.tq .spct{font-size:14px;color:var(--stage-ink)}
.tq .strack{height:11px}
.pv.na{opacity:.7}
.pv.na b{color:var(--stage-mute)}

.tphead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 2px}
.tphead h1{font-family:var(--f-d);font-weight:700;font-size:26px;margin:0;color:var(--stage-ink)}
.tphead span{font-family:var(--f-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--stage-mute)}
.tpsug{margin:8px 0 0;font-size:13px;color:var(--gold,#8A6418);background:#FCF5E6;
  border:1px solid #E7D3A6;border-radius:8px;padding:8px 12px;display:inline-block}
.tpnote{margin:10px 0 16px;font-size:13.5px;color:var(--stage-mute)}
.tq{background:#fff;border:1px solid var(--stage-rule);border-radius:12px;
  padding:14px 16px;margin:0 0 12px}
.tq.live{border-color:var(--teal);box-shadow:0 0 0 3px #E6F5EF}
.tq.tqdone{background:#F8FAFC}
.tq.out{opacity:.75;background:#F5F7FA}
.tqh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.tqr{font-family:var(--f-m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--stage-mute)}
.tqtag{font-family:var(--f-m);font-size:9px;letter-spacing:.08em;padding:2px 7px;border-radius:3px;
  background:#EEF4F1;color:var(--teal);border:1px solid #CDE3DB}
.tqst{margin-left:auto;font-family:var(--f-m);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 10px;border-radius:20px;white-space:nowrap}
.tqst.live{background:var(--teal);color:#fff}
.tqst.done{background:#E6F5EF;color:var(--teal)}
.tqst.shut{background:#E6F5EF;color:var(--teal)}
.tqst.wait{background:var(--stage-soft);color:var(--stage-mute)}
.tqst.off{background:#EEF1F5;color:var(--stage-mute)}
.tqws{display:flex;flex-direction:column;gap:4px;margin:0 0 7px}
.tqw{font-size:12px;padding:4px 9px;border-radius:6px}
.tqw.hint{background:var(--stage-soft);color:var(--stage-mute)}
.tqw.warn{background:#FCF0E4;color:#8A5A14;border:1px solid #E7CDA6}
.tqlead{font-style:italic;color:var(--stage-mute);font-size:13px;margin:0 0 4px}
.tqq{font-family:var(--f-d);font-weight:700;font-size:19px;line-height:1.3;margin:0 0 11px;
  color:var(--stage-ink)}
.tqaft{margin:10px 0 0;font-size:13px;color:var(--stage-ink);
  border-left:2px solid #C79235;padding:2px 0 2px 10px}
.tqaft b{font-family:var(--f-m);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:#8A6418;display:block;font-weight:500}
.tqf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.tqf .tqsp{flex:1}
.tqn{font-family:var(--f-m);font-size:12px;color:var(--stage-mute)}
.b.warn{border-color:#E7C6C6;color:#A33}
.b.pipein{background:#E6F5EF;border-color:#9AD4C3;color:var(--teal)}
.sfill.s0{background:#E03131}.sfill.s1{background:#F2A81C}.sfill.s2{background:#12B886}
.sfill.na{background:#AEBDCC}
.tpoff{margin-top:26px;border-top:1px dashed var(--stage-rule);padding-top:16px}
.tpoff h3{font-family:var(--f-m);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--stage-mute);margin:0 0 3px;font-weight:600}
.tpoff > p{font-size:12.5px;color:var(--stage-mute);margin:0 0 12px}
.iopts .io.many i{border-radius:5px;font-size:11px}
.iopts .io.many:not(.on) i{color:transparent}
.splitl{grid-column:1/-1;margin:9px 0 0;font-size:11.5px;color:#5E7189}
.fbnote{margin:6px 0 0;font-size:10.5px;color:#8496A9;font-family:var(--f-m)}
.nsteps{border:1px solid #DBE1E9;border-left:4px solid #0B6F5C;border-radius:10px;
  padding:13px 16px;margin:14px 0 0;background:#F7FBFA}
.nshead{font-family:var(--f-m);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:#0B6F5C;font-weight:600;display:block;margin-bottom:7px}
.nsl{margin:0 0 6px;font-size:12.5px;color:#14274A;line-height:1.6}
.nsl:last-child{margin-bottom:0}
.nsl b{color:#0B6F5C}
.nsl em{font-style:normal;color:#6B7C90;font-family:var(--f-m);font-size:11px}
.lbnote{margin:0 0 20px;font-size:12.5px;line-height:1.65;color:var(--stage-mute);
  max-width:760px}
.lbpil{margin-bottom:26px}
.lbpname{margin:0 0 10px;font-family:var(--f-m);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--stage-mute);font-weight:700}
.lbtopic{border:1px solid var(--stage-rule);border-radius:11px;padding:15px 17px;
  margin-bottom:11px;background:#fff}
.lbtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lbtop h4{margin:0;font-family:var(--f-d);font-weight:700;font-size:15px;color:var(--stage-ink)}
.lbtop span{font-family:var(--f-m);font-size:10.5px;color:var(--stage-mute)}
.lbtheme{margin:5px 0 0;font-size:12.5px;line-height:1.5;color:#0B6F5C;font-weight:600}
.lbverd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:11px 0 4px}
.lbverd div{border:1px solid var(--stage-rule);border-radius:8px;padding:8px 10px;
  font-size:11.5px;line-height:1.5;color:var(--stage-ink-2)}
.lbverd span{display:block;font-family:var(--f-m);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--stage-mute);font-weight:700;margin-bottom:4px}
.lbq{border-top:1px solid var(--stage-rule);margin-top:13px;padding-top:12px}
.lbqh{margin:0;font-family:var(--f-d);font-weight:700;font-size:13.5px;
  color:var(--stage-ink);display:flex;justify-content:space-between;gap:12px}
.lbqh em{font-style:normal;font-family:var(--f-m);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--stage-mute);white-space:nowrap;padding-top:3px}
.lblead{margin:4px 0 0;font-size:12px;color:var(--stage-mute);line-height:1.5}
.lbopts{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.lbo{display:grid;grid-template-columns:26px 1fr 1fr;gap:12px;align-items:start;
  font-size:12px;line-height:1.55}
.lbo b{font-family:var(--f-m);font-weight:700;font-size:12px;color:#0B6F5C;text-align:center;
  background:#EEF7F4;border-radius:6px;padding:2px 0}
.lbo span{color:var(--stage-ink-2)}
.lbo i{font-style:normal;color:var(--stage-mute)}
.lbo i.none{color:#B5541F}
.lbo i.na{color:var(--faint);font-style:italic}

/* the storeroom — screen only */
.hw{display:flex;flex-direction:column;gap:16px}
.hwtop{margin:0;font-size:12px;color:var(--mute)}
.hwsec h4{margin:0 0 8px;font-family:var(--f-d);font-weight:700;font-size:14px;
  color:var(--ink);padding-bottom:5px;border-bottom:1px solid var(--rule)}
.hwrow{display:grid;grid-template-columns:190px 1fr;gap:16px;padding:7px 0;
  align-items:start}
.hwrow + .hwrow{border-top:1px solid var(--rule-2)}
.hwrow span{font-family:var(--f-m);font-size:11px;font-weight:600;color:var(--ink);
  line-height:1.5}
.hwrow p{margin:0;font-size:12.5px;line-height:1.65;color:var(--ink-2)}
@media(max-width:640px){ .hwrow{grid-template-columns:1fr;gap:3px} }

/* the planner's own card — screen only */
.knew{border:1px solid var(--rule);border-radius:11px;padding:16px 18px;margin-bottom:14px}
.knew .gh{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:0 0 3px}
.knew .gh h4{margin:0;font-family:var(--f-d);font-weight:700;font-size:15px;color:var(--ink)}
.knew .gh span{font-family:var(--f-m);font-size:11px;color:var(--mute)}
.gsub{margin:0 0 14px;font-size:12px;color:var(--mute)}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kstat{border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.kstat b{display:block;font-family:var(--f-d);font-weight:800;font-size:28px;line-height:1;color:var(--ink)}
.kstat b.low{color:#C0392B} .kstat b.ok{color:var(--teal)}
.kstat b em{font-style:normal;font-size:15px}
.kstat span{display:block;margin-top:6px;font-family:var(--f-m);font-size:9.5px;
  line-height:1.4;color:var(--mute)}
.kbands{display:flex;gap:6px;margin-top:13px}
.kbands div{flex:1;text-align:center;border:1px solid var(--rule);border-radius:8px;padding:8px 4px}
.kbands u{display:block;height:4px;border-radius:2px;margin-bottom:7px;text-decoration:none}
.kbands b{display:block;font-family:var(--f-d);font-weight:800;font-size:19px;color:var(--ink)}
.kbands span{display:block;margin-top:3px;font-family:var(--f-m);font-size:8.5px;color:var(--mute)}
.kverdict{margin:13px 0 0;font-size:13px;line-height:1.6;color:var(--ink-2);
  background:#FDF6EE;border:1px solid #EBD8C2;border-left:4px solid #C79A3A;
  border-radius:9px;padding:11px 14px}
.kverdict b{color:#8A6216}
.thin{margin:0;font-size:12.5px;color:var(--mute);background:var(--rule-2);
  border-radius:9px;padding:11px 14px}
.knote{margin:12px 0 0;font-size:11px;color:var(--mute);line-height:1.6}

/* Said plainly, in its own quiet strip — not hidden, not shouted. */
.fbmiss{margin:0;font-size:12.5px;line-height:1.6;color:#7A5A3A;
  background:#FDF6EE;border:1px solid #EBD8C2;border-radius:9px;padding:10px 14px;
  break-inside:avoid}
.fbmiss b{font-family:var(--f-m);font-weight:700;color:#A9713A}

/* This one line is the company's own credit. It should not look like every
   other box on the page. */
.fbclose{margin:24px 0 0;font-size:13.5px;line-height:1.6;color:#5A4A22;
  background:#FCF3DF;border:1px solid #E3C77E;border-left:4px solid #C79A3A;
  border-radius:10px;padding:12px 15px}
.fbclose b{font-family:var(--f-m);font-weight:700;color:#8A6216}

/* The note at the foot, laid out like her own card: the name in gold on the
   dark ground, the picture beside it when there is one. */
/* Its own card. Text first, face on the right — the reader finishes on the
   words, not the picture. */
.bio{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;
  background:#fff;border:1px solid #DBE1E9;border-radius:11px;padding:17px 20px;
  margin-top:34px;break-inside:avoid;page-break-inside:avoid}
.bio.nopic{grid-template-columns:1fr}
.biopic img{width:104px;height:104px;border-radius:50%;object-fit:cover;
  border:3px solid #C79A3A;display:block}
/* the paragraph rule first, so the named lines below can override it */
.bio p{margin:0;font-size:12px;line-height:1.7;color:#4A5E76}
.bio p.biohi{margin:0 0 5px;font-family:var(--f-d);font-weight:700;font-size:12px;
  color:#14274A}
/* A quiet signature, not a headline. */
.bio p.bioquote{margin:9px 0 0;font-family:var(--f-d);font-style:italic;font-weight:600;
  font-size:13.5px;line-height:1.5;color:#B8862B}

.qwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.qb{border:1px solid #DBE1E9;border-radius:9px;padding:9px 11px;break-inside:avoid}
.qbh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.qbh h3{font-family:var(--f-d);font-weight:700;font-size:13px;margin:0;line-height:1.3;color:#14274A}
.tag{font-family:var(--f-m);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#95A5B8;white-space:nowrap}
.qbars{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.qbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.qbar .on{font-size:11.5px;color:#3A4E66}
.qbar .op{font-family:var(--f-m);font-size:11.5px;font-weight:600;color:#14274A}
.qbar i{grid-column:1/-1;display:block;height:7px;border-radius:99px;background:#EDF1F6;overflow:hidden}
.qbar u{display:block;height:100%;background:#0B6F5C;border-radius:99px}
.qbar.top u{background:#E8A81C}
.qbar.top .op{color:#9C7222}
.qbn{margin:7px 0 0;font-family:var(--f-m);font-size:9.5px;letter-spacing:.06em;color:#95A5B8}
.method{margin:16px 0 14px;font-size:10px;line-height:1.7;color:#66788E;
  background:#F6F8FB;border:1px solid #E4EAF1;border-radius:10px;padding:11px 14px;
  break-inside:avoid;page-break-inside:avoid}
.nodata{margin:14px 0 0;font-size:12.5px;color:#66788E;background:#EDF1F6;padding:12px;border-radius:8px}
.dend{background:#14274A;color:#fff;text-align:center;padding:8px;margin:0 -24px;
  font-family:var(--f-d);font-weight:700;font-size:14px}
.dend span{font-family:var(--f-m);font-weight:600;font-size:8px;letter-spacing:.3em;color:#E8A81C}

@media(max-width:760px){
  .facts{grid-template-columns:repeat(2,1fr)}
  .score{grid-template-columns:1fr;gap:14px}
  .qwrap{grid-template-columns:1fr}
  .doc .dtop{grid-template-columns:1fr;text-align:center;justify-items:center}
  .dpl{text-align:center}
}
@media print{
  /* Side margins live on the document, not the page, so the navy bands can run
     edge to edge instead of floating in a white frame. The first page has no top
     margin either, so the banner starts at the paper edge. */
  @page{size:A4;margin:8mm 0}
  @page:first{margin-top:0}
  /* html kept the app's grey, which showed below the last strip */
  html,body{background:#fff}
  .bar,.reptools,.foot{display:none!important}
  .repwrap{padding:0;max-width:none}
  .doc{border:none;border-radius:0;padding:0 11mm}
  /* An A4 page is narrower than a laptop, so the phone layout above would
     otherwise take over and stack everything down two pages. */
  .doc .dtop{grid-template-columns:104px 1fr 140px;text-align:left;margin:0 -11mm;padding:14px 11mm}
  .dtitle{text-align:center} .dpl{text-align:right}
  .dtitle h1{font-size:16.5pt} .dtitle p{font-size:8.6pt} .dpl .v{font-size:9pt}
  .facts.f4{grid-template-columns:repeat(4,1fr);margin-top:12px}
  .facts span{font-size:6.6pt} .facts b{font-size:11pt}
  /* Sizes only — the page is allowed to run to a second sheet rather than be
     squeezed. A cramped report reads as a cheap one. */
  /* a heading never sits alone at the foot of a page */
  .lab2{font-size:13pt;margin:22px 0 14px;padding-bottom:7px;
    break-after:avoid;page-break-after:avoid}
  .fbwrap,.gwrap,.whoblk{break-inside:avoid;page-break-inside:avoid}
  .tlead{font-size:9pt;margin-bottom:9px}
  .whoblk{padding:10px 14px}
  .wholine,.wholine2{font-size:11pt} .whopoint{font-size:9.2pt}
  .gwrap{grid-template-columns:215px 1fr;gap:20px;padding:14px 18px}
  .gwhat{font-size:6.6pt}
  .bandbig{font-size:24pt}
  .bandnote{font-size:9.6pt;margin-top:7px} .bandwho{font-size:7pt;line-height:1.6}
  .sp{margin-top:10px;padding-top:9px}
  .sphead{font-size:6.4pt;margin-bottom:6px}
  .spbar{height:30px} .spbar i{font-size:10pt} .spbar i.thin{font-size:7.6pt}
  .tblocks{gap:9px}
  .tblock{padding:12px 15px;gap:12px}
  .tbody h3{font-size:11pt;line-height:1.4} .tnums{font-size:8.6pt;line-height:1.7}
  .ttop{font-size:6.8pt}
  .tiles{gap:9px} .tile{padding:13px 13px 15px}
  .tile b{font-size:25pt} .tile b em{font-size:14pt}
  .tile span{font-size:8pt;margin-top:8px} .tile s{font-size:8pt;margin-top:6px}
  .hrint{font-size:9.6pt;padding:12px 15px;margin-top:12px} .hrint span{font-size:6.4pt}
  .tsay{font-size:8.8pt} .tsig{font-size:6pt;margin:9px 0 4px}
  .nbars{gap:17px;padding:6px 4px 2px}
  .nbar{grid-template-columns:185px minmax(0,1fr) 46px;gap:20px}
  .nbar span{font-size:9pt} .nbar em{font-size:9.4pt} .nbar i{height:13px}
  .fbrow{grid-template-columns:80px 1fr;gap:20px;padding:11px 14px;margin-bottom:8px}
  .fbnum{font-size:29pt} .fbnum em{font-size:14pt} .fbnum s{font-size:6.4pt}
  .fbcard{padding:10px 12px}
  .fbbig{padding:10px} .fbnum{font-size:29pt} .fbnum em{font-size:14pt}
  .fbcap{font-size:6.8pt;margin-top:5px}
  .fbk{font-size:6.6pt} .fblead{font-size:9.6pt} .fbline{font-size:9pt}
  .fbclose{font-size:10pt;padding:10px 13px;margin-top:18px}
  .fbmiss{font-size:8.6pt;padding:8px 12px;margin-top:8px}
  .obs{padding:14px 16px}
  .obsk{font-size:8pt;margin-bottom:7px} .obsl{font-size:8.8pt}
  .obsn{font-size:8.8pt;margin-top:9px}
  .bio{margin-top:24px;padding:14px 16px;gap:16px}
  .bio p{font-size:8.6pt} .bio p.biohi{font-size:9pt}
  .bio p.bioquote{font-size:9.6pt;margin-top:7px}
  .biopic img{width:88px;height:88px}
  .method{font-size:7.4pt;margin:12px 0 9px}
  .dend{margin:0 -11mm;padding:9px;font-size:11pt}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ── home screen ─────────────────────────────────────────────── */
.homewrap{max-width:820px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:16px}
/* a workshop nobody ended — gold, because it is a nudge, not a failure */
.oldsess{background:#FFF8E8;border:1px solid #E7CF92;border-radius:12px;padding:17px 19px}
.oldhead{margin:0 0 5px;font-size:15px;font-weight:700;color:#7A5C00}
.oldline{margin:0 0 13px;font-size:13.5px;line-height:1.6;color:#5C4A1A}
.oldbtns{display:flex;gap:10px;flex-wrap:wrap}
.oldbtns .b2{width:auto;flex:0 0 auto;padding-left:22px;padding-right:22px}
@media(max-width:520px){ .oldbtns .b2{width:100%} }
.hcard{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px}
.hcard h2{font-family:var(--f-d);font-weight:700;font-size:18px;margin:0 0 5px}
.hsub{margin:0 0 15px;font-size:13px;color:var(--mute);line-height:1.6}
.hcard .b2.ghost{margin-top:8px}

/* ── a question lined up but not yet asked ───────────────────── */
.prev{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pv{display:flex;align-items:center;gap:12px;border:1px solid var(--stage-rule);
  border-radius:10px;padding:11px 14px;font-size:clamp(14px,1.4vw,17px);color:var(--stage-ink)}
.pv span{flex:0 0 22px;height:22px;border-radius:6px;background:var(--stage-soft);
  font-family:var(--f-m);font-size:11px;display:flex;align-items:center;justify-content:center;
  color:var(--stage-mute)}
.pv b{margin-left:auto;font-family:var(--f-m);font-size:11px;font-weight:600;
  color:#9C7222;white-space:nowrap}
.clock{white-space:nowrap}

/* controls sit above the question so nothing needs scrolling to reach */
.ctrl.top{margin-top:0;padding-top:0;padding-bottom:13px;border-top:none;
  border-bottom:1px solid var(--stage-rule);align-items:center}
.done{margin-left:auto;font-family:var(--f-m);font-size:12px;color:var(--stage-mute);white-space:nowrap}
.done b{color:var(--stage-ink);font-size:15px;margin-left:4px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;
  font-family:var(--f-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--stage-mute);margin:0}
.meta b{color:#9C7222;font-weight:600}
.meta b.ok{color:#0B6F5C}
.meta b.plain{color:var(--stage-ink)}
.qbtn .ns.was{color:var(--teal)}
.mgrid input.hide,.mgrid select.hide{display:none}

/* ── lead-in line ─────────────────────────────────────────────── */
.qcard .lead{font-size:14.5px;color:var(--mute);line-height:1.5;margin:0 0 6px}
.slead{font-size:clamp(16px,1.7vw,19px);color:var(--stage-mute);margin:0 0 -4px;line-height:1.45}

/* ── the intro block, on a phone ──────────────────────────────── */
.hello{font-family:var(--f-d);font-weight:700;font-size:20px;line-height:1.35;margin:0 0 6px;text-wrap:balance}
.priv{margin:0 0 16px;font-size:12.5px;color:var(--mute);line-height:1.5}
.iq{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.iqt{font-weight:600;font-size:14.5px;margin:0 0 8px;line-height:1.35}
.ilead{margin:0 0 3px;font-size:13.5px;color:var(--mute);line-height:1.45}
/* One option per row — wrapped pills made long options break mid-phrase and the
   room could not scan them. */
.iopts{display:flex;flex-direction:column;gap:7px}
.io{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:1.5px solid var(--rule);border-radius:10px;padding:12px 13px;font-size:14.5px;
  color:var(--ink-2);background:var(--card);cursor:pointer;font-family:var(--f-b);line-height:1.35}
.io i{flex:0 0 22px;height:22px;border-radius:6px;background:var(--sunk);color:var(--mute);
  font-style:normal;font-family:var(--f-m);font-size:10.5px;display:flex;align-items:center;justify-content:center}
.io:hover{border-color:var(--mute)}
.io.on{border-color:var(--teal);background:rgba(11,111,92,.09);color:var(--ink);font-weight:600}
.io.on i{background:var(--teal);color:#fff}
.iqt.sub{font-weight:700;font-size:15.5px;margin:0 0 9px}
.isub{width:100%;margin-top:4px;background:var(--teal);border:none;color:#fff;border-radius:10px;
  padding:15px;font-size:15.5px;font-weight:600;cursor:pointer;font-family:var(--f-b)}
.note.warn{color:#C0392B;font-weight:600}
.tickbig{width:46px;height:46px;border-radius:50%;background:var(--green-t,#E2F2EE);color:var(--teal);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 4px}

/* ── the intro panel, on the presenter's screen ───────────────── */
.pres.onecol{grid-template-columns:1fr}
.opt.pending{opacity:.62}
.opt.failed{border-color:#E4B4AE;background:#FDECEA}
.savedtag{font-family:var(--f-m);font-size:11px;letter-spacing:.05em;color:var(--mute);
  align-self:center;margin-left:2px}
/* Pulled out to the stage edges so the two tinted bands run full width, and
   the flex gap below is trimmed back — the rows are navigation, not content. */
.tophead{margin:-26px -30px 0}
/* The dashboard's own row of main topics — only the ones already asked. */
.btabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.btab{border:1px solid #C6D5EA;background:#F1F6FC;border-radius:8px;padding:5px 11px;cursor:pointer;
  font-family:var(--f-b);font-weight:600;font-size:12.5px;color:var(--stage-ink)}
.btab em{font-style:normal;font-family:var(--f-m);font-size:11px;font-weight:600;
  color:var(--stage-mute);margin-left:6px}
.btab:hover{border-color:#9DB6D6}
.btab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btab.on em{color:#B9C9E2}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--stage);padding:12px 30px 11px}
.ptab{border:1px solid #C6D5EA;background:#F1F6FC;border-radius:8px;padding:6px 12px;cursor:pointer;
  font-family:var(--f-b);font-weight:700;font-size:13px;color:#2E4468}
.ptab:hover{border-color:#9BB2D2}
.ptab em{font-style:normal;font-family:var(--f-m);font-size:11px;color:#7C93B4;margin-left:6px;font-weight:400}
/* Gold, taken from the logo: on the plan for today. */
/* holds something in today's pipeline */
.ptab.pipe{border-color:#BCDDD3;background:#EEF7F4;color:#0B6F5C}
.ptab.pipe em{color:#3E9280}
/* Navy: where you are now — it always wins over the gold. */
.ptab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ptab.on em{color:#9DB2CC}
.ptab.pipe.on{background:#0B6F5C;border-color:#0B6F5C}
.ptab.pipe.on em{color:#BCDDD3}
.stabs{display:flex;flex-wrap:wrap;gap:6px;background:#E9F0FA;
  padding:10px 30px 11px;border-top:1px solid #D3E0F0;border-bottom:1px solid #D3E0F0}
.stab{border:1px solid #C6D5EA;background:#fff;border-radius:8px;
  padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:#2E4468}
.stab:hover{border-color:#9BB2D2}
.stab.pipe{border-color:#BCDDD3;background:#EEF7F4;color:#0B6F5C}
.stab.pipe i{color:#3E9280}
.stab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stab.pipe.on{background:#0B6F5C;border-color:#0B6F5C}
.stab.pipe.on i{color:#BCDDD3}
.stab i{font-style:normal;font-family:var(--f-m);font-size:11px;color:#7C93B4;margin-left:6px;font-weight:400}
.stab.on i{color:#9DB2CC}
.chip u{text-decoration:none;font-family:var(--f-m);font-size:10px;color:var(--faint);margin-left:3px}
.chip.on u{color:rgba(255,255,255,.6)}
.pillars{display:grid;gap:3px}
.pil{border-bottom:1px solid var(--rule-2)}
.pilhead{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;
  padding:9px 4px;cursor:pointer;font-family:var(--f-b);font-weight:600;font-size:13px;
  letter-spacing:.02em;color:var(--ink);text-align:left}
.pilhead:hover{color:var(--teal)}
.pilhead .tri{font-style:normal;font-size:10px;color:var(--faint);width:10px}
.pilhead span{flex:1}
.pilhead em{font-family:var(--f-m);font-style:normal;font-size:11px;color:var(--faint)}
.piltopics{display:grid;gap:2px;padding:0 0 8px 18px}
.subt{width:100%;text-align:left;background:none;border:0;border-radius:7px;
  padding:6px 9px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.subt:hover{background:var(--stage-soft)}
.subt i{font-style:normal;font-family:var(--f-m);font-size:11px;color:var(--faint);float:right}
.subt.on{background:var(--navy);color:#fff}
.subt.on i{color:rgba(255,255,255,.65)}
.edtop .done{margin-left:auto;font-family:var(--f-m);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--stage-mute)}
.b.edDel{color:#B5541F;border-color:#E4CFC4;background:#FDF6F3}
.ed3{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;margin-bottom:6px}
.ed3 label{display:block}
.ed3 .lab{display:block;margin:0 0 6px}
.ed3 select{width:100%}
.edchk{display:flex;align-items:center;gap:9px;font-size:13.5px;white-space:nowrap;padding-bottom:10px;
  cursor:pointer}
.edchk input{width:16px;height:16px;accent-color:var(--teal);margin:0;flex:none}
.edin{width:100%;padding:10px 12px;border:1px solid var(--stage-rule);border-radius:9px;
  font-family:inherit;font-size:14px;color:var(--stage-ink);background:var(--stage)}
.edin:focus{outline:none;border-color:var(--teal)}
.edin.big{font-size:19px;font-weight:600;padding:12px}
.orow{display:grid;grid-template-columns:28px 1fr auto auto 30px;gap:9px;align-items:center;margin-bottom:7px}
.okey{width:28px;height:28px;border-radius:7px;background:var(--stage-soft);color:var(--stage-mute);
  font-family:var(--f-m);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
 /* named apart from the audience's .opts list, which this used to collide with */
.ptsbox{display:flex;flex-direction:row;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap}
.edpt{width:52px;padding:9px 6px;text-align:center;border:1px solid var(--stage-rule);
  border-radius:8px;font-family:var(--f-m);font-size:14px;background:var(--stage);color:var(--stage-ink)}
.ptsbox em{font-style:normal;font-family:var(--f-m);font-size:10px;letter-spacing:.08em;color:var(--faint)}
.omove{display:flex;gap:2px}
.oarr{border:1px solid var(--stage-rule);background:var(--stage);border-radius:7px;
  width:26px;height:28px;cursor:pointer;color:var(--stage-mute);font-size:9px;line-height:1}
.oarr:hover:not(:disabled){border-color:var(--stage-mute);color:var(--stage-ink)}
.oarr:disabled{opacity:.3;cursor:default}
.ox{border:1px solid transparent;background:none;color:var(--faint);border-radius:7px;
  padding:6px 8px;cursor:pointer;font-size:12px}
.ox:hover:not(:disabled){color:#B5541F;background:#FDF6F3}
.ox:disabled{opacity:.25;cursor:default}
.addo{border:1px dashed var(--stage-rule);background:none;border-radius:9px;padding:9px 14px;
  cursor:pointer;font-size:13px;color:var(--stage-ink);margin-top:4px;align-self:flex-start}
.addo:hover{border-color:var(--stage-mute)}
.edhint{font-family:var(--f-m);font-size:11px;letter-spacing:.06em;color:var(--faint);margin:16px 0 0}
.planbox{margin:16px 0 18px;padding-top:16px;border-top:1px solid var(--rule)}
.planbox .lab{margin:0 0 4px}
.hsub.tight{margin:0 0 12px;font-size:13px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pick.tight{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:6px}
.pk{display:flex;align-items:center;gap:9px;border:1px solid var(--rule);border-radius:9px;
  padding:9px 12px;background:var(--card);cursor:pointer;text-align:left;color:var(--ink)}
.pk:hover{border-color:var(--mute)}
.pk.sel{border-color:#C79A3A;background:#FCF3DF}
.tick{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--rule);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.pk.sel .tick{background:#B0842C;border-color:#B0842C}
.pk b{font-weight:600;font-size:13.5px;flex:1}
.pk.sel b{color:#73561D}
.pk u{text-decoration:none;font-family:var(--f-m);font-size:11px;color:var(--faint)}
.planfoot{margin:13px 0 0;font-family:var(--f-m);font-size:11px;letter-spacing:.06em;color:var(--faint)}
.planstrip{margin-top:22px;padding-top:16px;border-top:1px solid var(--stage-rule)}
/* One line, sitting in the same row as the buttons — tall enough to read from
   the front of the room, short enough that the row never wraps. */
.clk{display:inline-flex;align-items:center;gap:7px;
  border:2px solid #C6D5EA;background:#F4F8FD;border-radius:9px;padding:4px 11px;
  margin-left:auto;white-space:nowrap}
.clk small{font-family:var(--f-m);font-size:9.5px;letter-spacing:.13em;color:#7C93B4}
.clk b{font-family:var(--f-m);font-size:20px;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;color:var(--stage-ink)}
.clk.warm{border-color:#E0A030;background:#FDF6E9}
.clk.warm small{color:#9C7222}.clk.warm b{color:#8A6216}
.clk.late{border-color:#D9534F;background:#FDF2F1}
.clk.late small{color:#B5541F}.clk.late b{color:#B5341F}
.ctrl.top .done{margin-left:0}
.navpair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px}
.navpair .dashbtn{font-size:13px}
.navsep{height:1px;background:var(--rule);margin:0 0 11px}
.dashbtn.wide{display:flex;align-items:center;justify-content:center;gap:8px}
.dashbtn.wide em{font-style:normal;font-family:var(--f-m);font-size:11px;font-weight:700;
  background:var(--teal);color:#fff;border-radius:99px;padding:1px 7px}
.dashbtn.wide.on em{background:#fff;color:var(--navy)}

/* the right-hand side of the meta row: the running count sits above the status,
   inside the same cell, so the row stays one row */
/* the running count sits at the far end of the button row it lives in */
.ctrl.top .done.end{margin-left:auto}
.meta b.bad{color:#C0392B}
.meta b.off{color:var(--stage-mute)}

/* the pipeline control, sitting under the question it belongs to */
.piprow2{display:flex;align-items:center;gap:10px;margin:-6px 0 16px}
.pipon{border:1px solid var(--stage-rule);background:var(--card);border-radius:9px;
  padding:8px 15px;font-family:var(--f-b);font-weight:600;font-size:13.5px;
  color:var(--stage-ink);cursor:pointer}
.pipon:hover{border-color:var(--teal);color:var(--teal)}
.pipin{display:inline-flex;align-items:center;gap:7px;background:#EEF7F4;
  border:1px solid #9AC9BC;border-radius:9px;padding:8px 15px;
  font-family:var(--f-b);font-weight:600;font-size:13.5px;color:#0B6F5C}
.pipoff{border:1px solid var(--stage-rule);background:var(--card);border-radius:9px;
  padding:8px 15px;font-family:var(--f-b);font-weight:600;font-size:13.5px;
  color:var(--stage-mute);cursor:pointer}
.pipoff:hover{border-color:#D9534F;color:#B5341F;background:#FDF2F1}

/* today pipeline */
.pipnote{margin:0 0 18px;font-size:12.5px;line-height:1.65;color:var(--stage-mute);max-width:720px}
.piptop{border:1px solid var(--stage-rule);border-radius:11px;padding:14px 16px;
  margin-bottom:11px;background:#fff}
.piph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-bottom:9px}
.piph h4{margin:0;font-family:var(--f-d);font-weight:700;font-size:15px;color:var(--stage-ink)}
.piph span{font-family:var(--f-m);font-size:10.5px;color:var(--stage-mute)}
.piprow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:stretch;
  border-top:1px solid var(--stage-rule)}
.piprow:first-of-type{border-top:none}
.pipgo{display:block;text-align:left;background:none;border:none;cursor:pointer;
  padding:9px 4px;color:var(--stage-ink)}
.pipgo:hover span{color:var(--teal)}
.pipgo span{display:block;font-size:13px;line-height:1.45}
.pipgo em{display:block;font-style:normal;font-family:var(--f-m);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--stage-mute);margin-top:3px}
.piprow.done .pipgo span{color:var(--stage-mute)}
.pipdel{border:1px solid transparent;background:none;border-radius:7px;width:30px;
  font-size:17px;line-height:1;color:var(--faint);cursor:pointer}
.pipdel:hover{background:#FDF2F1;border-color:#EBC9C6;color:#B5341F}
.navpair .dashbtn{margin-bottom:0;text-align:center;padding:9px 6px}
.dashbtn{width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-radius:9px;padding:10px 13px;font-family:var(--f-b);font-weight:600;font-size:14px;
  color:var(--ink);cursor:pointer}
.dashbtn:hover{border-color:var(--mute)}
.dashbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.icard h4 u.tagi{text-decoration:none;font-family:var(--f-m);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--stage-mute);margin-left:6px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 16px}
.bstat{border:1px solid var(--rule);border-radius:10px;padding:11px 13px}
.bstat span{display:block;font-family:var(--f-m);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.bstat b{font-family:var(--f-m);font-size:21px;font-variant-numeric:tabular-nums}
.brows{display:grid;gap:7px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.brow .bq{font-size:14px}
.brow .bq em{font-family:var(--f-m);font-style:normal;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);margin-left:6px}
.brow .bn{font-family:var(--f-m);font-size:14px;font-variant-numeric:tabular-nums}
.brow i{grid-column:1/-1;height:6px;border-radius:99px;background:var(--stage-soft);overflow:hidden;display:block}
.brow i u{display:block;height:100%;background:var(--amber);text-decoration:none}
.brow.lag .bn{color:#B5541F}
.ownblk{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.ownblk .ownnote{margin:2px 0 12px;font-size:12px;color:var(--mute)}
.owngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.icard{border:1px solid var(--stage-rule);border-radius:10px;padding:13px 15px}
.icard h4{font-family:var(--f-b);font-weight:600;font-size:14px;margin:0 0 10px;
  color:var(--stage-ink);display:flex;gap:10px;align-items:baseline;justify-content:space-between}
/* A question that fewer people answered is the one to look at, so its own
   count sits on its own card rather than only in the total at the top. */
.icard h4 em{font-family:var(--f-m);font-style:normal;font-size:11px;letter-spacing:.04em;
  color:var(--stage-mute);white-space:nowrap;font-weight:500}
.icard h4 em.short{color:#B5541F}
.irow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline;margin-bottom:7px}
.irow span{font-size:13px;color:var(--stage-mute)}
.irow em{font-style:normal;font-family:var(--f-m);font-size:13px;font-weight:600;color:var(--stage-ink)}
.irow i{grid-column:1/-1;display:block;height:13px;border-radius:99px;background:var(--stage-soft);overflow:hidden}
.irow i u{display:block;height:100%;background:#0B6F5C;border-radius:99px}
.irow.top i u{background:#E8A81C} .irow.top em{color:#9C7222}
@media(max-width:1180px){ .igrid{grid-template-columns:1fr 1fr} }
@media(max-width:760px){ .igrid{grid-template-columns:1fr} }

/* the intro block, previewed whole on the presenter's screen */
.blk{display:flex;flex-direction:column;gap:10px}
.bq{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;
  border:1px solid var(--stage-rule);border-radius:10px;padding:12px 14px}
.bqn{margin:2px 0 0;font-family:var(--f-m);font-size:12px;color:var(--stage-mute);text-align:center}
.bq h3{font-family:var(--f-d);font-weight:700;font-size:17px;margin:0;line-height:1.3}
.blead{margin:0 0 3px;font-size:13.5px;color:var(--stage-mute);line-height:1.4}
.bopts{margin:6px 0 0;font-size:13.5px;color:var(--stage-mute);line-height:1.5}
.tiny{margin-top:8px;border:1px solid var(--stage-rule);background:var(--stage-soft);
  color:var(--stage-ink);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:var(--f-b)}
.tiny:hover{background:#E1E8F1}

/* in or out of today's poll — the library is not touched */
.qrow{display:grid;grid-template-columns:1fr 22px;align-items:start;gap:2px}
.lvtag{font-family:var(--f-m);font-size:10px;font-weight:600;color:var(--faint);
  text-align:center;padding-top:9px;letter-spacing:.02em}
.lv-Early{color:#2E7D57}.lv-Mid{color:#9C7222}.lv-Senior{color:#8A4B2A}
.qrow .qbtn{width:100%}
.tog{background:none;border:1px solid transparent;border-radius:7px;color:var(--faint);
  font-size:15px;line-height:1;cursor:pointer;padding:6px 0;width:24px;margin-top:7px;font-family:var(--f-b)}
.tog:hover{border-color:var(--rule);color:var(--ink-2);background:var(--rule-2)}
.qrow.out .qbtn span{color:var(--faint);text-decoration:line-through}
.qrow.out .tog{color:var(--teal)}
.bq.out{opacity:.45}
.bq.out h3{text-decoration:line-through}
</style>
</head>

      'Script, paste in the new Code-poll.gs, Save, then Deploy \u2192 Manage deployments '+

/* the same mark as the header, reused on the report */

/* Which pillars are open in the sidebar. Closed by default except the one you

/* PLANWANT is what you last ticked. Until Google has confirmed it, this is what

var PLANWANT=null, PLANQ=Promise.resolve();

function inPlan(name){ return planList().indexOf(name)>=0; }

function setPlan(list){

var META={company:'',title:'',date:'',time:'',place:'',participants:'',duration:''};

/* ---- talking to the sheet ---- */
/* Two roads to Google. The normal one reads the reply directly. Some office
   laptops and privacy settings allow the request out but block the page from
   reading what comes back — on those, loading the answer as a script still
   works. Once the first road is known to be shut, we stop trying it. */
var VIA_SCRIPT=false, CBN=0;

function qstr(params){
  return Object.keys(params).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
}

function call(params){
  if(VIA_SCRIPT) return callScript(params);
  return fetch(ENDPOINT+'?'+qstr(params),{method:'GET',redirect:'follow'})
    .then(function(r){ return r.json(); })
    .catch(function(e){
      return callScript(params).then(function(d){ VIA_SCRIPT=true; return d; });
    });
}

/* Rewritten lines are far too long for a web address, so they are posted
   rather than appended. The script reads posted fields the same way. */
function callPost(params){
  return fetch(ENDPOINT,{ method:'POST', redirect:'follow',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:qstr(params) })
    .then(function(r){ return r.json(); });
}

function callScript(params){
  return new Promise(function(res,rej){
    var cb='jgnu'+(++CBN)+'_'+Math.floor(Math.random()*1e6);
    var el=document.createElement('script'), done=false;
    var t=setTimeout(function(){ finish(); rej(new Error('timed out')); },15000);
    function finish(){
      if(done) return; done=true; clearTimeout(t);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(el.parentNode) el.parentNode.removeChild(el);
    }
    window[cb]=function(d){ finish(); res(d); };
    el.onerror=function(){ finish(); rej(new Error('could not reach Google')); };
    var p={}; for(var k in params) p[k]=params[k];
    p.jsfn=cb;
    el.src=ENDPOINT+'?'+qstr(p);
    document.head.appendChild(el);
  });
}

/* The room asks a tiny question on a loop — "has anything changed?" — and pays
   for a full reply only when the answer is different. While results are on
   show the bars must move, so that case always fetches in full. */
var TICK=null;

function refresh(){
  if(BUSY || !ENDPOINT) return Promise.resolve();
  /* Nothing to fetch until the presenter is in, and refreshing here would
     redraw the code box and wipe what is being typed. */
  if(MODE!=='aud' && !CODE) return Promise.resolve();
  if(MODE==='aud' && S && !S.revealed && TICK){
    BUSY=true;
    return call({act:'tick'}).then(function(d){
      BUSY=false; FAILS=0;
      if(d && d.ok && d.v===TICK) return;      // nothing new — stop here
      return fullState();
    }).catch(function(){ BUSY=false; FAILS++; render(); });
  }
  return fullState();
}

function fullState(){
  BUSY=true;
  var p={act:'state'};
  if(MODE!=='aud' && CODE) p.code=CODE;
  return call(p).then(function(d){
    BUSY=false; FAILS=0;
    if(!d || !d.ok) return;
    if(d.v) TICK=d.v;
    var wasBlock = S ? ((S.block)||(S.intro?introTopic():'')) : '';
    var nowBlock = (d.block)||(d.intro?((d.introTopic)||'Intro'):'');
    if((S && S.sessionId!==d.sessionId) || wasBlock!==nowBlock){
      /* A different block is a different set of answers — the tick from the
         last one must not greet people on this one. */
      INTRO_SENT=false; INTRO_BUSY=false; INTRO_FAIL=false; INTRO_WHY=''; INTRO_AT=0; INTRO_DONE={};
      if(S && S.sessionId!==d.sessionId){ MYANS={}; VSTATE={}; VQ={}; VSENT={}; }
    }
    /* A reply that left before your last tick still carries the old list —
       your choice wins until Google has confirmed it. */
    if(PLANWANT) d.plan=PLANWANT.slice();
    if(RUNWANT) d.run=RUNWANT.slice();
    S=d; if(d.meta && METASAVE===null) META=d.meta; trackClock(); render();
  }).catch(function(){ BUSY=false; FAILS++; render(); });
}

/* ---- shared helpers ---- */
/* "43 of 150" is the presenter's own check that nobody is being dropped —
   the room size comes from what was typed when the poll was started. */
/* Just the time from a stored timestamp — the date is already on the report. */
function clockOf(v){
  try{ var d=new Date(v); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function roomSize(){
  var a=parseInt(META&&META.attended,10);
  if(a>0) return a;
  var n=parseInt(META&&META.participants,10);
  return (n>0)?n:0;
}
function ofRoom(n){ var r=roomSize(); return r?(n+' of '+r):String(n); }

function questions(){ return (S && S.questions) || []; }
function activeQ(){
  var qs=questions(); if(!S || !S.activeId) return null;
  for(var i=0;i<qs.length;i++) if(qs[i].id===S.activeId) return qs[i];
  return null;
}
/* What the presenter is LOOKING at, which is not always what the room is
   answering — she lines a question up first, then asks it. */
function selectedQ(){
  var qs=questions(), id=SEL||(S&&S.activeId);
  for(var i=0;i<qs.length;i++) if(qs[i].id===id) return qs[i];
  return null;
}
function isLive(q){ return !!(q && S && S.activeId===q.id); }
function askedList(){ return (S && S.asked) || []; }
function offList(){ return (S && S.off) || []; }
function isOn(q){ return !!q && offList().indexOf(q.id)<0; }
function setOn(id,on){ send({act:'set', off:id, on: on?1:0}); }
function introTopic(){ return (S && S.introTopic) || 'Intro'; }
function blockTopics(){ return (S && S.blockTopics) || [introTopic()]; }
function isBlockTopic(t){ return blockTopics().indexOf(t)>=0; }
function openBlock(){ return (S && S.block) || (S && S.intro ? introTopic() : ''); }
function blockQs(t){ return questions().filter(function(q){ return q.topic===t; }); }
function blockLive(t){ return blockQs(t).filter(isOn); }
/* One question in the feedback block only makes sense to somebody who has just
   said they want more sessions, so it is not there until they do. */
function blockShown(t){
  return blockLive(t).filter(function(q){
    if(!q.follows) return true;
    return String(MYANS[q.follows])==='0';        /* the first option is Yes */
  });
}
function answered(q){
  var v=MYANS[q.id];
  return q.multi ? !!(v && String(v).length) : v!==undefined;
}
function picked(q,i){
  if(!q.multi) return MYANS[q.id]===i;
  return String(MYANS[q.id]||'').split('|').indexOf(String(i))>=0;
}
function blockCounts(t){
  var b=(S && S.blocks && S.blocks[t]) || null;
  if(b) return b;
  if(t===introTopic() && S && S.introCounts) return {counts:S.introCounts, people:S.introPeople||0};
  return {counts:{}, people:0};
}
/* What the room is told when a block opens. */
var BLOCK_TEXT = {
  'Intro':    { hello:"Hi folks \u2014 five quick taps, so I know who's in the room \ud83d\ude42",
                priv:"This info remains anonymous \u2014 Khushbu won't know who said what.",
                done:"That is all for now \u2014 keep this page open for the questions." },
  'Feedback': { hello:"Before you go \u2014 three quick taps",
                priv:"Anonymous, as always. Your name is never recorded.",

};
function blockText(t){ return BLOCK_TEXT[t] || {hello:t, priv:''}; }
function introQs(){ return blockQs(introTopic()); }
function introLive(){ return blockLive(introTopic()); }
function wasAsked(q){ return !!q && askedList().indexOf(q.id)>=0; }
/* The intro describes the room rather than testing it, so it is not one of
   the polls done. */
function pollsDone(){
  var it=introTopic();
  return askedList().filter(function(id){
    var q=questions().filter(function(x){ return x.id===id; })[0];
    return q && q.topic!==it;
  }).length;
}
function introAsked(){ return introQs().some(wasAsked); }
/* The room counts in the order questions were asked, not their place in the list. */
function askedNumber(q){ var i=askedList().indexOf(q.id); return i<0 ? null : i+1; }
function counts(q){
  var c=[], total=0, by=(isLive(q) && S.counts && S.counts.by)||{};
  for(var i=0;i<q.options.length;i++){ var n=+by[i]||0; c.push(n); total+=n; }
  return {counts:c, total:(isLive(q) && S.counts ? S.counts.total : 0)};
}

/* ---- audience ---- */

  if(!ENDPOINT) return setup();
  if(!S){
    app.innerHTML='<div class="aud"><div class="rest"><span class="dot"></span>'+
      '<h2>'+(FAILS>2?'Trouble connecting':'Connecting')+'</h2>'+
      '<p>'+(FAILS>2?'Check your internet and keep this page open &mdash; it keeps trying.'
                    :'One moment.')+'</p></div></div>';
